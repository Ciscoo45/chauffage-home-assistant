blueprint:
  name: Chauffage by C. - Absence Auto - Par Pièce
  description: |
  
    version Absence Auto – Par Pièce : v1.70 – 2025-12-23
    
    auteur : Ciscoo45
    
    
    ___
    
    ## Description
    
    Blueprint **par pièce** permettant de calculer automatiquement une **consigne finale de chauffage**
    en fonction :
    
    - de la présence des utilisateurs
    - du mode de chauffage actif
    - du boost
    - des règles d’absence (globale et par utilisateur principal)
    
    Ce blueprint **ne pilote pas directement le chauffage** :
    il produit une **consigne finale** destinée à être utilisée par :
    
    - le Thermostat TPI
    - le blueprint de Pilotage
    
    
    ___
    
    ## Rôle exact du blueprint
    
    Ce blueprint :
    
    - Calcule une **consigne Absence** à partir :
      - de la consigne de base
      - ou de la consigne Tempo (si utilisée)
    
    - Applique une **réduction supplémentaire** uniquement dans certains cas
    
    - Met à jour :
      - `radiateur_xxx_consigne_absence`
      - `radiateur_xxx_consigne_finale`
    
    - Peut forcer le passage **Presence → Absence**
      si l’utilisateur principal devient absent
    
    
    ___
    
    ## Logique de réduction
    
    La réduction (ex. -2°C) est appliquée **UNIQUEMENT SI** :
    
    - la gestion Absence Auto globale est **ON**
    - la gestion Absence Auto de la pièce est **ON**
    - le mode est **Absence** ou **Manuel**
    - le boost est **OFF**
    - et :
      - soit **l’utilisateur principal est absent**
      - soit la pièce est déjà en Absence
    
    
    ___
    
    ## Cas particuliers importants
    
    - **Transition Presence → Absence** :
      - Aucune réduction supplémentaire
      - Le Scheduler est censé gérer la consigne Absence
    
    - **Mode Manuel** :
      - La réduction Absence Auto peut s’appliquer
    
    - **Mode Hors-gel ou Arret** :
      - Aucune réduction
      - La consigne finale est forcée (0 ou HG)
    
    - **Boost actif** :
      - Ignore totalement l’Absence Auto
    
    
    ___
    
    ## Ce blueprint NE FAIT PAS
    
    - ❌ Ne pilote pas directement le chauffage
    - ❌ Ne déclenche pas de cycle Arret / Presence
    - ❌ Ne modifie pas les consignes Boost
    - ❌ Ne modifie pas les modes Hors-gel ou Arret
    
    
    ___
    
    ## Ordre de priorité des consignes
    
    1. **Boost actif**
       → consigne Boost (gérée ailleurs)
    
    2. **Absence Auto**
       → `radiateur_xxx_consigne_absence`
    
    3. **Tempo**
       → `radiateur_xxx_consigne_tempo`
    
    4. **Normal**
       → `radiateur_xxx_consigne`
    
    
    ___
    
    ## Architecture recommandée
    
    - 1 blueprint **Absence Auto – Globale**
      → gère les **transitions de mode**
    
    - 1 blueprint **Absence Auto – Par Pièce**
      → gère le **calcul de consigne**
    
    - 1 blueprint **Thermostat / Pilotage**
      → applique physiquement la consigne
    
    
    ___
    
    ## Philosophie
    
    Ce blueprint applique une logique **déterministe, lisible et traçable** :
    
    - chaque réduction est justifiée
    - chaque consigne est calculée explicitement
    - aucune règle implicite ou cachée
    
    L’objectif est une gestion Absence **robuste, prévisible et débogable**.

    
    ___
    
    ## Paramétrage du Blueprint
    
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto_-_Pieces.yaml
  domain: automation

  input:
    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex: SdB, Salon, Bureau)"
      selector:
        text:

    # === GLOBAL - DETECTION PRESENCE ===
    binary_sensor_tous_absents:
      name: 👥 Chauffage - Tous Utilisateurs Absents (global)
      description: |
        Binary_sensor indiquant si tous les utilisateurs sont absents.

        Ex. : binary_sensor.chauffage_tous_utilisateurs_absents
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_1_absent:
      name: 👤 Utilisateur 1 Absent (obligatoire)
      description: |
        Binary sensor pour le premier utilisateur
      
        (obligatoire, ex. Chauffage Michel Absent)
      default: binary_sensor.chauffage_utilisateur1_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_2_absent:
      name: 👤 Utilisateur 2 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le deuxième utilisateur
      
        (optionnel, ex. Chauffage François Absent, laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur2_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_3_absent:
      name: 👤 Utilisateur 3 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le troisième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur3_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_4_absent:
      name: 👤 Utilisateur 4 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le quatrième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur4_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_5_absent:
      name: 👤 Utilisateur 5 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le cinquième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur5_absent
      selector:
        entity:
          domain: binary_sensor

    # === par PIECE - CONSIGNES ===
    consigne_base:
      name: 🌡️ 🎯 Radiateur (pièce) Consigne
      description: "Consigne de base, définie par l'utilisateur (input_number, modifié via UI/modes/schedules)"
      selector:
        entity:
          domain: input_number

    consigne_tempo:
      name: 🎯 (pièce) Consigne Calculée Tempo Eco (optionnel)
      description: "Consigne corrigée par Tempo Eco (laisser vide si Tempo non utilisé)"
      default: ""
      selector:
        entity:
          domain: input_number

    consigne_absence:
      name: ❄️ (pièce) Consigne Absence
      description: "Consigne corrigée selon Absence Auto (sortie, calculée par ce blueprint)"
      selector:
        entity:
          domain: input_number

    consigne_finale:
      name: ✅ (pièce) Consigne Finale
      description: "Consigne finale à utiliser dans Thermostat TPI et Pilotage (sortie)"
      selector:
        entity:
          domain: input_number

    consigne_avant_absence:
      name: 💾 (pièce) Consigne Avant Absence 
      description: "Stockage de la consigne avant départ (pour restauration)"
      selector:
        entity:
          domain: input_number

    # === GLOBAL - REDUCTION ===
    reduction_degrees:
      name: ➖ Réduction de température en absence (global)
      description: "Nombre de degrés à retirer en mode Absence ou Manuel (si on n'était pas en mode Presence → Absence)"
      default: input_number.chauffage_absence_auto_reduction_degrees
      selector:
        entity:
          domain: input_number

    # === GLOBAL - ACTIVATION ===
    switch_global:
      name: 🌐 Gestion Absence Auto Globale (global)
      description: "Désactive toutes les corrections Absence (toutes pièces) si OFF"
      default: input_boolean.chauffage_absence_auto_global_actif
      selector:
        entity:
          domain: input_boolean
          
    # === par PIECE - ACTIVATION ===
    switch_local:
      name: 🏠 (pièce) Gestion Absence Auto 
      description: "Désactive les corrections Absence Auto pour cette pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    switch_si_principal_absent:
      name: 👤 (pièce) Absence si utilisateur principal absent
      description: "Appliquer la réduction même si d'autres utilisateurs sont présents"
      selector:
        entity:
          domain: input_boolean

    utilisateur_principal:
      name: 👤 (pièce) Utilisateur Principal
      description: "Choix de l'utilisateur principal (utilise la liste définie dans chauffage_absence_auto_config_package.yaml)"
      selector:
        entity:
          domain: input_select

    # === par PIECE - MODE ===
    mode_actuel:
      name: 🎚️ Radiateur (pièce) Mode 
      description: "Mode de chauffage, choisi via la carte Lovelace (Presence, Absence, Manuel, Hors-gel, Arret)"
      selector:
        entity:
          domain: input_select

    mode_avant_absence:
      name: 💾 (pièce) Mode Avant Absence
      description: "Stockage du mode actif avant départ (pour restauration ET calcul réduction)"
      selector:
        entity:
          domain: input_select

    boost_actif:
      name: ⚡ Boost (pièce - optionnel)
      description: "Si le boost est ON, ignore les corrections Absence Auto pour cette pièce"
      default: ""
      selector:
        entity:
          domain: input_boolean




# ========= VARIABLES =========
variables:

  piece_name: !input piece_name
  consigne_base: !input consigne_base
  consigne_tempo_input: !input consigne_tempo
  consigne_absence: !input consigne_absence
  consigne_finale: !input consigne_finale
  consigne_avant_absence: !input consigne_avant_absence
  reduction_degrees: !input reduction_degrees
  switch_global: !input switch_global
  switch_local: !input switch_local
  switch_si_principal_absent: !input switch_si_principal_absent
  mode_actuel: !input mode_actuel
  mode_avant_absence: !input mode_avant_absence
  binary_sensor_tous_absents: !input binary_sensor_tous_absents
  binary_sensor_utilisateur_1_absent: !input binary_sensor_utilisateur_1_absent
  binary_sensor_utilisateur_2_absent: !input binary_sensor_utilisateur_2_absent
  binary_sensor_utilisateur_3_absent: !input binary_sensor_utilisateur_3_absent
  binary_sensor_utilisateur_4_absent: !input binary_sensor_utilisateur_4_absent
  binary_sensor_utilisateur_5_absent: !input binary_sensor_utilisateur_5_absent
  boost_actif_input: !input boost_actif
  utilisateur_entity: !input utilisateur_principal

  liste_utilisateurs: >-
    {% set opts = state_attr('input_select.chauffage_absence_auto_liste_utilisateurs','options') or [] %}
    {{ opts[1:] }}

  mode_actuel_valeur: "{{ states(mode_actuel) }}"      # était après consigne_source, mais cette variable utilise la variable mode_actuel_valeur qui n'était alors pas encore définie
  
  consigne_source: >-
    {% set tempo_input = consigne_tempo_input %}
    {% if mode_actuel_valeur in ['Hors-gel','Arret'] %}
      {{ states(consigne_base) | float(19) }}
    {% elif tempo_input not in ['','none',None] and states(tempo_input) not in ['unknown','unavailable',''] %}
      {{ states(tempo_input) | float(19) }}
    {% else %}
      {{ states(consigne_base) | float(19) }}
    {% endif %}

  mode_avant_valeur: "{{ states(mode_avant_absence) }}"

  principal: "{{ states(utilisateur_entity) }}"

  principal_absent: >-
    {% set entities = states('input_text.chauffage_absence_auto_utilisateurs_entities').split(',') %}
    {% set noms = liste_utilisateurs %}
    {% set principal_name = states(utilisateur_entity) %}
    {% if principal_name in noms %}
      {% set idx = noms.index(principal_name) %}
      {% if idx < entities|length and entities[idx] not in ['','unknown','unavailable'] %}
        {% if entities[idx].startswith('binary_sensor.') %}
          {{ not is_state(entities[idx],'on') }}
        {% elif entities[idx].startswith('person.') %}
          {{ is_state(entities[idx],'not_home') }}
        {% else %}
          {{ false }}
        {% endif %}
      {% else %}
        {{ false }}
      {% endif %}
    {% else %}
      {{ false }}
    {% endif %}

  reduction: >-
    {% set mode_actif = mode_actuel_valeur in ['Presence','Absence','Manuel'] %}
    {% set boost_on = boost_actif_input not in ['','none',None] and is_state(boost_actif_input,'on') %}
    {% set principal_rule = is_state(switch_si_principal_absent,'on') and (principal_absent | bool) %}
    {% set transition_pa = (mode_avant_valeur == 'Presence' and mode_actuel_valeur == 'Absence') %}
    {% set everybody_absent = is_state(binary_sensor_tous_absents,'on') %}

    {% if not is_state(switch_global,'on') %}
      0
    {% elif not is_state(switch_local,'on') %}
      0
    {% elif mode_actuel_valeur in ['Hors-gel','Arret'] %}
      0
    {% elif not mode_actif %}
      0
    {% elif boost_on %}
      0
    {% elif principal_rule and not everybody_absent %}
      {% if transition_pa %}
        0
      {% elif mode_actuel_valeur in ['Absence','Manuel'] %}
        {{ states(reduction_degrees) | float(2) }}
      {% else %}
        0
      {% endif %}
    {% else %}
      0
    {% endif %}

  consigne_absence_calc: "{{ (consigne_source | float) - (reduction | float) }}"
  consigne_finale_calc: "{{ consigne_absence_calc | float }}"




# ========= DÉCLENCHEURS =========
trigger:

  # Recalcul quand la consigne de base change
  - platform: state
    entity_id: !input consigne_base

  # Recalcul quand la consigne Tempo change (si existe)
  - platform: state
    entity_id: !input consigne_tempo

  # Recalcul quand la réduction change
  - platform: state
    entity_id: !input reduction_degrees

  # Recalcul quand les switches changent
  - platform: state
    entity_id:
      - !input switch_global
      - !input switch_local
      - !input switch_si_principal_absent

  # Recalcul quand l'utilisateur principal change
  - platform: state
    entity_id: !input utilisateur_principal

  # Recalcul quand le mode change
  - platform: state
    entity_id:
      - !input mode_actuel
      - !input mode_avant_absence

  # Recalcul quand la détection de présence change
  - platform: state
    entity_id:
      - !input binary_sensor_tous_absents
      - !input binary_sensor_utilisateur_1_absent
      - !input binary_sensor_utilisateur_2_absent
      - !input binary_sensor_utilisateur_3_absent
      - !input binary_sensor_utilisateur_4_absent
      - !input binary_sensor_utilisateur_5_absent

  # Recalcul quand le boost change (si fourni)
  - platform: state
    entity_id: !input boost_actif

  # Au démarrage de HA
  - platform: homeassistant
    event: start

  # Au rechargement des automations
  - platform: event
    event_type: automation_reloaded




condition: []





# ========= ACTIONS =========
action:

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ is_state(switch_si_principal_absent,'on') 
                 and (principal_absent | bool) 
                 and is_state(mode_actuel,'Presence') }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_avant_absence
            data:
              option: "{{ mode_actuel_valeur }}"
          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data: 
              option: "Absence"

  # Mise à jour des consignes (dont Arret / Hors-gel)
  - choose:

      # Cas Arret
      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur == 'Arret' }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_absence
            data:
              value: 0
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: 0

      # Cas Hors-gel
      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur == 'Hors-gel' }}"
        sequence:
          - delay:
              seconds: 1   # laisser Pilotage écrire la consigne HG dans consigne_base
          - service: input_number.set_value
            target:
              entity_id: !input consigne_absence
            data:
              value: "{{ states(consigne_base) | float }}"
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_base) | float }}"

      # Autres modes (Presence / Absence / Manuel)
      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur not in ['Hors-gel', 'Arret'] }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_absence
            data:
              value: "{{ consigne_absence_calc | float }}"
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ consigne_finale_calc | float }}"

  # Log pour débogage (CORRIGÉ : cast bool explicite)
  - service: logbook.log
    data:
      name: "Absence Auto {{ piece_name }}"
      message: >-
        Mode: {{ mode_actuel_valeur }} (avant: {{ mode_avant_valeur }})
        Consigne: {{ consigne_source }}°C → {{ consigne_finale_calc }}°C
        (réduction: -{{ reduction }}°C
        {% if not is_state(switch_global, 'on') %}[Global OFF]{% endif %}
        {% if not is_state(switch_local, 'on') %}[Local OFF]{% endif %}
        {% if mode_actuel_valeur not in ['Presence', 'Absence', 'Manuel'] %}[Mode inactif: {{ mode_actuel_valeur }}]{% endif %}
        {% if boost_actif_input not in ['', 'none', None] and is_state(boost_actif_input, 'on') %}[Boost actif]{% endif %}
        {% if mode_avant_valeur == 'Presence' and mode_actuel_valeur == 'Absence' %}[Transition P→A, Scheduler gère]{% endif %}
        {% if is_state(binary_sensor_tous_absents, 'on') %}[Tous absents]{% endif %}
        {% if is_state(switch_si_principal_absent, 'on') and (principal_absent | bool) %}[{{ principal }} absent]{% endif %})

mode: queued
max: 5
