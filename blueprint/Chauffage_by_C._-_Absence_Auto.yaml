blueprint:
  name:  Chauffage by C.  - Absence Auto
  description: |

    version Absence Auto – par Pièce :  v2.45 – 2026-01-01

    auteur :  Ciscoo45

    ___

    ## Description

    Blueprint **par pièce** autonome gérant : 

    - Détection "tous absents" ET "utilisateur principal absent"
    - Changements de mode automatiques
    - Sauvegarde des états avant départ
    - Restauration au retour
    - Calcul de consigne finale avec réductions

    ___

    ## ⚠️ Configuration préalable OBLIGATOIRE

    Ce blueprint nécessite une **configuration globale** créée en amont dans un package YAML.

    **Fichier requis** : `packages/chauffage_absence_auto_config_package.yaml`

    Ce fichier doit contenir : 

    ### **input_select** (liste des utilisateurs) :

    ```yaml
    input_select:
      chauffage_absence_auto_liste_utilisateurs:
        name: "Liste des utilisateurs"
        options: 
          - "Aucun"
          - "Michel"
          - "François"
          - "Sophie"
          # Ajoutez vos utilisateurs ici (max 5)
        icon: mdi:account-multiple
    ```

    ### **input_text** (mapping utilisateurs → entités) :

    ```yaml
    input_text:
      chauffage_absence_auto_utilisateurs_entities:
        name: "Utilisateurs - Entités"
        initial: "person.michel,person.francois,person.sophie"
        # Format : liste séparée par des virgules, dans le MÊME ORDRE que la liste ci-dessus
        # Vous pouvez utiliser des entités person.xxx OU binary_sensor.xxx_absent
        icon: mdi:link-variant
    ```

    ### **binary_sensor** (tous absents - template) :

    ```yaml
    binary_sensor:
      - platform: template
        sensors:
          chauffage_tous_utilisateurs_absents:
            friendly_name: "Chauffage - Tous Utilisateurs Absents"
            value_template: >-
              {{ is_state('person.michel', 'not_home')
                 and is_state('person.francois', 'not_home')
                 and is_state('person.sophie', 'not_home') }}
            icon_template: >-
              {{ 'mdi:home-off' if is_state('binary_sensor.chauffage_tous_utilisateurs_absents', 'on') else 'mdi:home' }}
    ```

    ### **binary_sensor** (utilisateurs individuels - optionnel) :

    Si vous utilisez la fonction "Utilisateur principal", créez des sensors individuels :

    ```yaml
    binary_sensor:
      - platform: template
        sensors:
          chauffage_utilisateur1_absent:
            friendly_name: "Chauffage Michel Absent"
            value_template:  "{{ is_state('person.michel', 'not_home') }}"

          chauffage_utilisateur2_absent:
            friendly_name: "Chauffage François Absent"
            value_template:  "{{ is_state('person.francois', 'not_home') }}"

          chauffage_utilisateur3_absent: 
            friendly_name: "Chauffage Sophie Absent"
            value_template: "{{ is_state('person.sophie', 'not_home') }}"
    ```

    ⚠️ **IMPORTANT** : 
    - L'ordre dans `chauffage_absence_auto_liste_utilisateurs` doit correspondre à l'ordre dans `chauffage_absence_auto_utilisateurs_entities`
    - Exemple : "Michel" (position 1) → `person.michel` (position 1)

    📁 **Voir le fichier d'exemple complet** :  `config_examples/chauffage_absence_auto_config_package.yaml`

    ___

    ## Logique de changement de mode

    ### Départ (tous OU principal)

    - **Mode Presence** → passe en Absence (Scheduler gère consigne)
    - **Mode Absence** → reste Absence, applique réduction (défaut -2°C)
    - **Mode Manuel** → reste Manuel, applique réduction (défaut -2°C)
    - **Mode Arret/Hors-gel** → aucun changement

    ### Retour

    - **Si mode changé automatiquement** → restaure mode précédent (Presence)
    - **Sinon** → supprime la réduction uniquement

    ___

    ## Logique de réduction

    Réduction appliquée **UNIQUEMENT SI** : 

    - Gestion Absence Auto globale **ON**
    - Gestion Absence Auto de la pièce **ON**
    - Boost **OFF**
    - Utilisateur(s) absent(s) (Tous OU Principal)
    - Mode = Absence OU Manuel

    **PAS de réduction** si : 
    - Mode = Presence (transition gérée par Scheduler)
    - Mode = Arret ou Hors-gel → aucune action

    ___

    ## Ordre de priorité des consignes

    1. **Boost actif** → `consigne_finale = consigne_base` (ignore tout le reste)
    2. **Module désactivé** → `consigne_finale = consigne_source` (Tempo si actif, sinon base)
    3. **Absence Auto actif + Presence** → `consigne_finale = consigne_source` (Scheduler gère)
    4. **Absence Auto actif + Absence/Manuel** → `consigne_finale = consigne_source - réduction` (-2°C défaut)
    5. **Normal** → `consigne_finale = consigne_source`

    Avec :  `consigne_source = consigne_tempo` (si module Tempo utilisé) OU `consigne_base` (sinon)

    ___

    ## Avantages de la v2.0

    ✅ Plus de problème de synchronisation (tout dans 1 blueprint)
    ✅ Logique claire et traçable
    ✅ Pas de conflit entre blueprints
    ✅ Plus besoin du blueprint Globale

    ___

    ## Helpers à créer par pièce

    **input_number** : 

    - `radiateur_xxx_consigne` : consigne de base (existant)
    - `radiateur_xxx_consigne_tempo` :  consigne corrigée par Tempo ⚠️ **UNIQUEMENT si module Tempo utilisé**
    - `radiateur_xxx_consigne_finale` : consigne finale utilisée par Thermostat TPI ⭐ **NOUVEAU**

    **input_boolean** :

    - `chauffage_absence_auto_global_actif` : activation globale (commun)
    - `radiateur_xxx_absence_auto_actif` : activation locale
    - `radiateur_xxx_absence_si_principal_absent` : réduction si utilisateur principal absent
    - `radiateur_xxx_etait_presence` : état avant départ ⭐ **NOUVEAU**
    - `boost_xxx` : état du boost ⚠️ **UNIQUEMENT si module Boost utilisé**

    **input_select** :

    - `radiateur_xxx_mode` : mode actuel (existant)
    - `radiateur_xxx_utilisateur_principal` : choix de l'utilisateur ⭐ **NOUVEAU**

    ⚠️ **IMPORTANT - Configuration si Tempo NON utilisé** :

    Dans la configuration du blueprint, sélectionnez **la même entité** pour :
    - "Radiateur (pièce) Consigne" → `input_number.radiateur_xxx_consigne`
    - "Consigne Calculée Tempo Eco" → `input_number.radiateur_xxx_consigne` (même entité)

    ⚠️ **IMPORTANT - Configuration si Boost NON utilisé** :

    Laissez le champ "Boost" vide.  Le blueprint gérera automatiquement. 

    Voir `config_examples/` pour les définitions complètes. 




  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto.yaml
  domain: automation




  input: 

    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex.  :  SdB, Salon, Bureau)"
      selector:
        text: {}

    # === DETECTION PRESENCE ===
    binary_sensor_tous_absents:
      name:  👥 Chauffage - Tous Utilisateurs Absents (global)
      description: |
        Binary_sensor indiquant si tous les utilisateurs sont absents. 

        Ex. : binary_sensor.chauffage_tous_utilisateurs_absents
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_1_absent:
      name: 👤 Utilisateur 1 Absent (obligatoire)
      description: |
        Binary sensor pour le premier utilisateur

        (obligatoire, ex.  Chauffage Michel Absent)

        ⚠️ Ces sensors sont utilisés uniquement comme triggers pour recalculer les consignes.
        La logique principale utilise `binary_sensor_tous_absents` et `utilisateur_principal`.
      default: binary_sensor.chauffage_utilisateur1_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_2_absent:
      name: 👤 Utilisateur 2 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le deuxième utilisateur

        (optionnel, ex.chauffage François Absent, laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur2_absent
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_3_absent:
      name:  👤 Utilisateur 3 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le troisième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur3_absent
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_4_absent:
      name: 👤 Utilisateur 4 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le quatrième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur4_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_5_absent:
      name: 👤 Utilisateur 5 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le cinquième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur5_absent
      selector:
        entity:
          domain: binary_sensor

    # === CONSIGNES ===
    consigne_base: 
      name: 🌡️ 🎯 Radiateur (pièce) Consigne
      description: "Consigne de base, définie par l'utilisateur (input_number, modifié via UI/modes/schedules)"
      selector:
        entity:
          domain: input_number

    consigne_tempo:
      name: 🎯 (pièce) Consigne Calculée Tempo Eco (optionnel)
      description: |
        Consigne corrigée par Tempo Eco. 

        ⚠️ **Si vous N'utilisez PAS Tempo** :  Sélectionnez la même entité que "Radiateur (pièce) Consigne"

        ⚠️ **Si vous utilisez Tempo** : Sélectionnez `input_number.radiateur_xxx_consigne_tempo`
      selector:
        entity: 
          domain: input_number

    consigne_finale:
      name: ✅ (pièce) Consigne Finale
      description: "Consigne finale à utiliser dans Thermostat TPI et Pilotage (sortie)"
      selector:
        entity: 
          domain: input_number

    # === STOCKAGE ÉTATS ===
    etait_presence:
      name: 💾 (pièce) Était en Presence avant absence
      description: "Input_boolean pour détecter si on était en Presence avant départ"
      selector:
        entity:
          domain: input_boolean

    # === GLOBAL - REDUCTION ===
    reduction_degrees:
      name: ➖ Réduction de température en absence (global)
      description: |
        Nombre de degrés à retirer en mode Absence ou Manuel
        
        Ex. : input_number.chauffage_absence_auto_reduction_degrees
      selector:
        entity:
          domain: input_number

    # === GLOBAL - ACTIVATION ===
    switch_global: 
      name: 🌐 Gestion Absence Auto Globale (global)
      description: |
        Désactive toutes les corrections Absence (toutes pièces) si OFF
        
        Ex. : input_boolean.chauffage_absence_auto_global_actif
      selector:
        entity:
          domain: input_boolean

    # === par PIECE - ACTIVATION ===
    switch_local:
      name: 🏠 (pièce) Gestion Absence Auto
      description: "Désactive les corrections Absence Auto pour cette pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    switch_si_principal_absent:
      name: 👤 (pièce) Absence si utilisateur principal absent
      description: "Appliquer la réduction même si d'autres utilisateurs sont présents"
      selector:
        entity:
          domain: input_boolean

    utilisateur_principal:
      name:  👤 (pièce) Utilisateur Principal
      description: "Choix de l'utilisateur principal (utilise la liste définie dans chauffage_absence_auto_config_package.yaml)"
      selector:
        entity:
          domain: input_select

    # === par PIECE - MODE ===
    mode_actuel:
      name: 🎚️ Radiateur (pièce) Mode
      description: "Mode de chauffage, choisi via la carte Lovelace (Presence, Absence, Manuel, Hors-gel, Arret)"
      selector:
        entity:
          domain: input_select

    boost_actif:
      name:  ⚡ Boost (pièce - optionnel)
      description: |
        Si le boost est ON, ignore les corrections Absence Auto pour cette pièce

        ⚠️ Laissez vide si vous n'utilisez pas le module Boost
      selector: 
        entity:
          domain:  input_boolean





# ========= VARIABLES =========
variables: 

  piece_name:  !input piece_name
  consigne_base: !input consigne_base
  consigne_tempo_input: !input consigne_tempo
  consigne_finale: !input consigne_finale
  reduction_degrees: !input reduction_degrees
  switch_global: !input switch_global
  switch_local: !input switch_local
  switch_si_principal_absent:  !input switch_si_principal_absent
  mode_actuel: !input mode_actuel
  binary_sensor_tous_absents:  !input binary_sensor_tous_absents
  boost_actif_input: !input boost_actif
  utilisateur_entity: !input utilisateur_principal
  etait_presence_input: !input etait_presence

  mode_actuel_valeur: "{{ states(mode_actuel) }}"
  etait_en_presence:  "{{ is_state(etait_presence_input,'on') }}"

  # Détection absence
  everybody_absent: "{{ is_state(binary_sensor_tous_absents,'on') }}"

  principal_absent: >-
    {% set opts = state_attr('input_select.chauffage_absence_auto_liste_utilisateurs','options') or [] %}
    {% set noms = opts[1:] %}
    {% set raw = states('input_text.chauffage_absence_auto_utilisateurs_entities') %}
    {% set entities = (raw.split(',') if raw not in ['unknown','unavailable',''] else []) %}
    {% set principal_name = states(utilisateur_entity) %}

    {% set ns = namespace(value=false) %}

    {% if principal_name in ['Aucun','unknown','unavailable',''] %}
      {% set ns.value = false %}
    {% elif principal_name in noms %}
      {% set idx = noms.index(principal_name) %}
      {% if idx < entities|length %}
        {% set ent = (entities[idx] | trim) | replace(' ','') %}
        {% if ent in ['', 'unknown', 'unavailable'] %}
          {% set ns.value = false %}
        {% elif ent.startswith('person.') %}
          {% set ns.value = is_state(ent, 'not_home') %}
        {% elif ent.startswith('binary_sensor.') %}
          {# binary_sensor = capteur de PRESENCE (on=présent) #}
          {% set ns.value = not is_state(ent, 'on') %}
        {% endif %}
      {% endif %}
    {% endif %}

    {{ ns.value }}


  # ⭐ Variable centrale :  Absence Auto active ? 
  principal_feature_enabled: >-
    {{ is_state(switch_si_principal_absent,'on') and states(utilisateur_entity) not in ['Aucun','unknown','unavailable',''] }}

  auto_absence_active: >-
    {{ everybody_absent or (principal_feature_enabled and (principal_absent | bool)) }}
    

  # Consigne source (Tempo si actif, sinon base)
  consigne_source: >-
    {% if consigne_tempo_input in ['', 'none', None] or states(consigne_tempo_input) in ['unknown', 'unavailable'] %}
      {{ states(consigne_base) | float(19) }}
    {% else %}
      {{ states(consigne_tempo_input) | float(19) }}
    {% endif %}






# ========= DÉCLENCHEURS =========
trigger: 

  # Détection absence
  - platform: state
    entity_id: 
      - !input binary_sensor_tous_absents
      - !input binary_sensor_utilisateur_1_absent
      - !input binary_sensor_utilisateur_2_absent
      - !input binary_sensor_utilisateur_3_absent
      - !input binary_sensor_utilisateur_4_absent
      - !input binary_sensor_utilisateur_5_absent

  # Utilisateur principal
  - platform: state
    entity_id:  !input utilisateur_principal
    
  # Détection absence (calculée)
  - platform: template
    value_template: "{{ auto_absence_active }}"

  # Détection absence principal (calculée)
  - platform: template
    value_template: "{{ principal_absent | bool }}"
    
  # Switches
  - platform: state
    entity_id: 
      - !input switch_global
      - !input switch_local
      - !input switch_si_principal_absent

  # Consignes
  - platform: state
    entity_id:
      - !input consigne_base
      - !input consigne_tempo

  # Réduction
  - platform: state
    entity_id: !input reduction_degrees

  # Boost
  - platform: state
    entity_id: !input boost_actif

  # Démarrage
  - platform: homeassistant
    event: start

  - platform: event
    event_type: automation_reloaded





condition:  []






# ========= ACTIONS =========
action: 


  # === 1. BOOST (PRIORITAIRE) ===

  - choose:
      - conditions: 
          - condition: template
            value_template: >-
              {{ boost_actif_input not in ['', 'none', None]
                 and is_state(boost_actif_input,'on') }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value:  "{{ states(consigne_base) | float }}"
          - stop: "Boost actif"



  # === 2. MODULE DÉSACTIVÉ / PAS D'ABSENCE / ARRET / HORS-GEL ===

  - choose: 
      - conditions: 
          - condition: or
            conditions:
              - condition: template
                value_template:  "{{ not is_state(switch_global,'on') }}"
              - condition: template
                value_template: "{{ not is_state(switch_local,'on') }}"
              - condition: template
                value_template: "{{ not auto_absence_active }}"
              - condition: template
                value_template: "{{ mode_actuel_valeur in ['Arret','Hors-gel'] }}"
        sequence: 
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data: 
              value:  "{{ consigne_source | float }}"

          - stop: "Module désactivé, pas d'absence, ou mode inactif"



  # === 3. DÉPART EN MODE PRESENCE ===

  - choose: 
      - conditions:
          - condition: template
            value_template: "{{ auto_absence_active and is_state(mode_actuel,'Presence') }}"
        sequence: 
          - service: input_boolean.turn_on
            target:
              entity_id: !input etait_presence

          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Absence"
              
          # Attendre que Scheduler component ait appliqué la consigne du mode Absence
          - wait_for_trigger:
              - platform: state
                entity_id: !input consigne_base
              - platform: state
                entity_id: !input consigne_tempo
            timeout: "00:00:05"
            continue_on_timeout: true

          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data: 
              value: "{{ consigne_source | float }}"

          - stop: "Départ en Presence → Absence (Scheduler gère)"



  # === 4. DÉPART EN MODE ABSENCE OU MANUEL ===

  - choose: 
      - conditions:
          - condition: template
            value_template:  >-
              {{ auto_absence_active
                 and mode_actuel_valeur in ['Absence','Manuel']
                 and not etait_en_presence }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data: 
              value: "{{ (consigne_source | float) - (states(reduction_degrees) | float) }}"

          - stop: "Absence/Manuel avec réduction"



  # === 5. RETOUR + ETAIT_PRESENCE = ON ===

  - choose: 
      - conditions:
          - condition: template
            value_template:  "{{ not auto_absence_active and etait_en_presence }}"
        sequence:
          - service:  input_boolean.turn_off
            target:
              entity_id: !input etait_presence

          - service: input_select.select_option
            target: 
              entity_id: !input mode_actuel
            data: 
              option: "Presence"

          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ consigne_source | float }}"

          - stop: "Retour → Restauration Presence"



  # === 6. RETOUR + ETAIT_PRESENCE = OFF (MODE ABSENCE/MANUEL) ===

  - choose:
      - conditions: 
          - condition: template
            value_template: >-
              {{ not auto_absence_active
                 and not etait_en_presence
                 and mode_actuel_valeur in ['Absence','Manuel'] }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value:  "{{ consigne_source | float }}"

          - stop: "Retour → Suppression réduction"



  # === 7. LOG DEBUG ===

  - service: logbook.log
    data:
      name: "Absence Auto {{ piece_name }}"
      message:  >-
        Mode:  {{ mode_actuel_valeur }}
        | Auto Absence: {{ 'ACTIVE' if auto_absence_active else 'OFF' }}
        | Consigne: {{ consigne_source }}°C → {{ states(consigne_finale) }}°C
        | Réduction: {{ states(reduction_degrees) if (auto_absence_active and mode_actuel_valeur in ['Absence','Manuel'] and not etait_en_presence) else 0 }}°C
        {% if everybody_absent %}[Tous absents]{% endif %}
        {% if is_state(switch_si_principal_absent,'on') and (principal_absent | bool) %}[Principal absent]{% endif %}
        {% if etait_en_presence %}[Était Presence]{% endif %}
        {% if not is_state(switch_global,'on') %}[Global OFF]{% endif %}
        {% if not is_state(switch_local,'on') %}[Local OFF]{% endif %}



mode: queued
max: 5
