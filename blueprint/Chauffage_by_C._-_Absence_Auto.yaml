blueprint:
  name: Chauffage by C. - Absence Auto
  description: |

    version Absence Auto – par Pièce : v2.53 – 2026-01-01
    auteur : Ciscoo45

    ___

    ## But (version simplifiée "Tempo only")

    Blueprint **par pièce** autonome gérant :

    - Détection "tous absents" ET "utilisateur principal absent"
    - Changements de mode automatiques (Presence -> Absence au départ)
    - Sauvegarde d’état avant départ (flag `etait_presence`)
    - Restauration au retour
    - Calcul de consigne finale avec réduction

    ___

    ## Hypothèse / prérequis IMPORTANT

    La consigne de référence du chauffage est **toujours `consigne_tempo`**.

    - Si tu utilises Tempo : `consigne_tempo` = consigne calculée par Tempo
    - Si tu n’utilises pas Tempo : tu dois fournir un mécanisme externe pour que `consigne_tempo` reflète la consigne attendue
      (par ex. une automation "dummy" qui copie la base vers tempo).

    👉 Ce blueprint **ne déclenche plus** sur `consigne_base` et ne fait plus de fallback.
    Il ne se base que sur `consigne_tempo`.

    ___

    ## Logique de changement de mode

    ### Départ (tous OU principal)

    - **Mode Presence** → passe en Absence (Scheduler/Tempo gère la consigne)
    - **Mode Absence** → reste Absence, applique réduction (défaut -2°C)
    - **Mode Manuel** → reste Manuel, applique réduction (défaut -2°C)
    - **Mode Arret/Hors-gel** → aucune action

    ### Retour

    - Si on était passé automatiquement Presence → Absence (`etait_presence`=ON) :
      on repasse en Presence.
    - Sinon : on enlève juste la réduction.

    ___

    ## Ordre de priorité

    1. **Boost actif** → `consigne_finale = consigne_tempo` (aucune réduction)
    2. **Module désactivé** → `consigne_finale = consigne_tempo`
    3. **Absence auto + Presence** → bascule en Absence, puis `consigne_finale = consigne_tempo`
    4. **Absence auto + Absence/Manuel** → `consigne_finale = consigne_tempo - réduction` (SAUF si absence auto issue de Presence)
    5. **Normal** → `consigne_finale = consigne_tempo`


  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto.yaml
  domain: automation




  input:
  
    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex : SdB, Salon, Bureau)"
      selector:
        text: {}

    # === DETECTION PRESENCE ===
    binary_sensor_tous_absents:
      name:  👥 Chauffage - Tous Utilisateurs Absents (global)
      description: |
        Binary_sensor indiquant si tous les utilisateurs sont absents. 

        Ex. : `binary_sensor.chauffage_tous_utilisateurs_absents`
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_1_absent:
      name: 👤 Utilisateur 1 Absent (obligatoire)
      description: |
        Binary sensor pour le premier utilisateur

        (obligatoire, ex. `Chauffage Michel Absent` ou `binary_sensor.chauffage_utilisateur1_absent`)
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_2_absent:
      name: 👤 Utilisateur 2 Absent
      description: |
        Binary sensor pour le deuxième utilisateur

        Ex. : `chauffage François Absent` ou `binary_sensor.chauffage_utilisateur2_absent`, même si non utilisé)
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_3_absent:
      name:  👤 Utilisateur 3 Absent
      description: |
        Binary sensor pour le troisième utilisateur (ex. : `binary_sensor.chauffage_utilisateur3_absent`, même si non utilisé)
      selector:
        entity: 
          domain: binary_sensor

    binary_sensor_utilisateur_4_absent:
      name: 👤 Utilisateur 4 Absent
      description: |
        Binary sensor pour le quatrième utilisateur (ex. `binary_sensor.chauffage_utilisateur4_absent`, même si non utilisé)
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_5_absent:
      name: 👤 Utilisateur 5 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le quatrième utilisateur (ex. `binary_sensor.chauffage_utilisateur5_absent`, même si non utilisé)
      selector:
        entity:
          domain: binary_sensor

    # === CONSIGNES ===
    consigne_tempo:
      name: 🎯 (pièce) Consigne Calculée Tempo Eco
      description: |
        Consigne de température de chauffe, corrigée par le module Tempo Eco. 

        **Si vous utilisez Tempo** : sélectionnez `input_number.radiateur_xxx_consigne_tempo`

        ⚠️ **Si vous N'utilisez PAS EDF Tempo** :  créer une automatisation dummy permettant consigne_dummy = consigne de base (utile si le module optionnel Boost n'est pas utilisé non plus)
      selector:
        entity: 
          domain: input_number

    consigne_finale:
      name: ✅ (pièce) Consigne Finale
      description: "Consigne finale à utiliser dans Thermostat TPI et Pilotage (sortie)"
      selector:
        entity:
          domain: input_number

    # === STOCKAGE ÉTATS ===
    etait_presence:
      name: 💾 (pièce) Était en Presence avant absence
      description: "Flag ON quand on a basculé automatiquement Presence -> Absence."
      selector:
        entity:
          domain: input_boolean

    # === GLOBAL - REDUCTION ===
    reduction_degrees:
      name: ➖ Réduction de température en absence (global)
      description: |
        Nombre de degrés à retirer en mode Absence ou Manuel
        
        Ex. : `input_number.chauffage_absence_auto_reduction_degrees`
      selector:
        entity:
          domain: input_number

    # === GLOBAL - ACTIVATION ===
    switch_global: 
      name: 🌐 Gestion Absence Auto Globale (global)
      description: |
        Désactive toutes les corrections Absence (toutes pièces) si OFF
        
        Ex. : `input_boolean.chauffage_absence_auto_global_actif`
      selector:
        entity:
          domain: input_boolean

    # === par PIECE - ACTIVATION ===
    switch_local:
      name: 🏠 (pièce) Gestion Absence Auto
      description: "Désactive les corrections Absence Auto pour cette pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    switch_si_principal_absent:
      name: 👤 (pièce) Absence si utilisateur principal absent
      description: "Appliquer la réduction même si d'autres utilisateurs sont présents"
      selector:
        entity:
          domain: input_boolean

    utilisateur_principal:
      name: 👤 (pièce) Utilisateur Principal
      description: "Choix de l'utilisateur principal (utilise la liste définie dans le package global)."
      selector:
        entity:
          domain: input_select

    # === par PIECE - MODE ===
    mode_actuel:
      name: 🎚️ Radiateur (pièce) Mode
      description: "Mode de chauffage (Presence, Absence, Manuel, Hors-gel, Arret)"
      selector:
        entity:
          domain: input_select

    boost_actif:
      name: ⚡ Boost (pièce)
      description: |
        Module de dérogation temporaire (boost timé), optionnel.
      
        Si ON, ignore les corrections Absence Auto pour cette pièce."

        ⚠️ **Si vous N'utilisez PAS Boost** :  créer une automatisation dummy permettant consigne_dummy = consigne_base (utile si le module optionnel EDF Tempo n'est pas utilisé non plus)
      selector:
        entity:
          domain: input_boolean





# ========= VARIABLES =========
variables:

  piece_name: !input piece_name

  consigne_tempo_input: !input consigne_tempo
  consigne_finale: !input consigne_finale

  reduction_degrees: !input reduction_degrees
  switch_global: !input switch_global
  switch_local: !input switch_local
  switch_si_principal_absent: !input switch_si_principal_absent
  mode_actuel: !input mode_actuel
  binary_sensor_tous_absents: !input binary_sensor_tous_absents
  boost_actif_input: !input boost_actif
  utilisateur_entity: !input utilisateur_principal
  etait_presence_input: !input etait_presence

  mode_actuel_valeur: "{{ states(mode_actuel) }}"
  etait_en_presence: "{{ is_state(etait_presence_input,'on') }}"

  # Détection absence
  everybody_absent: "{{ is_state(binary_sensor_tous_absents,'on') }}"

  # Détection principal absent
  # Mapping via package global :
  # - input_select.chauffage_absence_auto_liste_utilisateurs (options : 'Aucun', 'Michel', ...)
  # - input_text.chauffage_absence_auto_utilisateurs_entities (liste d'entités dans le même ordre, sans 'Aucun')
  #
  # Convention implémentée :
  # - person.xxx : absent si not_home
  # - binary_sensor.xxx : capteur de PRESENCE (on=présent) -> absent si off
  principal_absent: >-
    {% set opts = state_attr('input_select.chauffage_absence_auto_liste_utilisateurs','options') or [] %}
    {% set noms = opts[1:] %}
    {% set raw = states('input_text.chauffage_absence_auto_utilisateurs_entities') %}
    {% set entities = (raw.split(',') if raw not in ['unknown','unavailable',''] else []) %}
    {% set principal_name = states(utilisateur_entity) %}

    {% set ns = namespace(value=false) %}

    {% if principal_name in ['Aucun','unknown','unavailable',''] %}
      {% set ns.value = false %}
    {% elif principal_name in noms %}
      {% set idx = noms.index(principal_name) %}
      {% if idx < entities|length %}
        {% set ent = (entities[idx] | trim) | replace(' ','') %}
        {% if ent in ['', 'unknown', 'unavailable'] %}
          {% set ns.value = false %}
        {% elif ent.startswith('person.') %}
          {% set ns.value = is_state(ent, 'not_home') %}
        {% elif ent.startswith('binary_sensor.') %}
          {% set ns.value = not is_state(ent, 'on') %}
        {% endif %}
      {% endif %}
    {% endif %}

    {{ ns.value }}

  principal_feature_enabled: >-
    {{ is_state(switch_si_principal_absent,'on')
       and states(utilisateur_entity) not in ['Aucun','unknown','unavailable',''] }}

  auto_absence_active: >-
    {{ everybody_absent or (principal_feature_enabled and (principal_absent | bool)) }}

  consigne_tempo_val: "{{ states(consigne_tempo_input) | float(19) }}"





# ========= DÉCLENCHEURS =========
trigger:

  # Détection absence (triggers directs)
  - platform: state
    entity_id:
      - !input binary_sensor_tous_absents
      - !input binary_sensor_utilisateur_1_absent
      - !input binary_sensor_utilisateur_2_absent
      - !input binary_sensor_utilisateur_3_absent
      - !input binary_sensor_utilisateur_4_absent
      - !input binary_sensor_utilisateur_5_absent

  # Utilisateur principal sélectionné
  - platform: state
    entity_id: !input utilisateur_principal

  # Switches
  - platform: state
    entity_id:
      - !input switch_global
      - !input switch_local
      - !input switch_si_principal_absent

  # Consigne tempo (référence)
  - platform: state
    entity_id: !input consigne_tempo

  # Réduction
  - platform: state
    entity_id: !input reduction_degrees

  # Boost
  - platform: state
    entity_id: !input boost_actif

  # Démarrage / reload
  - platform: homeassistant
    event: start

  - platform: event
    event_type: automation_reloaded




condition: []





# ========= ACTIONS =========
action:


  # === 1. BOOST (PRIORITAIRE) ===
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_state(boost_actif_input,'on') }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_tempo_input) | float(19) }}"
          - stop: "Boost actif"



  # === 5. RETOUR + ETAIT_PRESENCE = ON (restauration Presence) ===
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (not auto_absence_active) and etait_en_presence }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: !input etait_presence

          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Presence"

          # Attendre que Scheduler/Tempo ait appliqué la consigne du mode Presence
          - wait_for_trigger:
              - platform: state
                entity_id: !input consigne_tempo
            timeout: "00:00:10"
            continue_on_timeout: true

          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_tempo_input) | float(19) }}"

          - stop: "Retour → Restauration Presence"



  # === 6. RETOUR + ETAIT_PRESENCE = OFF (suppression réduction) ===
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (not auto_absence_active)
                 and (not etait_en_presence)
                 and mode_actuel_valeur in ['Absence','Manuel'] }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_tempo_input) | float(19) }}"
          - stop: "Retour → Suppression réduction"



          
  # === 2. MODULE DÉSACTIVÉ / PAS D'ABSENCE / ARRET / HORS-GEL ===
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not is_state(switch_global,'on') }}"
              - condition: template
                value_template: "{{ not is_state(switch_local,'on') }}"
              - condition: template
                value_template: "{{ not auto_absence_active }}"
              - condition: template
                value_template: "{{ mode_actuel_valeur in ['Arret','Hors-gel'] }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_tempo_input) | float(19) }}"
          - stop: "Module désactivé, pas d'absence, ou mode inactif"




  # === 3. DÉPART EN MODE PRESENCE (Presence -> Absence) ===
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ auto_absence_active and is_state(mode_actuel,'Presence') }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input etait_presence

          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Absence"

          # Attendre que Scheduler/Tempo ait appliqué la consigne du mode Absence
          - wait_for_trigger:
              - platform: state
                entity_id: !input consigne_tempo
            timeout: "00:00:10"
            continue_on_timeout: true

          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_tempo_input) | float(19) }}"

          - stop: "Départ en Presence → Absence (Scheduler/Tempo gère)"



  # === 4. DÉPART EN MODE ABSENCE OU MANUEL (réduction) ===
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ auto_absence_active
                 and mode_actuel_valeur in ['Absence','Manuel']
                 and not etait_en_presence }}
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ (states(consigne_tempo_input) | float(19)) - (states(reduction_degrees) | float(2)) }}"
          - stop: "Absence/Manuel avec réduction"



  # === 7. LOG DEBUG ===
  - service: logbook.log
    data:
      name: "Absence Auto {{ piece_name }}"
      # Attache le log à la consigne finale pour pouvoir le voir via la carte Logbook filtrée par entité
      entity_id: !input consigne_finale
      message: >-
        Mode: {{ mode_actuel_valeur }}
        | Auto Absence: {{ 'ACTIVE' if auto_absence_active else 'OFF' }}
        | Tempo: {{ states(consigne_tempo_input) }}°C → Finale: {{ states(consigne_finale) }}°C
        | Réduction: {{ states(reduction_degrees) if (auto_absence_active and mode_actuel_valeur in ['Absence','Manuel'] and not etait_en_presence) else 0 }}°C
        {% if everybody_absent %}[Tous absents]{% endif %}
        {% if principal_feature_enabled and (principal_absent | bool) %}[Principal absent]{% endif %}
        {% if etait_en_presence %}[Était Presence]{% endif %}
        {% if not is_state(switch_global,'on') %}[Global OFF]{% endif %}
        {% if not is_state(switch_local,'on') %}[Local OFF]{% endif %}


mode: queued
max: 5
