blueprint:
  name: Chauffage by C. - Absence Auto
  description: |

    version Absence Auto – par Pièce : v2.21 – 2025-12-30

    auteur : Ciscoo45

    ___

    ## Description

    Blueprint **par pièce** autonome gérant :

    - Détection "tous absents" ET "utilisateur principal absent"
    - Changements de mode automatiques
    - Sauvegarde des états avant départ
    - Restauration au retour
    - Calcul de consigne finale avec réductions

    ___

    ## Logique de changement de mode

    ### Départ (tous OU principal)

    - **Mode Presence** → passe en Absence (Scheduler gère consigne)
    - **Mode Absence** → reste Absence, applique réduction (défaut -2°C)
    - **Mode Manuel** → reste Manuel, applique réduction (défaut -2°C)
    - **Mode Arret/Hors-gel** → aucun changement

    ### Retour

    - **Si mode changé automatiquement** → restaure mode précédent (Presence)
    - **Sinon** → supprime la réduction uniquement

    ___

    ## Logique de réduction

    Réduction appliquée **UNIQUEMENT SI** :

    - Gestion Absence Auto globale **ON**
    - Gestion Absence Auto de la pièce **ON**
    - Boost **OFF**
    - Mode n'a **pas** changé récemment (< 5s)
    - Utilisateur(s) absent(s) (Tous OU Principal)

    **PAS de réduction** si :
    - Mode vient de changer → transition gérée par Scheduler
    - Mode = Arret ou Hors-gel → aucune action

    ___

    ## Ordre de priorité des consignes

    1. **Boost actif** → consigne Boost (ignore tout le reste)
    2. **Absence Auto** → `consigne_finale = consigne_source - réduction`
       - `consigne_source` = Tempo (si actif) OU consigne de base
       - `réduction` = -2°C (défaut) si Absence/Manuel + utilisateur(s) absent(s)
    3. **Tempo** → `consigne_tempo = consigne_base - réduction HP`
    4. **Normal** → `consigne_finale = consigne_base`

    **Note** : Ce blueprint calcule directement `consigne_finale` sans helper intermédiaire.

    ___

    ## Avantages de la v2.0

    ✅ Plus de problème de synchronisation (tout dans 1 blueprint)
    ✅ Logique claire et traçable
    ✅ Pas de conflit entre blueprints
    ✅ Plus besoin du blueprint Globale

    ___

    ## Helpers à créer par pièce

    **input_number** :

    - `radiateur_xxx_consigne` : consigne de base (existant)
    - `radiateur_xxx_consigne_tempo` : consigne corrigée par Tempo (optionnel)
    - `radiateur_xxx_consigne_finale` : consigne finale utilisée par Thermostat TPI ⭐ **NOUVEAU**

    **input_boolean** :

    - `chauffage_absence_auto_global_actif` : activation globale (commun)
    - `radiateur_xxx_absence_auto_actif` : activation locale
    - `radiateur_xxx_absence_si_principal_absent` : réduction si utilisateur principal absent
    - `radiateur_xxx_etait_presence` : état avant départ ⭐ **NOUVEAU**
    - `boost_xxx` : état du boost (optionnel)

    **input_select** :

    - `radiateur_xxx_mode` : mode actuel (existant)
    - `radiateur_xxx_mode_avant_absence` : sauvegarde pour restauration ⭐ **NOUVEAU**
    - `radiateur_xxx_utilisateur_principal` : choix de l'utilisateur ⭐ **NOUVEAU**

    **Helpers dummy (OBLIGATOIRES si modules non utilisés)** :

    - `input_number.dummy_tempo` : helper dummy Tempo (valeur fixe: 19°C)
    - `input_boolean.dummy_boost` : helper dummy Boost (toujours OFF)

    ⚠️ **IMPORTANT** : Si vous n'utilisez pas Tempo ou Boost, vous **DEVEZ** créer les helpers dummy
    correspondants pour éviter les erreurs de validation YAML.

    Voir `config_examples/` pour les définitions complètes.




  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto.yaml
  domain: automation


  input:
  
    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex. : SdB, Salon, Bureau)"
      selector:
        text: {}

    # === DETECTION PRESENCE ===
    binary_sensor_tous_absents:
      name: 👥 Chauffage - Tous Utilisateurs Absents (global)
      description: |
        Binary_sensor indiquant si tous les utilisateurs sont absents.

        Ex. : binary_sensor.chauffage_tous_utilisateurs_absents
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_1_absent:
      name: 👤 Utilisateur 1 Absent (obligatoire)
      description: |
        Binary sensor pour le premier utilisateur

        (obligatoire, ex. Chauffage Michel Absent)

        ⚠️ Ces sensors sont utilisés uniquement comme triggers pour recalculer les consignes.
        La logique principale utilise `binary_sensor_tous_absents` et `utilisateur_principal`.
      default: binary_sensor.chauffage_utilisateur1_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_2_absent:
      name: 👤 Utilisateur 2 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le deuxième utilisateur

        (optionnel, ex. Chauffage François Absent, laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur2_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_3_absent:
      name: 👤 Utilisateur 3 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le troisième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur3_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_4_absent:
      name: 👤 Utilisateur 4 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le quatrième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur4_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_5_absent:
      name: 👤 Utilisateur 5 Absent (optionnel, à modifier si utilisé)
      description: |
        Binary sensor pour le cinquième utilisateur (laisser par défaut si non utilisé)
      default: binary_sensor.chauffage_utilisateur5_absent
      selector:
        entity:
          domain: binary_sensor

    # === CONSIGNES ===
    consigne_base:
      name: 🌡️ 🎯 Radiateur (pièce) Consigne
      description: "Consigne de base, définie par l'utilisateur (input_number, modifié via UI/modes/schedules)"
      selector:
        entity:
          domain: input_number

    consigne_tempo:
      name: 🎯 (pièce) Consigne Calculée Tempo Eco (optionnel)
      description: |
        Consigne corrigée par Tempo Eco

        ⚠️ Si le module Tempo Eco n'est pas utilisé, vous DEVEZ créer un helper dummy
        (input_number.dummy_tempo = 19°C fixe) pour éviter les erreurs de validation
      default: input_number.dummy_tempo
      selector:
        entity:
          domain: input_number

    consigne_finale:
      name: ✅ (pièce) Consigne Finale
      description: "Consigne finale à utiliser dans Thermostat TPI et Pilotage (sortie)"
      selector:
        entity:
          domain: input_number

    # === STOCKAGE ÉTATS ===
    etait_presence:
      name: 💾 (pièce) Était en Presence avant absence
      description: "Input_boolean pour détecter si on était en Presence avant tous absents"
      selector:
        entity:
          domain: input_boolean

    mode_avant_absence:
      name: 💾 (pièce) Mode Avant Absence
      description: "Stockage du mode actif avant départ (pour restauration ET calcul réduction)"
      selector:
        entity:
          domain: input_select

    # === GLOBAL - REDUCTION ===
    reduction_degrees:
      name: ➖ Réduction de température en absence (global)
      description: "Nombre de degrés à retirer en mode Absence ou Manuel (si on n'était pas en mode Presence → Absence)"
      default: input_number.chauffage_absence_auto_reduction_degrees
      selector:
        entity:
          domain: input_number

    # === GLOBAL - ACTIVATION ===
    switch_global:
      name: 🌐 Gestion Absence Auto Globale (global)
      description: "Désactive toutes les corrections Absence (toutes pièces) si OFF"
      default: input_boolean.chauffage_absence_auto_global_actif
      selector:
        entity:
          domain: input_boolean

    # === par PIECE - ACTIVATION ===
    switch_local:
      name: 🏠 (pièce) Gestion Absence Auto
      description: "Désactive les corrections Absence Auto pour cette pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    switch_si_principal_absent:
      name: 👤 (pièce) Absence si utilisateur principal absent
      description: "Appliquer la réduction même si d'autres utilisateurs sont présents"
      selector:
        entity:
          domain: input_boolean

    utilisateur_principal:
      name: 👤 (pièce) Utilisateur Principal
      description: "Choix de l'utilisateur principal (utilise la liste définie dans chauffage_absence_auto_config_package.yaml)"
      selector:
        entity:
          domain: input_select

    # === par PIECE - MODE ===
    mode_actuel:
      name: 🎚️ Radiateur (pièce) Mode
      description: "Mode de chauffage, choisi via la carte Lovelace (Presence, Absence, Manuel, Hors-gel, Arret)"
      selector:
        entity:
          domain: input_select

    boost_actif:
      name: ⚡ Boost (pièce - optionnel)
      description: |
        Si le boost est ON, ignore les corrections Absence Auto pour cette pièce

        ⚠️ Si le module Boost n'est pas utilisé, vous DEVEZ créer un helper dummy
        (input_boolean.dummy_boost = OFF) pour éviter les erreurs de validation
      default: input_boolean.dummy_boost
      selector:
        entity:
          domain: input_boolean





# ========= VARIABLES =========
variables:

  piece_name: !input piece_name
  consigne_base: !input consigne_base
  consigne_tempo_input: !input consigne_tempo
  consigne_finale: !input consigne_finale
  reduction_degrees: !input reduction_degrees
  switch_global: !input switch_global
  switch_local: !input switch_local
  switch_si_principal_absent: !input switch_si_principal_absent
  mode_actuel: !input mode_actuel
  mode_avant_absence: !input mode_avant_absence
  binary_sensor_tous_absents: !input binary_sensor_tous_absents
  boost_actif_input: !input boost_actif
  utilisateur_entity: !input utilisateur_principal
  etait_presence_input: !input etait_presence

  mode_actuel_valeur: "{{ states(mode_actuel) }}"
  mode_avant_valeur: "{{ states(mode_avant_absence) }}"

  consigne_source: >-
    {% set tempo_input = consigne_tempo_input %}
    {% if mode_actuel_valeur in ['Hors-gel','Arret'] %}
      {{ states(consigne_base) | float(19) }}
    {% elif tempo_input not in ['','none',None] and states(tempo_input) not in ['unknown','unavailable',''] %}
      {{ states(tempo_input) | float(19) }}
    {% else %}
      {{ states(consigne_base) | float(19) }}
    {% endif %}

  principal: "{{ states(utilisateur_entity) }}"

  principal_absent: >-
    {% set opts = state_attr('input_select.chauffage_absence_auto_liste_utilisateurs','options') or [] %}
    {% set noms = opts[1:] %}
    {% set raw = states('input_text.chauffage_absence_auto_utilisateurs_entities') %}
    {% set entities = (raw.split(',') if raw not in ['unknown','unavailable',''] else []) %}
    {% set principal_name = states(utilisateur_entity) %}

    {% if principal_name in noms %}
      {% set idx = noms.index(principal_name) %}
      {% if idx < (entities|length) and (entities[idx]|trim) not in ['','unknown','unavailable'] %}
        {% set ent = entities[idx] | trim %}
        {% if ent.startswith('binary_sensor.') %}
          {{ is_state(ent,'on') }}
        {% elif ent.startswith('person.') %}
          {{ is_state(ent,'not_home') }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}
    {% else %}
      false
    {% endif %}

  everybody_absent: "{{ is_state(binary_sensor_tous_absents,'on') }}"

  etait_en_presence: >-
    {{ etait_presence_input not in ['','none',None] and is_state(etait_presence_input,'on') }}

  mode_just_changed: >-
    {{ (as_timestamp(now()) - as_timestamp(states[mode_actuel].last_changed)) < 5 }}

  reduction: >-
    {% set mode_actif = mode_actuel_valeur in ['Presence','Absence','Manuel'] %}
    {% set boost_on = boost_actif_input not in ['','none',None] and is_state(boost_actif_input,'on') %}
    {% set principal_rule = is_state(switch_si_principal_absent,'on') and (principal_absent | bool) %}
    {% set everybody_absent_val = is_state(binary_sensor_tous_absents,'on') %}
    {% set someone_absent = everybody_absent_val or (principal_rule and not everybody_absent_val) %}

    {% if not is_state(switch_global,'on') %}
      0
    {% elif not is_state(switch_local,'on') %}
      0
    {% elif mode_actuel_valeur in ['Hors-gel','Arret'] %}
      0
    {% elif not mode_actif %}
      0
    {% elif boost_on %}
      0
    {% elif mode_just_changed %}
      0
    {% elif someone_absent %}
      {% if mode_actuel_valeur in ['Absence','Manuel'] %}
        {{ states(reduction_degrees) | float(2) }}
      {% else %}
        0
      {% endif %}
    {% else %}
      0
    {% endif %}

  consigne_finale_calc: "{{ (consigne_source | float) - (reduction | float) }}"






# ========= DÉCLENCHEURS =========
trigger:
  - platform: state
    entity_id: !input etait_presence

  - platform: state
    entity_id: !input consigne_base

  - platform: state
    entity_id: !input consigne_tempo

  - platform: state
    entity_id: !input reduction_degrees

  - platform: state
    entity_id:
      - !input switch_global
      - !input switch_local
      - !input switch_si_principal_absent

  - platform: state
    entity_id: !input utilisateur_principal

  - platform: state
    entity_id:
      - !input mode_actuel
      - !input mode_avant_absence

  - platform: state
    entity_id:
      - !input binary_sensor_tous_absents
      - !input binary_sensor_utilisateur_1_absent
      - !input binary_sensor_utilisateur_2_absent
      - !input binary_sensor_utilisateur_3_absent
      - !input binary_sensor_utilisateur_4_absent
      - !input binary_sensor_utilisateur_5_absent

  - platform: state
    entity_id: !input boost_actif

  - platform: homeassistant
    event: start

  - platform: event
    event_type: automation_reloaded





condition: []






# ========= ACTIONS =========
action:


  # === 1. SAUVEGARDE ÉTATS AVANT DÉPART ===

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ everybody_absent and is_state(mode_actuel,'Presence') }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input etait_presence

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur not in ['Hors-gel','Arret'] }}"
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ everybody_absent }}"
              - condition: template
                value_template: "{{ is_state(switch_si_principal_absent,'on') and (principal_absent | bool) }}"
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ mode_avant_valeur in ['Aucun','','unknown','unavailable'] }}"
              - condition: template
                value_template: "{{ mode_avant_valeur == mode_actuel_valeur }}"
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_avant_absence
            data:
              option: "{{ mode_actuel_valeur }}"



  # === 2. CHANGEMENTS DE MODE (DÉPART) ===

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ everybody_absent and is_state(mode_actuel,'Presence') }}"
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Absence"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ is_state(switch_si_principal_absent,'on')
                 and (principal_absent | bool)
                 and not everybody_absent
                 and is_state(mode_actuel,'Presence') }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Absence"



  # === 3. RESTAURATION (RETOUR) ===

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not everybody_absent and etait_en_presence and is_state(mode_actuel,'Absence') }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: !input etait_presence
          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "Presence"
          - service: input_select.select_option
            target:
              entity_id: !input mode_avant_absence
            data:
              option: "Aucun"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ is_state(switch_si_principal_absent,'on')
                 and not (principal_absent | bool)
                 and not everybody_absent
                 and is_state(mode_actuel,'Absence')
                 and mode_avant_valeur not in ['Aucun','','unknown','unavailable']
                 and mode_avant_valeur == 'Presence' }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_actuel
            data:
              option: "{{ mode_avant_valeur }}"
          - service: input_select.select_option
            target:
              entity_id: !input mode_avant_absence
            data:
              option: "Aucun"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ not everybody_absent
                 and not (is_state(switch_si_principal_absent,'on') and (principal_absent | bool))
                 and mode_avant_valeur not in ['Aucun','','unknown','unavailable'] }}
        sequence:
          - service: input_select.select_option
            target:
              entity_id: !input mode_avant_absence
            data:
              option: "Aucun"



  # === 4. MISE À JOUR DES CONSIGNES ===

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur == 'Arret' }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: 0

      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur == 'Hors-gel' }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ states(consigne_base) | float }}"

      - conditions:
          - condition: template
            value_template: "{{ mode_actuel_valeur not in ['Hors-gel','Arret'] }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_finale
            data:
              value: "{{ consigne_finale_calc | float }}"



  # === 5. LOG DEBUG ===

  - service: logbook.log
    data:
      name: "Absence Auto {{ piece_name }}"
      message: >-
        Mode: {{ mode_actuel_valeur }} (avant: {{ mode_avant_valeur }})
        | Consigne: {{ consigne_source }}°C → {{ consigne_finale_calc }}°C
        | Réduction: -{{ reduction }}°C
        {% if everybody_absent %}[Tous absents]{% endif %}
        {% if is_state(switch_si_principal_absent,'on') and (principal_absent | bool) %}[{{ principal }} absent]{% endif %}
        {% if etait_en_presence %}[Était Presence]{% endif %}
        {% if mode_just_changed %}[Mode changé < 5s]{% endif %}
        {% if not is_state(switch_global,'on') %}[Global OFF]{% endif %}
        {% if not is_state(switch_local,'on') %}[Local OFF]{% endif %}



mode: queued
max: 5
