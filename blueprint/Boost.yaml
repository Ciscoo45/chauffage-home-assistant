blueprint:
  name: Boost Chauffage by C.
  description: >
    version Boost : v0.46 - 2025-10-21

    Notifications vers les ENTITÉS notify.* des utilisateurs PRÉSENTS (group person.*).
    Envoi par boucle for_each (un service notify.<nom> par cible).
    Arrêt fiable via notification, boolean, interrupteur ET automatiquement à l’échéance
    (sécurisé par un déclencheur de template + un tick /1 min).

  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Boost.yaml
  domain: automation

  input:
    piece:
      name: Pièce
      selector: { area: {} }

    users_group:
      name: Groupe des utilisateurs éligibles
      selector: { entity: { domain: group } }

    remote_button:
      name: "[Optionnel] Télécommande Ikea Styrbar / Rodret"
      default: ""
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden

    boost_switch:
      name: Commutateur Boost (Dashboard)
      selector: { entity: { domain: input_boolean } }

    timer_entity:
      name: Horaire de fin de Boost
      description: input_datetime (date+heure) — ⚠️ doit avoir date **ET** heure
      selector: { entity: { domain: input_datetime } }

    mode_entity:
      name: Entité Mode du module Chauffage
      selector: { entity: { domain: input_select } }

    consigne_entity:
      name: Entité Consigne du module Chauffage
      selector: { entity: { domain: input_number } }

    boost_temp_helper:
      name: Helper — Consigne de boost (°C)
      selector: { entity: { domain: input_number } }

    consigne_boost_valeur_de_depart:
      name: Consigne par défaut (°C)
      default: 21
      selector: { number: { min: 15, max: 30, step: 0.5, mode: slider } }

    boost_duration_helper:
      name: Helper — Durée de boost (minutes)
      selector: { entity: { domain: input_number } }

    duree_boost_valeur_de_depart:
      name: Durée par défaut (minutes)
      default: 40
      selector: { number: { min: 1, max: 180, step: 5, mode: slider } }

    boost_extend_step_minutes:
      name: Pas d’extension (minutes)
      default: 10
      selector: { number: { min: 1, max: 60, step: 5, mode: slider } }

    sync_helpers_on_reload:
      name: Initialiser les helpers à chaque redémarrage / rechargement
      default: true
      selector: { boolean: {} }

# ========= Déclencheurs =========
trigger:
  # Physique ON/OFF
  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "on", cluster_id: 6 }
    id: boost_start_remote

  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "off", cluster_id: 6 }
    id: boost_stop_remote

  # UI ON/OFF
  - platform: state
    entity_id: !input boost_switch
    from: "off"
    to: "on"
    id: boost_start_ui

  - platform: state
    entity_id: !input boost_switch
    from: "on"
    to: "off"
    id: boost_stop_ui

  # Actions de notification
  - platform: event
    event_type: mobile_app_notification_action
    id: boost_stop_notif

  # (Re)init helpers
  - platform: homeassistant
    event: start
    id: init_on_start

  - platform: event
    event_type: automation_reloaded
    id: init_on_reload

  # ========= EXPIRATION SÉCURISÉE =========
  # 1) Déclenche quand "maintenant" atteint/excède l'heure de fin (use quotes around !input)
  - platform: template
    id: boost_expire_template
    value_template: >-
      {% set ts = state_attr('!input timer_entity', 'timestamp') | int(0) %}
      {{ ts > 0 and (now().timestamp() | int) >= ts }}

  # 2) Tick de secours toutes les minutes (filet de sécurité)
  - platform: time_pattern
    minutes: "/1"
    id: boost_expire_tick

condition: []

# ========= Actions =========
action:
  - variables:
      area_id: !input piece
      users_group_entity: !input users_group

      duration_helper: !input boost_duration_helper
      temp_helper: !input boost_temp_helper
      timer_id: !input timer_entity
      sync_reload: !input sync_helpers_on_reload
      default_minutes: !input duree_boost_valeur_de_depart
      default_temp: !input consigne_boost_valeur_de_depart
      extend_step: !input boost_extend_step_minutes

      area_label: >-
        {{ area_name(area_id) if area_name(area_id) is not none else area_id }}

      # IDs en minuscules (compat iOS/Android)
      notif_tag: "{{ 'boost_' ~ area_id }}"
      stop_action_id: "{{ ('boost_stop_' ~ area_id)|lower }}"
      extend_action_id: "{{ ('boost_extend_' ~ area_id)|lower }}"

      boost_minutes: "{{ [ [ states(duration_helper)|int(default_minutes), 1 ]|max, 600 ]|min }}"
      boost_target_temp: "{{ [ [ states(temp_helper)|float(default_temp), 15 ]|max, 22 ]|min }}"

      boost_end_ts: "{{ (now() + timedelta(minutes=boost_minutes)).timestamp()|int }}"
      boost_end_hhmm: "{{ (now() + timedelta(minutes=boost_minutes)).strftime('%H:%M') }}"

      # Cibles notifs (person.* présents -> notify.user_*)
      present_notify_entities: >-
        {{
          expand(state_attr(users_group_entity, 'entity_id') | default([], true))
          | selectattr('entity_id','match','^person\\.')
          | selectattr('state','equalto','home')
          | map(attribute='entity_id')
          | map('regex_replace', '^person\\.', 'notify.user_')
          | list
        }}
      has_targets: "{{ present_notify_entities | count > 0 }}"

  - choose:

      # ======= INIT HELPERS =======
      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and not sync_reload }}"
        sequence:
          - stop: "Initialisation des helpers désactivée."

      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and sync_reload }}"
        sequence:
          - service: input_number.set_value
            target: { entity_id: !input boost_duration_helper }
            data: { value: "{{ default_minutes|int }}" }
          - service: input_number.set_value
            target: { entity_id: !input boost_temp_helper }
            data: { value: "{{ default_temp|float }}" }
          - stop: "Helpers initialisés."

      # ======= DÉMARRAGE =======
      - conditions: "{{ trigger.id in ['boost_start_remote','boost_start_ui'] }}"
        sequence:
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Manuel" }

          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: "{{ boost_target_temp }}" }

          - service: input_datetime.set_datetime
            target: { entity_id: !input timer_entity }
            data: { timestamp: "{{ boost_end_ts }}" }

          # Notif persistante -> vers PRÉSENTS
          - if:
              - condition: template
                value_template: "{{ has_targets }}"
            then:
              - repeat:
                  for_each: "{{ present_notify_entities }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      data:
                        title: "🔆 Boost chauffage {{ area_label }} activé"
                        message: "Consigne {{ boost_target_temp|round(1) }}° • Fin {{ boost_end_hhmm }} ({{ boost_minutes }} min)"
                        data:
                          tag: "{{ notif_tag }}"
                          persistent: true
                          sticky: true
                          actions:
                            - action: "{{ stop_action_id }}"
                              title: "Arrêter"
                            - action: "{{ extend_action_id }}"
                              title: "+{{ extend_step }} min"

          # Sync UI si déclenché physiquement
          - condition: state
            entity_id: !input boost_switch
            state: "off"
          - service: input_boolean.turn_on
            target: { entity_id: !input boost_switch }

          # ======= BOUCLE D'ATTENTE — STOP / EXTEND / EXPIRATION =======
          - repeat:
              while: "{{ true }}"
              sequence:
                - variables:
                    now_ts: "{{ now().timestamp() | int }}"
                    end_ts: "{{ state_attr(timer_id, 'timestamp') | int(boost_end_ts) }}"
                    remaining: "{{ (end_ts - now_ts) | max(0) }}"

                - choose:
                    - conditions: "{{ remaining == 0 }}"
                      sequence:
                        - service: input_boolean.turn_off
                          target: { entity_id: !input boost_switch }
                        - stop: "Boost expiré (fin de boucle)."
                  default: []

                - wait_for_trigger:
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data: { tag: "{{ notif_tag }}", action: "{{ stop_action_id }}" }
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data: { tag: "{{ notif_tag }}", action: "{{ extend_action_id }}" }
                  timeout:
                    seconds: "{{ remaining }}"
                  continue_on_timeout: true

                # Recalcul post-attente — si on a atteint la fin, on coupe quand même
                - variables:
                    now_after: "{{ now().timestamp() | int }}"
                    end_after: "{{ state_attr(timer_id, 'timestamp') | int(boost_end_ts) }}"
                    expired_now: "{{ now_after >= end_after }}"

                - choose:
                    - conditions: "{{ expired_now }}"
                      sequence:
                        - service: input_boolean.turn_off
                          target: { entity_id: !input boost_switch }
                        - stop: "Boost expiré (post-wait check)."

                    - conditions: >-
                        {{ wait.trigger is not none
                           and wait.trigger.event is defined
                           and wait.trigger.event.data.action == stop_action_id }}
                      sequence:
                        - service: input_boolean.turn_off
                          target: { entity_id: !input boost_switch }
                        - stop: "Stop via notif (boucle)."

                    - conditions: >-
                        {{ wait.trigger is not none
                           and wait.trigger.event is defined
                           and wait.trigger.event.data.action == extend_action_id }}
                      sequence:
                        - variables:
                            new_end_ts: "{{ end_after + (extend_step * 60) }}"
                        - service: input_datetime.set_datetime
                          target: { entity_id: !input timer_entity }
                          data: { timestamp: "{{ new_end_ts }}" }
                        - variables:
                            present_notify_entities_loop: >-
                              {{
                                expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                                | selectattr('entity_id','match','^person\\.')
                                | selectattr('state','equalto','home')
                                | map(attribute='entity_id')
                                | map('regex_replace', '^person\\.', 'notify.user_')
                                | list
                              }}
                        - if:
                            - condition: template
                              value_template: "{{ present_notify_entities_loop | count > 0 }}"
                          then:
                            - repeat:
                                for_each: "{{ present_notify_entities_loop }}"
                                sequence:
                                  - service: "{{ repeat.item }}"
                                    data:
                                      title: "🔆 Boost chauffage {{ area_label }} prolongé"
                                      message: "Fin {{ (as_datetime(new_end_ts) | as_local).strftime('%H:%M') }}"
                                      data:
                                        tag: "{{ notif_tag }}"
                                        persistent: true
                                        sticky: true
                                        actions:
                                          - action: "{{ stop_action_id }}"
                                            title: "Arrêter"
                                          - action: "{{ extend_action_id }}"
                                            title: "+{{ extend_step }} min"

      # ======= EXTENSION / ARRÊT hors boucle (actions notifs) =======
      - conditions: "{{ trigger.id == 'boost_stop_notif' }}"
        sequence:
          # ARRET via notif (fallback)
          - choose:
              - conditions: >-
                  {{ trigger.event is defined
                     and trigger.event.data.tag == notif_tag
                     and trigger.event.data.action == stop_action_id }}
                sequence:
                  - service: input_boolean.turn_off
                    target: { entity_id: !input boost_switch }
            default: []

          # EXTENSION via notif (hors boucle)
          - condition: template
            value_template: >-
              {{ trigger.event is defined
                 and trigger.event.data.tag == notif_tag
                 and trigger.event.data.action == extend_action_id }}
          - variables:
              current_end: "{{ state_attr(timer_id, 'timestamp') | int(boost_end_ts) }}"
              new_end: "{{ current_end + (extend_step * 60) }}"
          - service: input_datetime.set_datetime
            target: { entity_id: !input timer_entity }
            data: { timestamp: "{{ new_end }}" }
          - variables:
              present_notify_entities_once: >-
                {{
                  expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                  | selectattr('entity_id','match','^person\\.')
                  | selectattr('state','equalto','home')
                  | map(attribute='entity_id')
                  | map('regex_replace', '^person\\.', 'notify.user_')
                  | list
                }}
          - if:
              - condition: template
                value_template: "{{ present_notify_entities_once | count > 0 }}"
            then:
              - repeat:
                  for_each: "{{ present_notify_entities_once }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      data:
                        title: "🔆 Boost chauffage {{ area_label }} prolongé"
                        message: "Nouvelle fin {{ (as_datetime(new_end) | as_local).strftime('%H:%M') }}"
                        data:
                          tag: "{{ notif_tag }}"
                          persistent: true
                          sticky: true
                          actions:
                            - action: "{{ stop_action_id }}"
                              title: "Arrêter"
                            - action: "{{ extend_action_id }}"
                              title: "+{{ extend_step }} min"
          - stop: "Extension traitée."


      # ======= ARRÊT (UI / télécommande / notif / template / tick) =======
      - conditions: "{{ trigger.id in ['boost_stop_remote','boost_stop_ui','boost_stop_notif','boost_expire_template','boost_expire_tick'] }}"
        sequence:
          # Si déclenché par le tick/template: ne continuer que si on est vraiment à l'échéance ET que le boost est encore actif
          - choose:
              - conditions: "{{ trigger.id in ['boost_expire_template','boost_expire_tick'] }}"
                sequence:
                  - condition: template
                    value_template: >-
                      {% set ts = state_attr(timer_id, 'timestamp') | int(0) %}
                      {% set nowts = now().timestamp() | int %}
                      {{ ts > 0
                         and nowts >= ts
                         and ( is_state('!input boost_switch', 'on') or is_state('!input mode_entity', 'Manuel') ) }}
            default: []

          # Si c'est la notif : garde-fou tag/action
          - condition: template
            value_template: >-
              {{ trigger.id != 'boost_stop_notif'
                 or (trigger.event is defined
                     and trigger.event.data.action in [stop_action_id, extend_action_id]
                     and trigger.event.data.tag == notif_tag) }}

          # Restaure Presence + 14°C
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Presence" }
          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: 14 }

          # Notifs de fin (écrasent la persistante) vers PRÉSENTS
          - variables:
              present_notify_entities_end: >-
                {{
                  expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                  | selectattr('entity_id','match','^person\\.')
                  | selectattr('state','equalto','home')
                  | map(attribute='entity_id')
                  | map('regex_replace', '^person\\.', 'notify.user_')
                  | list
                }}
          - if:
              - condition: template
                value_template: "{{ present_notify_entities_end | count > 0 }}"
            then:
              - repeat:
                  for_each: "{{ present_notify_entities_end }}"
                  sequence:
                    - service: "{{ repeat.item }}"
                      data:
                        message: "✅ Boost chauffage {{ area_label }} terminé."
                        data:
                          tag: "{{ notif_tag }}"
                          persistent: false
                          sticky: false

          # Sync UI (idempotent)
          - condition: state
            entity_id: !input boost_switch
            state: "on"
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }



mode: restart
