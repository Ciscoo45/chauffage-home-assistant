blueprint:
  name: Boost Chauffage
  description: >

    version Boost : v0.08 - 2025-10-19


    Active un mode "Boost" pendant une durée déterminée pour le chauffage de la pièce sélectionnée.

    Permet de déroger à la programmation en cours et d'y revenir automatiquement après le délai défini.
    
    
    **Déclencheurs** :
        - Bouton Ikea Styrbar ou Rodret (appui sur "On")
        - Bouton sur le dashboard (via un input_boolean)
      
    **Actions lors du démarrage** :
        - Pièce sélectionnée > Chauffage > Mode sur Manuel + Consigne sur la température choisie
        - Lance un compte à rebours de du temps paramétré (enregistre l'heure de fin)
        - Envoie une notification persistante avec bouton Arrêter sur les appareils des personnes du groupe d'utilisateurs présents dans le foyer
        - Actualise le tableau de bord pour afficher l'état actif du boost et l'heure de fin automatique
      
    **Actions d'arrêt** (fin du boost ou interruption) :
        - Pièce sélectionnée > Chauffage > Mode sur Presence + Consigne sur 14°C
        - Supprime la notification persistante de boost sur les appareils
        - Actualise l'état du tableau de bord
      
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Boost.yaml
  domain: automation

  
  input:
  
    remote_button:
      name: Télécommande Styrbar (Ikea E2001/E2002) ou Rodret (Ikea E2201)
      description: Télécommande Ikea Styrbar ou Rodret appairée via ZHA (pour le déclenchement physique)
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          
    boost_switch:
      name: Commutateur Boost (Dashboard)
      description: "Entité input_boolean (On/Off) utilisée par le dashboard Lovelace pour activer/arrêter le boost"
      selector:
        entity:
          domain: input_boolean

    timer_entity:
      name: Horaire de fin de Boost
      description: Entité input_datetime (date & heure) qui stockera l'heure de fin du boost
      selector:
        entity:
          domain: input_datetime
                    
    mode_entity:
      name: Mode Chauffage SdB
      description: Entité de sélection du mode de chauffage (input_select)
      selector:
        entity:
          domain: input_select
          
    consigne_entity:
      name: Consigne Chauffage SdB
      description: Consigne de température de la SDB (input_number)
      default: input_number.consigne_sdb
      selector:
        entity:
          domain: input_number


# Automatisation du Boost de chauffage de la SdB (35 minutes)
trigger:
  
  # 1. Bouton physique IKEA Styrbar (appui sur "On" pour démarrer)
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_button
      command: "on"
      cluster_id: 6
    id: boost_start_remote
  
  # Arrêt via bouton physique (appui sur "Off")
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_button
      command: "off"
      cluster_id: 6
    id: boost_stop_remote
  
  # 2. Dashboard Lovelace (ACTIVATION du boost via bouton virtuel)
  - platform: state
    entity_id: !input boost_switch
    from: "off"
    to: "on"
    id: boost_start_ui
  
  # Dashboard Lovelace (ARRET du boost via bouton)
  - platform: state
    entity_id: !input boost_switch
    from: "on"
    to: "off"
    id: boost_stop_ui
  
  # 3. Action "Arrêter" depuis la notification persistante sur mobile
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: "STOP_BOOST"
    id: boost_stop_notif


# Pas de conditions supplémentaires (le boost se déclenche dès qu'un trigger survient)
condition: []


# Script des actions selon le type de déclencheur
action:

  # Pré-calcul de l'heure de fin du boost (maintenant + 35 minutes)
  - variables:
      boost_end_ts: "{{ (now() + timedelta(minutes=35)).timestamp() | int }}"
  - choose:
      # --- DÉMARRAGE DU BOOST (bouton physique On ou via dashboard) ---
      - conditions:
          - "{{ trigger.id in ['boost_start_remote', 'boost_start_ui'] }}"
          
        sequence:
        
          # 1. Passe le mode de chauffage en "Manuel"
          - service: input_select.select_option
            target:
              entity_id: !input mode_entity
            data:
              option: "Manuel"
              
          # 2. Règle la consigne de température à 22°C
          - service: input_number.set_value
            target:
              entity_id: !input consigne_entity
            data:
              value: 22
              
          # 3. Démarre le compte à rebours en enregistrant l'heure de fin (maintenant + 35min)
          - service: input_datetime.set_datetime
            target:
              entity_id: !input timer_entity
            data:
              timestamp: "{{ boost_end_ts }}"
              
          # 4. Envoie une notification persistante (non effaçable) aux utilisateurs présents, avec le bouton "Arrêter"
          - choose:
              # Notification pour Michel (si présent à la maison)
              - conditions:
                  - condition: state
                    entity_id: person.michel
                    state: "home"
                sequence:
                  - service: notify.mobile_app_pixel_4a_5g
                    data:
                      title: "🔆 Boost Chauffage SdB Etg activé"
                      message: "Chauffage en Boost jusqu'à {{ (now() + timedelta(minutes=35)).strftime('%H:%M') }}."
                      data:
                        tag: "sdb_boost"
                        persistent: true     # notification non balayable
                        sticky: true         # reste affichée même en appuyant dessus
                        actions:
                          - action: "STOP_BOOST"
                            title: "Arrêter"
                            
              # Notification pour Ciscoo (si présent à la maison)
              - conditions:
                  - condition: state
                    entity_id: person.ciscoo
                    state: "home"
                sequence:
                  - service: notify.mobile_app_pixel_7_pro
                    data:
                      title: "🔆 Boost Chauffage SdB Etg activé"
                      message: "Chauffage en Boost jusqu'à {{ (now() + timedelta(minutes=35)).strftime('%H:%M') }}."
                      data:
                        tag: "sdb_boost"
                        persistent: true
                        sticky: true
                        actions:
                          - action: "STOP_BOOST"
                            title: "Arrêter"
                            
          # 5. Active le commutateur boost (si déclenché par le bouton physique pour synchroniser l'UI)
          - condition: state
            entity_id: !input boost_switch
            state: "off"
          - service: input_boolean.turn_on
            target:
              entity_id: !input boost_switch
              
          # 6. Attendre 35 minutes (durée du boost) avant l'arrêt automatique, sauf interruption manuelle
          - delay: "00:35:00"
          
          # 7. À la fin du délai, arrête le boost (équivaut à appuyer sur "Arrêter")
          - service: input_boolean.turn_off
            target:
              entity_id: !input boost_switch
              

      # --- FIN DU BOOST / ARRÊT ANTICIPÉ (bouton physique Off, bouton UI "Arrêter" ou notif mobile "Arrêter") ---
      - conditions:
          - "{{ trigger.id in ['boost_stop_remote', 'boost_stop_ui', 'boost_stop_notif'] }}"
          
        sequence:
        
          # 1. Remet le mode de chauffage en "Presence"
          - service: input_select.select_option
            target:
              entity_id: !input mode_entity
            data:
              option: "Presence"
              
          # 2. Abaisse la consigne de température à 14°C
          - service: input_number.set_value
            target:
              entity_id: !input consigne_entity
            data:
              value: 14
              
          # 3. Supprime la notification persistante de boost sur les mobiles (en envoyant une notification de fin)
          - service: notify.mobile_app_pixel_4a_5g
            data:
              message: "✅ Boost chauffage SdB Etg terminé."
              data:
                tag: "sdb_boost"
                persistent: false   # notification classique (écrase la précédente)
                sticky: false
          - service: notify.mobile_app_pixel_7_pro
            data:
              message: "✅ Boost chauffage SdB Etg terminé."
              data:
                tag: "sdb_boost"
                persistent: false
                sticky: false
                
          # 4. Met à jour le commutateur de boost sur 'off' si besoin (si arrêté par télécommande ou notif)
          - condition: state
            entity_id: !input boost_switch
            state: "on"
          - service: input_boolean.turn_off
            target:
              entity_id: !input boost_switch


# Permet de relancer le boost immédiatement après une interruption (mode restart)
mode: restart
