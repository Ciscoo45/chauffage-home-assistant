blueprint:
  name: Boost Chauffage by C.
  description: >
    version Boost : v0.31 - 2025-10-20

  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Boost.yaml
  domain: automation

  input:

    piece:
      name: Pièce
      description: Choisis la pièce concernée
      selector:
        area: {}

    users_group:
      name: Groupe des utilisateurs éligibles
      description: >
        Groupe Home Assistant contenant des entités person.* (ex: group.utilisateurs_maison).
        Seuls les utilisateurs PRÉSENTS (state: home) recevront les notifications.
      selector:
        entity:
          domain: group

    remote_button:
      name: "[Optionnel] Télécommande Ikea Styrbar / Rodret"
      description: Appairée via ZHA (E2001/E2002/E2201)
      default: ""
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden

    boost_switch:
      name: Commutateur Boost (Dashboard)
      description: input_boolean qui active/arrête le boost
      selector:
        entity:
          domain: input_boolean

    timer_entity:
      name: Horaire de fin de Boost
      description: input_datetime (date+heure) qui stocke l'heure de fin
      selector:
        entity:
          domain: input_datetime

    mode_entity:
      name: Entité Mode du module Chauffage
      description: input_select du mode chauffage de la pièce
      selector:
        entity:
          domain: input_select

    consigne_entity:
      name: Entité Consigne du module Chauffage
      description: input_number consigne du chauffage de la pièce
      selector:
        entity:
          domain: input_number

    boost_temp_helper:
      name: Helper — Consigne de boost (°C)
      description: input_number affiché sur le dashboard
      selector:
        entity:
          domain: input_number

    consigne_boost_valeur_de_depart:
      name: Consigne par défaut (°C)
      description: Valeur de départ copiée dans le helper lors du (re)démarrage/chargement
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          mode: slider

    boost_duration_helper:
      name: Helper — Durée de boost (minutes)
      description: input_number affiché sur le dashboard
      selector:
        entity:
          domain: input_number

    duree_boost_valeur_de_depart:
      name: Durée par défaut (minutes)
      description: Valeur de départ copiée dans le helper lors du (re)démarrage/chargement
      default: 40
      selector:
        number:
          min: 5
          max: 180
          step: 5
          mode: slider

    boost_extend_step_minutes:
      name: Pas d’extension (minutes)
      description: Minutes ajoutées à chaque appui sur “+X min”
      default: 10
      selector:
        number:
          min: 5
          max: 60
          step: 5
          mode: slider

    sync_helpers_on_reload:
      name: Initialiser les helpers à chaque redémarrage / rechargement
      description: Si activé, copie les valeurs par défaut ci-dessus vers les helpers au démarrage de HA et lorsqu'on recharge les automatisations
      default: true
      selector:
        boolean: {}

# Déclencheurs
trigger:
  # Physique ON/OFF
  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "on", cluster_id: 6 }
    id: boost_start_remote

  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "off", cluster_id: 6 }
    id: boost_stop_remote

  # UI ON/OFF
  - platform: state
    entity_id: !input boost_switch
    from: "off"
    to: "on"
    id: boost_start_ui

  - platform: state
    entity_id: !input boost_switch
    from: "on"
    to: "off"
    id: boost_stop_ui

  # Notifs mobiles (on filtre plus loin)
  - platform: event
    event_type: mobile_app_notification_action
    id: boost_stop_notif

  # Initialisation des helpers au démarrage / rechargement (optionnelle)
  - platform: homeassistant
    event: start
    id: init_on_start

  - platform: event
    event_type: automation_reloaded
    id: init_on_reload

condition: []

action:
  # Variables & identifiants par pièce
  - variables:
      area_id: !input piece
      users_group_entity: !input users_group

      duration_helper: !input boost_duration_helper
      temp_helper: !input boost_temp_helper
      timer_id: !input timer_entity
      sync_reload: !input sync_helpers_on_reload
      default_minutes: !input duree_boost_valeur_de_depart
      default_temp: !input consigne_boost_valeur_de_depart
      extend_step: !input boost_extend_step_minutes

      area_label: >-
        {{ area_name(area_id) if area_name(area_id) is not none else area_id }}

      # Identifiants uniques par pièce pour les notifs
      notif_tag: >-
        {{ 'boost_' ~ area_id }}
      stop_action_id: >-
        {{ ('STOP_BOOST_' ~ area_id)|upper }}
      extend_action_id: >-
        {{ ('EXTEND_BOOST_' ~ area_id)|upper }}

      # Helpers actuels (avec bornes issues des selectors)
      boost_minutes: >-
        {{ [ [ states(duration_helper) | int(default_minutes), 10 ] | max, 600 ] | min }}
      boost_target_temp: >-
        {{ [ [ states(temp_helper) | float(default_temp), 15 ] | max, 22 ] | min }}

      # Heures de fin (calcul initial)
      boost_end_ts: >-
        {{ (now() + timedelta(minutes=boost_minutes)).timestamp() | int }}
      boost_end_hhmm: >-
        {{ (now() + timedelta(minutes=boost_minutes)).strftime('%H:%M') }}

      # ==== Cibles de notif: liste des user_id PRÉSENTS (sans append) ====
      present_user_ids: >-
        {{
          expand(state_attr(users_group_entity, 'entity_id') | default([], true))
          | selectattr('entity_id','match','^person\\.')
          | selectattr('state','equalto','home')
          | map(attribute='attributes.user_id')
          | reject('equalto', none)
          | list
        }}
      has_targets: "{{ present_user_ids | count > 0 }}"

  - choose:

      # =============== INITIALISATION DES HELPERS ===============
      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and not sync_reload }}"
        sequence:
          - stop: "Initialisation des helpers désactivée (sync_helpers_on_reload = false)."

      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and sync_reload }}"
        sequence:
          - service: input_number.set_value
            target: { entity_id: !input boost_duration_helper }
            data: { value: "{{ default_minutes | int }}" }

          - service: input_number.set_value
            target: { entity_id: !input boost_temp_helper }
            data: { value: "{{ default_temp | float }}" }

          - stop: "Helpers initialisés avec les valeurs par défaut."

      # =============== DÉMARRAGE ===============
      - conditions: "{{ trigger.id in ['boost_start_remote', 'boost_start_ui'] }}"
        sequence:
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Manuel" }

          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: "{{ boost_target_temp }}" }

          - service: input_datetime.set_datetime
            target: { entity_id: !input timer_entity }
            data: { timestamp: "{{ boost_end_ts }}" }

          # Notification persistante -> vers PRÉSENTS
          - if:
              - condition: template
                value_template: "{{ has_targets }}"
            then:
              - service: notify.notify
                data:
                  title: "🔆 Boost chauffage {{ area_label }} activé"
                  message: "Consigne {{ boost_target_temp|round(1) }}° • Fin {{ boost_end_hhmm }} ({{ boost_minutes }} min)"
                  target: "{{ present_user_ids }}"
                  data:
                    tag: "{{ notif_tag }}"
                    persistent: true
                    sticky: true
                    actions:
                      - action: "{{ stop_action_id }}"
                        title: "Arrêter"
                      - action: "{{ extend_action_id }}"
                        title: "+{{ extend_step }} min"

          # Synchronisation UI si déclenché physiquement
          - condition: state
            entity_id: !input boost_switch
            state: "off"
          - service: input_boolean.turn_on
            target: { entity_id: !input boost_switch }

          # ======== Boucle d'attente réactive (expire / stop / +X min) ========
          - repeat:
              while: "{{ true }}"
              sequence:
                - variables:
                    now_ts: "{{ now().timestamp() | int }}"
                    end_ts: >-
                      {{ state_attr(timer_id, 'timestamp') | int(boost_end_ts) }}
                    remaining: "{{ (end_ts - now_ts) | max(0) }}"
                - choose:
                    - conditions: "{{ remaining == 0 }}"
                      sequence:
                        - service: input_boolean.turn_off
                          target: { entity_id: !input boost_switch }
                        - stop: "Boost expiré (fin de boucle)."
                  default: []

                - wait_for_trigger:
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        tag: "{{ notif_tag }}"
                        action: "{{ stop_action_id }}"
                    - platform: event
                      event_type: mobile_app_notification_action
                      event_data:
                        tag: "{{ notif_tag }}"
                        action: "{{ extend_action_id }}"
                  timeout:
                    seconds: "{{ remaining }}"
                  continue_on_timeout: true

                - choose:
                    # STOP pressé
                    - conditions: >-
                        {{ wait.trigger is defined
                           and wait.trigger.event is defined
                           and wait.trigger.event.data.action == stop_action_id }}
                      sequence:
                        - service: input_boolean.turn_off
                          target: { entity_id: !input boost_switch }
                        - stop: "Boost arrêté par notification."
                    # EXTEND pressé
                    - conditions: >-
                        {{ wait.trigger is defined
                           and wait.trigger.event is defined
                           and wait.trigger.event.data.action == extend_action_id }}
                      sequence:
                        - variables:
                            new_end_ts: "{{ end_ts + (extend_step * 60) }}"
                        - service: input_datetime.set_datetime
                          target: { entity_id: !input timer_entity }
                          data: { timestamp: "{{ new_end_ts }}" }
                        # Mise à jour de la notif -> PRÉSENTS recalculés (sans append)
                        - variables:
                            present_user_ids_loop: >-
                              {{
                                expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                                | selectattr('entity_id','match','^person\\.')
                                | selectattr('state','equalto','home')
                                | map(attribute='attributes.user_id')
                                | reject('equalto', none)
                                | list
                              }}
                        - if:
                            - condition: template
                              value_template: "{{ present_user_ids_loop | count > 0 }}"
                          then:
                            - service: notify.notify
                              data:
                                title: "🔆 Boost chauffage {{ area_label }} prolongé"
                                message: "Fin {{ (as_datetime(new_end_ts) | as_local).strftime('%H:%M') }}"
                                target: "{{ present_user_ids_loop }}"
                                data:
                                  tag: "{{ notif_tag }}"
                                  persistent: true
                                  sticky: true
                                  actions:
                                    - action: "{{ stop_action_id }}"
                                      title: "Arrêter"
                                    - action: "{{ extend_action_id }}"
                                      title: "+{{ extend_step }} min"
                  default: []

      # =============== EXTENSION PAR NOTIF (si appelée hors boucle) ===============
      - conditions: "{{ trigger.id == 'boost_stop_notif' }}"
        sequence:
          - condition: template
            value_template: >-
              {{ trigger.event is defined
                 and trigger.event.data.tag == notif_tag
                 and trigger.event.data.action == extend_action_id }}
          - variables:
              current_end: "{{ state_attr(timer_id, 'timestamp') | int(boost_end_ts) }}"
              new_end: "{{ current_end + (extend_step * 60) }}"
          - service: input_datetime.set_datetime
            target: { entity_id: !input timer_entity }
            data: { timestamp: "{{ new_end }}" }
          # Mise à jour de la notif -> PRÉSENTS recalculés (sans append)
          - variables:
              present_user_ids_once: >-
                {{
                  expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                  | selectattr('entity_id','match','^person\\.')
                  | selectattr('state','equalto','home')
                  | map(attribute='attributes.user_id')
                  | reject('equalto', none)
                  | list
                }}
          - if:
              - condition: template
                value_template: "{{ present_user_ids_once | count > 0 }}"
            then:
              - service: notify.notify
                data:
                  title: "🔆 Boost chauffage {{ area_label }} prolongé"
                  message: "Nouvelle fin {{ (as_datetime(new_end) | as_local).strftime('%H:%M') }}"
                  target: "{{ present_user_ids_once }}"
                  data:
                    tag: "{{ notif_tag }}"
                    persistent: true
                    sticky: true
                    actions:
                      - action: "{{ stop_action_id }}"
                        title: "Arrêter"
                      - action: "{{ extend_action_id }}"
                        title: "+{{ extend_step }} min"
          - stop: "Extension traitée."

      # =============== ARRÊT ===============
      - conditions: "{{ trigger.id in ['boost_stop_remote', 'boost_stop_ui', 'boost_stop_notif'] }}"
        sequence:
          - condition: template
            value_template: >-
              {{ trigger.id != 'boost_stop_notif'
                 or (trigger.event is defined
                     and trigger.event.data.action == stop_action_id
                     and trigger.event.data.tag == notif_tag) }}
          - condition: state
            entity_id: !input boost_switch
            state: "on"

          # Restaure Presence + 14°C
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Presence" }
          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: 14 }

          # Notif de fin -> PRÉSENTS recalculés (sans append)
          - variables:
              present_user_ids_end: >-
                {{
                  expand(state_attr(users_group_entity, 'entity_id') | default([], true))
                  | selectattr('entity_id','match','^person\\.')
                  | selectattr('state','equalto','home')
                  | map(attribute='attributes.user_id')
                  | reject('equalto', none)
                  | list
                }}
          - if:
              - condition: template
                value_template: "{{ present_user_ids_end | count > 0 }}"
            then:
              - service: notify.notify
                data:
                  message: "✅ Boost chauffage {{ area_label }} terminé."
                  target: "{{ present_user_ids_end }}"
                  data:
                    tag: "{{ notif_tag }}"
                    persistent: false
                    sticky: false

          # Synchronisation UI si besoin
          - condition: state
            entity_id: !input boost_switch
            state: "on"
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }

mode: restart
