blueprint:
  name: Boost Chauffage
  description: >

    version Boost : v0.24 - 2025-10-19

    Active un mode "Boost" pendant une durée déterminée pour le chauffage de la pièce sélectionnée.
    Paramétrage pilotable via dashboard (consigne & durée) + valeurs par défaut définies au moment d'instancier le blueprint.
    
    **Déclencheurs** :
        - Bouton Ikea Styrbar/Rodret (On/Off)
        - Bouton sur le dashboard (input_boolean)
        - (optionnel) Au démarrage de Home Assistant / rechargement des automatisations pour initialiser les helpers
      
    **Démarrage** :
        - Mode -> Manuel + Consigne = valeur du Helper
        - Enregistre l'heure de fin
        - Notification persistante avec bouton "Arrêter"
        - Synchronise l’UI
      
    **Arrêt** :
        - Mode -> Presence + Consigne = 14°C
        - Nettoie la notif
        - Synchronise l’UI
      
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Boost.yaml
  domain: automation

  input:

    piece:
      name: Pièce
      description: Choisis la pièce concernée
      selector:
        area: {}

    remote_button:
      name: "[Optionnel] Télécommande Ikea Styrbar / Rodret"
      description: Appairée via ZHA (E2001/E2002/E2201)
      default: ""
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          
    boost_switch:
      name: Commutateur Boost (Dashboard)
      description: input_boolean qui active/arrête le boost
      selector:
        entity:
          domain: input_boolean

    timer_entity:
      name: Horaire de fin de Boost
      description: input_datetime (date+heure) qui stocke l'heure de fin
      selector:
        entity:
          domain: input_datetime
                    
    mode_entity:
      name: Entité Mode du module Chauffage
      description: input_select du mode chauffage de la pièce 
      selector:
        entity:
          domain: input_select
          
    consigne_entity:
      name: Entité Consigne du module Chauffage
      description: input_number consigne du chauffage de la pièce 
      selector:
        entity:
          domain: input_number
          
    boost_temp_helper:
      name: Helper — Consigne de boost (°C)
      description: input_number affiché sur le dashboard 
      selector:
        entity:
          domain: input_number

    consigne_boost_valeur_de_depart:
      name: Consigne par défaut (°C)
      description: Valeur de départ pour cette pièce copiée dans le helper lors du (re)démarrage/chargement
      default: 21
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          mode: slider
          
    boost_duration_helper:
      name: Helper — Durée de boost (minutes)
      description: input_number affiché sur le dashboard 
      selector:
        entity:
          domain: input_number

    duree_boost_valeur_de_depart:
      name: Durée par défaut (minutes)
      description: Valeur de départ copiée dans le helper lors du (re)démarrage/chargement
      default: 40
      selector:
        number:
          min: 5
          max: 180
          step: 5
          mode: slider

    sync_helpers_on_reload:
      name: Initialiser les helpers à chaque redémarrage / rechargement
      description: Si activé, copie les valeurs par défaut ci-dessus vers les helpers au démarrage de HA et lorsqu'on recharge les automatisations
      default: true
      selector:
        boolean: {}

# Déclencheurs
trigger:
  # Physique ON/OFF
  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "on", cluster_id: 6 }
    id: boost_start_remote

  - platform: event
    event_type: zha_event
    event_data: { device_id: !input remote_button, command: "off", cluster_id: 6 }
    id: boost_stop_remote

  # UI ON/OFF
  - platform: state
    entity_id: !input boost_switch
    from: "off"
    to: "on"
    id: boost_start_ui

  - platform: state
    entity_id: !input boost_switch
    from: "on"
    to: "off"
    id: boost_stop_ui

  # Notifs mobiles (on filtre plus loin)
  - platform: event
    event_type: mobile_app_notification_action
    id: boost_stop_notif

  # Initialisation des helpers au démarrage / rechargement (optionnelle)
  - platform: homeassistant
    event: start
    id: init_on_start

  - platform: event
    event_type: automation_reloaded
    id: init_on_reload

condition: []

action:
  # Variables & identifiants par pièce (assignations directes avec !input, puis usage dans templates)
  - variables:
      area_id: !input piece
      duration_helper: !input boost_duration_helper
      temp_helper: !input boost_temp_helper
      sync_reload: !input sync_helpers_on_reload
      default_minutes: !input duree_boost_valeur_de_depart
      default_temp: !input consigne_boost_valeur_de_depart

      area_label: >-
        {{ area_name(area_id) if area_name(area_id) is not none else area_id }}

      # Identifiants uniques par pièce pour les notifs
      notif_tag: >-
        {{ 'boost_' ~ area_id }}
      stop_action_id: >-
        {{ ('STOP_BOOST_' ~ area_id)|upper }}
        
      # Helpers actuels (avec bornes issues des selectors)
      boost_minutes: >-
        {{ [ [ states(duration_helper) | int(default_minutes), 10 ] | max, 600 ] | min }}
      boost_target_temp: >-
        {{ [ [ states(temp_helper) | float(default_temp), 15 ] | max, 22 ] | min }}

      # Heures de fin
      boost_end_ts: >-
        {{ (now() + timedelta(minutes=boost_minutes)).timestamp() | int }}
      boost_end_hhmm: >-
        {{ (now() + timedelta(minutes=boost_minutes)).strftime('%H:%M') }}

  - choose:

      # =============== INITIALISATION DES HELPERS ===============
      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and not sync_reload }}"
        sequence:
          - stop: "Initialisation des helpers désactivée (sync_helpers_on_reload = false)."

      - conditions: "{{ trigger.id in ['init_on_start','init_on_reload'] and sync_reload }}"
        sequence:
          # Copie les valeurs par défaut vers les helpers du dashboard
          - service: input_number.set_value
            target: { entity_id: !input boost_duration_helper }
            data: { value: "{{ default_minutes | int }}" }

          - service: input_number.set_value
            target: { entity_id: !input boost_temp_helper }
            data: { value: "{{ default_temp | float }}" }

          - stop: "Helpers initialisés avec les valeurs par défaut."

      # =============== DÉMARRAGE ===============
      - conditions: "{{ trigger.id in ['boost_start_remote', 'boost_start_ui'] }}"
        sequence:
          # Mode Manuel
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Manuel" }

          # Consigne = helper (écrit dans l’entité consigne chauffage)
          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: "{{ boost_target_temp }}" }

          # Sauvegarde de l'heure de fin
          - service: input_datetime.set_datetime
            target: { entity_id: !input timer_entity }
            data: { timestamp: "{{ boost_end_ts }}" }

          # Notifications persistantes (avec tag + action uniques)
          - choose:
              - conditions:
                  - condition: state
                    entity_id: person.michel
                    state: "home"
                sequence:
                  - service: notify.mobile_app_pixel_4a_5g
                    data:
                      title: "🔆 Boost chauffage {{ area_label }} activé"
                      message: "Consigne {{ boost_target_temp|round(1) }}° • Fin {{ boost_end_hhmm }} ({{ boost_minutes }} min)"
                      data:
                        tag: "{{ notif_tag }}"
                        persistent: true
                        sticky: true
                        actions:
                          - action: "{{ stop_action_id }}"
                            title: "Arrêter"
              - conditions:
                  - condition: state
                    entity_id: person.ciscoo
                    state: "home"
                sequence:
                  - service: notify.mobile_app_pixel_7_pro
                    data:
                      title: "🔆 Boost chauffage {{ area_label }} activé"
                      message: "Consigne {{ boost_target_temp|round(1) }}° • Fin {{ boost_end_hhmm }} ({{ boost_minutes }} min)"
                      data:
                        tag: "{{ notif_tag }}"
                        persistent: true
                        sticky: true
                        actions:
                          - action: "{{ stop_action_id }}"
                            title: "Arrêter"

          # Synchronisation UI si déclenché physiquement
          - condition: state
            entity_id: !input boost_switch
            state: "off"
          - service: input_boolean.turn_on
            target: { entity_id: !input boost_switch }

          # Attente de la durée (templatable)
          - delay:
              minutes: "{{ boost_minutes | int }}"

          # Arrêt automatique
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }

      # =============== ARRÊT ===============
      - conditions: "{{ trigger.id in ['boost_stop_remote', 'boost_stop_ui', 'boost_stop_notif'] }}"
        sequence:
          # Garde-fous :
          # - si notif: action + tag doivent correspondre à CETTE pièce
          # - boost de cette pièce doit être actif
          - condition: template
            value_template: >-
              {{ trigger.id != 'boost_stop_notif'
                 or (trigger.event is defined
                     and trigger.event.data.action == stop_action_id
                     and trigger.event.data.tag == notif_tag) }}
          - condition: state
            entity_id: !input boost_switch
            state: "on"

          # Restaure Presence + 14°C
          - service: input_select.select_option
            target: { entity_id: !input mode_entity }
            data: { option: "Presence" }
          - service: input_number.set_value
            target: { entity_id: !input consigne_entity }
            data: { value: 14 }

          # Notifs de fin (écrasent la persistante)
          - service: notify.mobile_app_pixel_4a_5g
            data:
              message: "✅ Boost chauffage {{ area_label }} terminé."
              data:
                tag: "{{ notif_tag }}"
                persistent: false
                sticky: false
          - service: notify.mobile_app_pixel_7_pro
            data:
              message: "✅ Boost chauffage {{ area_label }} terminé."
              data:
                tag: "{{ notif_tag }}"
                persistent: false
                sticky: false

          # Synchronisation UI si besoin
          - condition: state
            entity_id: !input boost_switch
            state: "on"
          - service: input_boolean.turn_off
            target: { entity_id: !input boost_switch }

mode: restart
