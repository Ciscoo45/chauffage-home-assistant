# ========= VARIABLES =========
variables:
  switch_global: !input switch_global
  binary_sensor_tous_absents: !input binary_sensor_tous_absents
  binary_sensor_michel_absent: !input binary_sensor_michel_absent
  binary_sensor_francois_absent: ! input binary_sensor_francois_absent

# ========= DÉCLENCHEURS =========
trigger:
  # Tous les utilisateurs partent
  - platform: state
    entity_id: !input binary_sensor_tous_absents
    from: 'off'
    to: 'on'
    id: tous_partent

  # Tous les utilisateurs reviennent
  - platform: state
    entity_id: !input binary_sensor_tous_absents
    from: 'on'
    to: 'off'
    id: tous_reviennent

  # Michel part
  - platform: state
    entity_id: !input binary_sensor_michel_absent
    from: 'off'
    to: 'on'
    id: michel_part

  # Michel revient
  - platform: state
    entity_id: !input binary_sensor_michel_absent
    from: 'on'
    to: 'off'
    id: michel_revient

  # François part
  - platform: state
    entity_id: !input binary_sensor_francois_absent
    from: 'off'
    to: 'on'
    id: francois_part

  # François revient
  - platform: state
    entity_id: !input binary_sensor_francois_absent
    from: 'on'
    to: 'off'
    id: francois_revient

condition:
  - condition: state
    entity_id: !input switch_global
    state: 'on'

# ========= ACTIONS =========
action:
  - choose:
      # === TOUS PARTENT ===
      - conditions:
          - condition: trigger
            id: tous_partent
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏃 Tous les utilisateurs sont partis - activation mode Absence pour toutes les pièces actives"

          # Pour chaque pièce : sauvegarder mode/consigne, puis passer en Absence si mode était Présence
          # (Le blueprint par pièce va automatiquement appliquer la réduction -2°C)
          
          # Liste des pièces (répéter ce pattern pour chaque pièce)
          - variables:
              pieces:
                - { name: "chambre_sssol", mode: ! input mode_chambre_sssol, mode_avant: !input mode_avant_chambre_sssol, consigne_avant: !input consigne_avant_chambre_sssol, local_actif: !input local_actif_chambre_sssol }
                - { name: "bureau", mode: !input mode_bureau, mode_avant: !input mode_avant_bureau, consigne_avant: !input consigne_avant_bureau, local_actif: ! input local_actif_bureau }
                - { name: "cuisine", mode: !input mode_cuisine, mode_avant: !input mode_avant_cuisine, consigne_avant: !input consigne_avant_cuisine, local_actif: !input local_actif_cuisine }
                - { name: "salon", mode: !input mode_salon, mode_avant: !input mode_avant_salon, consigne_avant: !input consigne_avant_salon, local_actif: !input local_actif_salon }
                - { name: "sdb", mode: !input mode_sdb, mode_avant: !input mode_avant_sdb, consigne_avant: ! input consigne_avant_sdb, local_actif: !input local_actif_sdb }
                - { name: "michel", mode: !input mode_michel, mode_avant: !input mode_avant_michel, consigne_avant: !input consigne_avant_michel, local_actif: !input local_actif_michel }
                - { name: "voitures", mode: !input mode_voitures, mode_avant: !input mode_avant_voitures, consigne_avant: !input consigne_avant_voitures, local_actif: !input local_actif_voitures }
                - { name: "couloir", mode: !input mode_couloir, mode_avant: !input mode_avant_couloir, consigne_avant: !input consigne_avant_couloir, local_actif: !input local_actif_couloir }
                - { name: "atelier", mode: !input mode_atelier, mode_avant: !input mode_avant_atelier, consigne_avant: ! input consigne_avant_atelier, local_actif: !input local_actif_atelier }
                - { name: "garconniere", mode: !input mode_garconniere, mode_avant: !input mode_avant_garconniere, consigne_avant: !input consigne_avant_garconniere, local_actif: !input local_actif_garconniere }
                - { name: "telmo", mode: ! input mode_telmo, mode_avant: !input mode_avant_telmo, consigne_avant: !input consigne_avant_telmo, local_actif: ! input local_actif_telmo }
                - { name: "sdb_etg", mode: !input mode_sdb_etg, mode_avant: !input mode_avant_sdb_etg, consigne_avant: ! input consigne_avant_sdb_etg, local_actif: !input local_actif_sdb_etg }

          - repeat:
              for_each: "{{ pieces }}"
              sequence:
                - condition: state
                  entity_id: "{{ repeat.item. local_actif }}"
                  state: 'on'
                
                # Sauvegarder le mode actuel
                - service: input_select.select_option
                  target:
                    entity_id: "{{ repeat.item.mode_avant }}"
                  data:
                    option: "{{ states(repeat.item.mode) }}"
                
                # Si mode était Présence, passer en Absence
                - if:
                    - condition: state
                      entity_id: "{{ repeat.item. mode }}"
                      state: 'Présence'
                  then:
                    - service: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.mode }}"
                      data:
                        option: 'Absence'
                    
                    - service: logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.name }}"
                        message: "Mode Présence → Absence"

      # === TOUS REVIENNENT ===
      - conditions:
          - condition: trigger
            id: tous_reviennent
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏠 Utilisateurs de retour - restauration des modes pour toutes les pièces"

          - variables:
              pieces:
                - { name: "chambre_sssol", mode: !input mode_chambre_sssol, mode_avant: !input mode_avant_chambre_sssol, consigne_avant: !input consigne_avant_chambre_sssol, local_actif: !input local_actif_chambre_sssol }
                - { name: "bureau", mode: !input mode_bureau, mode_avant: !input mode_avant_bureau, consigne_avant: !input consigne_avant_bureau, local_actif: ! input local_actif_bureau }
                - { name: "cuisine", mode: !input mode_cuisine, mode_avant: !input mode_avant_cuisine, consigne_avant: !input consigne_avant_cuisine, local_actif: !input local_actif_cuisine }
                - { name: "salon", mode: !input mode_salon, mode_avant: !input mode_avant_salon, consigne_avant: !input consigne_avant_salon, local_actif: !input local_actif_salon }
                - { name: "sdb", mode: !input mode_sdb, mode_avant: !input mode_avant_sdb, consigne_avant: ! input consigne_avant_sdb, local_actif: !input local_actif_sdb }
                - { name: "michel", mode: !input mode_michel, mode_avant: !input mode_avant_michel, consigne_avant: !input consigne_avant_michel, local_actif: !input local_actif_michel }
                - { name: "voitures", mode: !input mode_voitures, mode_avant: !input mode_avant_voitures, consigne_avant: !input consigne_avant_voitures, local_actif: !input local_actif_voitures }
                - { name: "couloir", mode: !input mode_couloir, mode_avant: !input mode_avant_couloir, consigne_avant: !input consigne_avant_couloir, local_actif: !input local_actif_couloir }
                - { name: "atelier", mode: !input mode_atelier, mode_avant: !input mode_avant_atelier, consigne_avant: ! input consigne_avant_atelier, local_actif: !input local_actif_atelier }
                - { name: "garconniere", mode: !input mode_garconniere, mode_avant: !input mode_avant_garconniere, consigne_avant: !input consigne_avant_garconniere, local_actif: !input local_actif_garconniere }
                - { name: "telmo", mode: ! input mode_telmo, mode_avant: !input mode_avant_telmo, consigne_avant: !input consigne_avant_telmo, local_actif: ! input local_actif_telmo }
                - { name: "sdb_etg", mode: !input mode_sdb_etg, mode_avant: !input mode_avant_sdb_etg, consigne_avant: ! input consigne_avant_sdb_etg, local_actif: !input local_actif_sdb_etg }

          - repeat:
              for_each: "{{ pieces }}"
              sequence:
                - condition: state
                  entity_id: "{{ repeat.item.local_actif }}"
                  state: 'on'
                
                # Restaurer le mode précédent
                - service: input_select.select_option
                  target:
                    entity_id: "{{ repeat.item. mode }}"
                  data:
                    option: "{{ states(repeat.item.mode_avant) }}"
                
                # Si c'était Absence, faire cycle Arrêt puis Absence pour resync
                - if:
                    - condition: state
                      entity_id: "{{ repeat.item.mode_avant }}"
                      state: 'Absence'
                  then:
                    - service: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.mode }}"
                      data:
                        option: 'Arrêt'
                    - delay:
                        seconds: 1
                    - service: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.mode }}"
                      data:
                        option: 'Absence'
                
                - service: logbook.log
                  data:
                    name: "Absence Auto {{ repeat.item.name }}"
                    message: "Restauration mode {{ states(repeat.item.mode_avant) }}"

      # === MICHEL PART (gérer uniquement ses pièces) ===
      - conditions:
          - condition: trigger
            id: michel_part
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏃 Michel est parti - traitement des pièces où il est utilisateur principal"

          - variables:
              pieces:
                - { name: "chambre_sssol", mode: !input mode_chambre_sssol, mode_avant: !input mode_avant_chambre_sssol, utilisateur: !input utilisateur_chambre_sssol, si_principal: !input si_principal_chambre_sssol, local_actif: !input local_actif_chambre_sssol }
                - { name: "bureau", mode: !input mode_bureau, mode_avant: !input mode_avant_bureau, utilisateur: !input utilisateur_bureau, si_principal: !input si_principal_bureau, local_actif: !input local_actif_bureau }
                - { name: "cuisine", mode: ! input mode_cuisine, mode_avant: !input mode_avant_cuisine, utilisateur: !input utilisateur_cuisine, si_principal: ! input si_principal_cuisine, local_actif: !input local_actif_cuisine }
                - { name: "salon", mode: !input mode_salon, mode_avant: !input mode_avant_salon, utilisateur: !input utilisateur_salon, si_principal: !input si_principal_salon, local_actif: !input local_actif_salon }
                - { name: "sdb", mode: !input mode_sdb, mode_avant: !input mode_avant_sdb, utilisateur: !input utilisateur_sdb, si_principal: !input si_principal_sdb, local_actif: !input local_actif_sdb }
                - { name: "michel", mode: !input mode_michel, mode_avant: !input mode_avant_michel, utilisateur: !input utilisateur_michel, si_principal: !input si_principal_michel, local_actif: !input local_actif_michel }
                - { name: "voitures", mode: !input mode_voitures, mode_avant: !input mode_avant_voitures, utilisateur: !input utilisateur_voitures, si_principal: !input si_principal_voitures, local_actif: !input local_actif_voitures }
                - { name: "couloir", mode: !input mode_couloir, mode_avant: !input mode_avant_couloir, utilisateur: ! input utilisateur_couloir, si_principal: !input si_principal_couloir, local_actif: !input local_actif_couloir }
                - { name: "atelier", mode: ! input mode_atelier, mode_avant: !input mode_avant_atelier, utilisateur: !input utilisateur_atelier, si_principal: !input si_principal_atelier, local_actif: !input local_actif_atelier }
