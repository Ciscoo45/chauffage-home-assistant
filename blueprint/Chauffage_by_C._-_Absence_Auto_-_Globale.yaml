blueprint:
  name: Chauffage by C. - Absence Auto - Globale
  description: |

    version Absence Globale : v1.61 - 2025-12-23
    
    auteur : Ciscoo45
    
    
    ___
    
    ## Description
    
    Blueprint **compagnon** de la Gestion Absence Auto qui gère les **transitions** entre Presence et Absence.
    
    
    **Fonctionnement** :
    
    - Détecte quand **tous les utilisateurs partent** ou **reviennent**
    
    - Détecte quand un **utilisateur principal** part ou revient (par pièce)
    
    - Sauvegarde le mode et la consigne avant départ
    
    - Restaure le mode et la consigne au retour :
    
      • **Absence si était en Presence avant le départ** → forcer cycle Arret (1s) puis Presence (resync Scheduler qui gère la consigne)

      • **Absence si était déjà en Absence avant départ** → forcer cycle Arret (1s) puis Absence (resync Scheduler qui gère la consigne)
      
      • **Manuel** → repasser en Manuel + **restaurer la consigne sauvegardée**
    
    - **Ne touche PAS** aux modes Hors-gel ou Arret
    
    
    **Important** : Ce blueprint doit être créé **une seule fois** (pas par pièce).
    
    Il gère toutes les pièces en même temps (1 obligatoire + 19 optionnelles).
    
    
    ___
    
    ## Configuration universelle
    
    Ce blueprint est **100% universel** :
    
    - Support de **1 à 5 utilisateurs** (1 obligatoire + 4 optionnels)
    
    - Support de **1 à 20 pièces** (1 obligatoire + 19 optionnelles)
    
    - Utilise la liste des utilisateurs définie dans `package \ chauffage_absence_auto_config_package.yaml`
    
    - Fonctionne avec n'importe quel groupe de présence
    
    - **Restaure la consigne** en mode Manuel uniquement
    
    
    ___
    
    ## Pré-requis
    
    - Group `group.xxxx_utilisateurs` contenant tous les utilisateurs
    
    - Binary sensors de présence (créés automatiquement par `template \ chauffage_absence_auto_template.yaml`)
    
    - Tous les helpers Absence Auto créés pour chaque pièce

    - **NOUVEAU** : Input boolean `radiateur_xxx_etait_presence` pour chaque pièce
    
    
    ___
    
    ## Paramétrage du Blueprint
    
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto_-_Globale.yaml
  domain: automation

  input:
    # === GLOBAL - DETECTION PRESENCE ===
