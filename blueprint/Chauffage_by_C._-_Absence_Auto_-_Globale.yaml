# ========= DÉCLENCHEURS =========
trigger:
  # Tous les utilisateurs partent
  - platform: state
    entity_id: !input binary_sensor_tous_absents
    from: 'off'
    to: 'on'
    id: tous_partent

  # Tous les utilisateurs reviennent
  - platform: state
    entity_id: !input binary_sensor_tous_absents
    from: 'on'
    to: 'off'
    id: tous_reviennent

  # Utilisateur 1 part
  - platform: state
    entity_id: !input binary_sensor_utilisateur_1_absent
    from: 'off'
    to: 'on'
    id: utilisateur_1_part

  # Utilisateur 1 revient
  - platform: state
    entity_id: !input binary_sensor_utilisateur_1_absent
    from: 'on'
    to: 'off'
    id: utilisateur_1_revient

  # Utilisateur 2 part
  - platform: state
    entity_id: !input binary_sensor_utilisateur_2_absent
    from: 'off'
    to: 'on'
    id: utilisateur_2_part

  # Utilisateur 2 revient
  - platform: state
    entity_id: !input binary_sensor_utilisateur_2_absent
    from: 'on'
    to: 'off'
    id: utilisateur_2_revient

  # Utilisateur 3 part
  - platform: state
    entity_id: !input binary_sensor_utilisateur_3_absent
    from: 'off'
    to: 'on'
    id: utilisateur_3_part

  # Utilisateur 3 revient
  - platform: state
    entity_id: !input binary_sensor_utilisateur_3_absent
    from: 'on'
    to: 'off'
    id: utilisateur_3_revient

  # Utilisateur 4 part
  - platform: state
    entity_id: !input binary_sensor_utilisateur_4_absent
    from: 'off'
    to: 'on'
    id: utilisateur_4_part

  # Utilisateur 4 revient
  - platform: state
    entity_id: !input binary_sensor_utilisateur_4_absent
    from: 'on'
    to: 'off'
    id: utilisateur_4_revient

  # Utilisateur 5 part
  - platform: state
    entity_id: !input binary_sensor_utilisateur_5_absent
    from: 'off'
    to: 'on'
    id: utilisateur_5_part

  # Utilisateur 5 revient
  - platform: state
    entity_id: !input binary_sensor_utilisateur_5_absent
    from: 'on'
    to: 'off'
    id: utilisateur_5_revient

condition:
  - condition: state
    entity_id: !input switch_global
    state: 'on'

# ========= ACTIONS =========
action:
  - choose:
      # === TOUS PARTENT ===
      - conditions:
          - condition: trigger
            id: tous_partent
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏃 Tous les utilisateurs sont partis - traitement des pièces actives"

          - repeat:
              for_each: "{{ pieces }}"
              sequence:
                # Vérifier que la pièce a la gestion active
                - condition: template
                  value_template: "{{ repeat.item.local_actif not in ['', 'none', None] and is_state(repeat.item.local_actif, 'on') }}"
                
                # Vérifier que le mode est Présence, Absence ou Manuel
                - condition: template
                  value_template: "{{ states(repeat.item.mode) in ['Présence', 'Absence', 'Manuel'] }}"
                
                # Sauvegarder le mode actuel
                - service: input_select.select_option
                  target:
                    entity_id: "{{ repeat.item.mode_avant }}"
                  data:
                    option: "{{ states(repeat.item.mode) }}"
                
                # Si mode était Présence, passer en Absence
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item.mode) == 'Présence' }}"
                  then:
                    - service: input_select.select_option
                      target:
                        entity_id: "{{ repeat.item.mode }}"
