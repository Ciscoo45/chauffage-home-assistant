blueprint:
  name: Chauffage by C.  - Absence Auto - Globale
  description: "

    version Absence Globale : v1.00 - 2025-01-21
    
    auteur : Ciscoo45
    
    
    ___
    
    ## Description
    
    Blueprint **compagnon** de la Gestion Absence Auto qui gère les **transitions** entre présence et absence.
    
    
    **Fonctionnement** :
    
    - Détecte quand **tous les utilisateurs partent** ou **reviennent**
    
    - Détecte quand un **utilisateur principal** part ou revient (par pièce)
    
    - Sauvegarde le mode et la consigne avant départ
    
    - Restaure le mode et la consigne au retour :
    
      • **Présence** → repasser en Présence
      
      • **Manuel** → repasser en Manuel + restaurer consigne
      
      • **Absence** → forcer cycle Arrêt (1s) puis Absence (resync Scheduler)
    
    
    **Important** : Ce blueprint doit être créé **une seule fois** (pas par pièce).
    
    Il gère toutes les pièces en même temps.
    
    
    ___
    
    ## Pré-requis
    
    - Group `group. mell_utilisateurs` contenant tous les utilisateurs
    
    - Binary sensors de présence (créés automatiquement par template. yaml)
    
    - Tous les helpers Absence Auto créés pour chaque pièce
    
    
    ___
    
    ## Paramétrage du Blueprint
    "
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Absence_Auto_-_Globale.yaml
  domain: automation

  input:
