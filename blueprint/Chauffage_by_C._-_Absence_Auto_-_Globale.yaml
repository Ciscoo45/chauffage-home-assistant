# ========= DÉCLENCHEURS =========
trigger: 

  - platform: state
    entity_id: !input binary_sensor_tous_absents
    to: 'on'
    id: tous_partent

  - platform: state
    entity_id: !input binary_sensor_tous_absents
    to: 'off'
    id: tous_reviennent

  - platform: state
    entity_id: !input binary_sensor_utilisateur_1_absent
    to: 'on'
    id: utilisateur_1_part

  - platform: state
    entity_id: !input binary_sensor_utilisateur_1_absent
    to: 'off'
    id: utilisateur_1_revient

  - platform: state
    entity_id: !input binary_sensor_utilisateur_2_absent
    to: 'on'
    id: utilisateur_2_part

  - platform: state
    entity_id: !input binary_sensor_utilisateur_2_absent
    to: 'off'
    id: utilisateur_2_revient

  - platform: state
    entity_id: !input binary_sensor_utilisateur_3_absent
    to: 'on'
    id: utilisateur_3_part

  - platform: state
    entity_id:  !input binary_sensor_utilisateur_3_absent
    to:  'off'
    id:  utilisateur_3_revient

  - platform: state
    entity_id: !input binary_sensor_utilisateur_4_absent
    to: 'on'
    id: utilisateur_4_part

  - platform: state
    entity_id: !input binary_sensor_utilisateur_4_absent
    to: 'off'
    id: utilisateur_4_revient

  - platform: state
    entity_id:  !input binary_sensor_utilisateur_5_absent
    to:  'on'
    id:  utilisateur_5_part

  - platform: state
    entity_id: !input binary_sensor_utilisateur_5_absent
    to: 'off'
    id: utilisateur_5_revient




# ========= CONDITIONS =========
condition:
  - condition: state
    entity_id: !input switch_global
    state: 'on'




    
# ========= ACTIONS =========
# ========= ACTIONS =========
action:
  - choose: 

      # === TOUS PARTENT ===
      - conditions: 
          - condition: trigger
            id: tous_partent
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏃 Tous les utilisateurs sont partis - traitement des pièces communes"

          - repeat:
              for_each:  "{{ pieces }}"
              sequence: 
                - condition: template
                  value_template: "{{ repeat.item.local_actif not in ['','none',None] and is_state(repeat.item.local_actif,'on') }}"

                # ✅ IGNORER les pièces avec utilisateur principal actif (gérées par UTILISATEUR X PART)
                - condition: template
                  value_template: "{{ repeat.item.si_principal in ['','none',None] or not is_state(repeat.item.si_principal,'on') }}"

                # ✅ IGNORER si mode est Hors-gel ou Arret
                - condition: template
                  value_template: "{{ states(repeat.item.mode) in ['Presence','Absence','Manuel'] }}"

                # Si mode était Presence, marquer le flag et basculer en Absence
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item.mode) == 'Presence' }}"
                  then:
                    - service: input_boolean.turn_on
                      target:
                        entity_id:  "{{ repeat.item.etait_presence }}"

                    - service: input_select.select_option
                      target:
                        entity_id:  "{{ repeat.item.mode }}"
                      data:
                        option: 'Absence'

                    - service: logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.nom }}"
                        message: "Mode Presence → Absence (Scheduler gère la consigne)"

                - if:
                    - condition:  template
                      value_template:  "{{ states(repeat.item. mode) in ['Manuel','Absence'] }}"
                  then: 
                    - service: logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.nom }}"
                        message: "Mode {{ states(repeat.item.mode) }} - état sauvegardé"

      # === TOUS REVIENNENT ===
      - conditions: 
          - condition: trigger
            id: tous_reviennent
        sequence:
          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏠 Utilisateurs de retour - restauration des pièces communes"

          - repeat:
              for_each: "{{ pieces }}"
              sequence:
                - condition:  template
                  value_template:  "{{ repeat.item.local_actif not in ['','none',None] and is_state(repeat.item.local_actif,'on') }}"

                # ✅ IGNORER les pièces avec utilisateur principal actif
                - condition: template
                  value_template: "{{ repeat. item.si_principal in ['','none',None] or not is_state(repeat.item.si_principal,'on') }}"

                # ✅ IGNORER si le mode ACTUEL est Hors-gel ou Arret
                - condition: template
                  value_template: "{{ states(repeat.item.mode) not in ['Hors-gel','Arret'] }}"

                # Si le flag etait_presence est actif, restaurer Presence
                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item.etait_presence,'on') }}"
                  then:
                    - service: input_select.select_option
                      target:
                        entity_id:  "{{ repeat.item.mode }}"
                      data: 
                        option: 'Presence'

                    - service: logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.nom }}"
                        message: "Retour → Mode Presence restauré"

                    - service: input_boolean.turn_off
                      target: 
                        entity_id: "{{ repeat.item.etait_presence }}"

      # === UTILISATEUR 1 PART ===
      - conditions:
          - condition: trigger
            id: utilisateur_1_part
        sequence:
          - variables:
              nom_utilisateur: "{{ liste_utilisateurs[0] if liste_utilisateurs|length > 0 else 'Utilisateur1' }}"

          - service: logbook.log
            data:
              name:  "Absence Auto Globale"
              message: "🏃 {{ nom_utilisateur }} est parti - traitement de ses pièces"

          - repeat:
              for_each: "{{ pieces }}"
              sequence:
                - condition: and
                  conditions:
                    - condition: template
                      value_template: "{{ repeat.item.local_actif not in ['','none',None] and is_state(repeat.item.local_actif,'on') }}"
                    - condition: template
                      value_template: "{{ repeat.item.si_principal not in ['','none',None] and is_state(repeat.item. si_principal,'on') }}"
                    - condition: template
                      value_template: "{{ states(repeat.item.utilisateur) == nom_utilisateur }}"
                    - condition: template
                      value_template: "{{ states(repeat.item.mode) in ['Presence','Absence','Manuel'] }}"

                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item.mode) == 'Presence' }}"
                  then:
                    - service: input_boolean. turn_on
                      target: 
                        entity_id: "{{ repeat.item.etait_presence }}"

                    - service: input_select.select_option
                      target:
                        entity_id: "{{ repeat. item.mode }}"
                      data:
                        option: 'Absence'

                    - service: logbook.log
                      data:
                        name:  "Absence Auto {{ repeat.item.nom }}"
                        message: "{{ nom_utilisateur }} absent → Mode Presence → Absence"

                - if: 
                    - condition: template
                      value_template: "{{ states(repeat.item.mode) in ['Manuel','Absence'] }}"
                  then:
                    - service:  logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.nom }}"
                        message: "{{ nom_utilisateur }} absent → Mode {{ states(repeat.item. mode) }}"

      # === UTILISATEUR 1 REVIENT ===
      - conditions:
          - condition:  trigger
            id: utilisateur_1_revient
        sequence: 
          - variables:
              nom_utilisateur: "{{ liste_utilisateurs[0] if liste_utilisateurs|length > 0 else 'Utilisateur1' }}"

          - service: logbook.log
            data:
              name: "Absence Auto Globale"
              message: "🏠 {{ nom_utilisateur }} est de retour - restauration de ses pièces"

          - repeat: 
              for_each: "{{ pieces }}"
              sequence: 
                - condition: and
                  conditions:
                    - condition:  template
                      value_template:  "{{ repeat.item.local_actif not in ['','none',None] and is_state(repeat.item.local_actif,'on') }}"
                    - condition: template
                      value_template: "{{ repeat.item. si_principal not in ['','none',None] and is_state(repeat.item.si_principal,'on') }}"
                    - condition: template
                      value_template: "{{ states(repeat. item.utilisateur) == nom_utilisateur }}"
                    - condition: template
                      value_template: "{{ states(repeat. item.mode) not in ['Hors-gel','Arret'] }}"

                - if:
                    - condition: template
                      value_template: "{{ is_state(repeat.item.etait_presence,'on') }}"
                  then:
                    - service: input_select.select_option
                      target:
                        entity_id:  "{{ repeat.item.mode }}"
                      data:
                        option: 'Presence'

                    - service: logbook.log
                      data:
                        name: "Absence Auto {{ repeat.item.nom }}"
                        message: "{{ nom_utilisateur }} de retour → Mode Presence restauré"

                    - service: input_boolean.turn_off
                      target: 
                        entity_id: "{{ repeat.item.etait_presence }}"

      # === UTILISATEUR 2 PART ===
      - conditions:
          - condition: trigger
            id: utilisateur_2_part
        sequence:
          - variables:
              nom_utilisateur: "{{ liste_utilisateurs[1] if liste_utilisateurs|length > 1 else 'Utilisateur2' }}"

