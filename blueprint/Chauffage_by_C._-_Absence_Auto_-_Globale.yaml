      name: 👥 Chauffage Tous Utilisateurs Absents
      description: "Binary_sensor indiquant si tous les utilisateurs sont absents"
      default: binary_sensor.chauffage_tous_utilisateurs_absents
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_1_absent:
      name: 👤 Utilisateur 1 Absent (obligatoire)
      description: |
        Binary_sensor pour le premier utilisateur si absent : Chauffage Utilisateur1 Absent
        
        Bien rester sur le sensor **binary_sensor.chauffage_utilisateur1_absent** !!
        
        **NE PAS** choisir un sensor type binary_sensor.chauffage_michel_absent :(
      default: binary_sensor.chauffage_utilisateur1_absent
      selector:
        entity:
          domain: binary_sensor

    binary_sensor_utilisateur_2_absent:
      name: 👤 Utilisateur 2 Absent (optionnel)
