blueprint:
  name: Chauffage by C. - Boost
  description: >

    
    version Boost : v1.15 - 2026-10-18

    auteur : Ciscoo45
    

    Blueprint de boost temporaire dérogatif pour le chauffage avec restauration intelligente de mode en fin de boost.

           
    Fonctionnalités :
    
    - Boost manuel via UI ou télécommande Ikea
    
    - Durée et consigne personnalisables
    
    - Extension de durée via notification
    
    - Restauration intelligente : ne restaure la consigne que si le mode précédent était Manuel
    
    - Compatible avec tous les modes (y compris Arrêt)
    
    - Notifications persistantes avec actions
    
    - Affichage de l'heure de fin


    Corrections v1.15 :
    
    - Un seul démarrage effectif via le passage du switch Boost à ON.
    - Le mode et la consigne précédents sont mémorisés UNE FOIS par session.
    - Un nouvel appui physique ON pendant un Boost actif ajoute 5 minutes
      par défaut (le pas d'ajout est configurable, commun avec le bouton +X dans les notifications mobiles).
    - Les commandes sont traitées dans l'ordre ; l'arrêt n'est plus interrompu
      par la notification de changement du switch.
    - L'arrêt physique, UI, mobile ou par expiration emprunte une seule voie.
    - La notification persistante est réellement effacée à l'arrêt.
    - Rattrapage d'une expiration manquée après redémarrage Home Assistant.


    IMPORTANT : vérifier dans le module Pilotage que entity_thermostat_tpi
    désigne bien le Thermostat TPI de la pièce et non le module Boost.
    
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Chauffage_by_C._-_Boost.yaml
  domain: automation

  input:
    piece:
      name: "🏠 Pièce"
      selector: { area: {} }

    users_group:
      name: "👥 Groupe des utilisateurs éligibles aux notifications"
      selector: { entity: { domain: group } }

    remote_button:
      name: "[Optionnel] 🎮 Télécommande IKEA Styrbar / Rodret"
      default: ""
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden

    boost_switch:
      name: "🎚️ Boost (pièce)"
      description: "input_boolean de la pièce (chauffage_boost_input_boolean.yaml)"
      selector: { entity: { domain: input_boolean } }

    boost_timer:
      name: "⌛ Timer boost (pièce)"
      description: "Timer de la pièce (chauffage_boost_timer.yaml)"
      selector: { entity: { domain: timer } }

    timer_entity:
      name: "⏰ Heure de fin de Boost (pièce)"
      description: "input_datetime pour l'affichage dans le dashboard"
      selector: { entity: { domain: input_datetime } }

    mode_entity:
      name: "📋 Radiateur (pièce) Mode"
      selector: { entity: { domain: input_select } }

    consigne_entity:
      name: "🌡️ Radiateur (pièce) Consigne"
      selector: { entity: { domain: input_number } }

    boost_temp_helper:
      name: "🎯 Radiateur (pièce) Consigne de Boost (°C)"
      selector: { entity: { domain: input_number } }

    consigne_boost_valeur_de_depart:
      name: "Consigne Boost par défaut (°C)"
      default: 21
      selector: { number: { min: 0, max: 24, step: 0.5, mode: slider } }

    boost_duration_helper:
      name: "Radiateur (pièce) Durée de Boost"
      selector: { entity: { domain: input_number } }

    duree_boost_valeur_de_depart:
      name: "Durée par défaut (minutes)"
      default: 40
      selector: { number: { min: 1, max: 1200, step: 5, mode: slider } }

    boost_extend_step_minutes:
      name: "➕ Prolongation par nouvel appui ON / notification (minutes)"
      description: >-
        Nombre de minutes ajoutées à chaque nouvel appui physique ON
        lorsque le Boost est en cours, ou via le bouton +X des notifications.
        Valeur par défaut : 5 minutes. Ne réinitialise jamais le mode mémorisé.
      default: 5
      selector: { number: { min: 1, max: 60, step: 1, mode: slider } }

    restore_behavior:
      name: "😇 (pièce) Comportement en fin de Boost"
      description: "Restaurer l'état précédent ou choisir un mode personnalisé"
      selector: { entity: { domain: input_select } }

    restore_mode_custom:
      name: "(pièce) Mode à restaurer en fin de Boost"
      selector: { entity: { domain: input_select } }

    restore_override_consigne:
      name: "(pièce) Forcer une consigne en fin de Boost"
      selector: { entity: { domain: input_boolean } }

    restore_consigne_custom:
      name: "(pièce) Consigne personnalisée de fin de Boost (°C)"
      selector: { entity: { domain: input_number } }

    previous_mode_storage:
      name: "💾 (pièce) Mode précédent mémorisé"
      selector: { entity: { domain: input_text } }

    previous_consigne_storage:
      name: "💾 (pièce) Consigne précédente mémorisée"
      selector: { entity: { domain: input_number } }

    sync_helpers_on_reload:
      name: "Initialiser durée/consigne à chaque redémarrage/rechargement"
      default: false
      selector: { boolean: {} }

# ========= Déclencheurs =========
trigger:
  - platform: event
    event_type: zha_event
    event_data:
