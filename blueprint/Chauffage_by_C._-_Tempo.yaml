blueprint:
  name: Chauffage by C. - EDF Tempo
  description: |

    version Tempo : v1.34 - 2026-01-01
    
    auteur : Ciscoo45
    
    ___

    ## Description

    Blueprint **optionnel** pour les abonnés **Tempo EDF** permettant d'adapter automatiquement la consigne de chauffage, selon :

    - La couleur du jour (Bleu / Blanc / Rouge)

    - La période tarifaire (Heures Creuses / Heures Pleines)

    - Un switch global d'activation/désactivation (toutes pièces)

    - Un switch local d'activation/désactivation (par pièce)

    - L'état de la fonction Boost de dérogation temporaire (prioritaire sur Tempo)


    **Fonctionnement** :

    - Calcule en temps réel une **consigne corrigée** à partir de la consigne de base

    - Applique des réductions paramétrables en HP des jours Blanc et Rouge

    - N'applique **aucune réduction** si :

      • le switch **global** Tempo est désactivé

      • le switch **local** Tempo (de la pièce) est désactivé

      • le jour est **Bleu** (tarif avantageux)

      • on est en **Heures Creuses** (tous les jours)

      • le **Boost** est actif (confort prioritaire)

    - **Modes Arret / Hors-gel** :
      Tempo est ignoré (aucune réduction), MAIS la consigne calculée est maintenue
      à jour en copiant la consigne de base (0° pour Arret, 8° par défaut pour Hors-gel, etc.)


    **Important** : Ce blueprint est **totalement indépendant** des autres blueprints du module de chauffage.

    Vous pouvez l'utiliser ou non selon votre abonnement.


    ___

    ## Pré-requis

    Vous devez disposer de sensors indiquant :

    - La couleur Tempo du jour actuel (valeurs : 'Bleu', 'Blanc', 'Rouge')

    - La période tarifaire actuelle (valeurs : 'Heures Creuses', 'Heures Pleines')


    Ces sensors peuvent être créés via l'API web gratuite https://www.api-couleur-tempo.fr



    ___

    ## Helpers à créer

    Pour chaque pièce équipée, créer les helpers suivants (exemple pour SdB) :


    **input_number** :

    - `radiateur_sdb_consigne` : consigne de base (existant)

    - `radiateur_sdb_consigne_calculee` : consigne corrigée par Tempo (nouvelle consigne de chauffe calculée)

    - `radiateur_sdb_reduction_tempo_blanc` : réduction en HP des jours blancs (0 à 3°C)

    - `radiateur_sdb_reduction_tempo_rouge` : réduction en HP des jours rouges (0 à 15°C)


    **input_boolean** :

    - `tempo_global_actif` : activation/désactivation globale (commun à toutes les pièces)

    - `radiateur_sdb_tempo_actif` : activation/désactivation pour cette pièce

    - `radiateur_sdb_show_tempo_config` : afficher/masquer la config Tempo dans la carte

    - `boost_sdb` : état du boost (existant si vous utilisez le blueprint Boost)


    Voir `config_examples/` pour les définitions complètes.


    ___

    ## Utilisation dans les autres blueprints

    **Dans le blueprint Thermostat TPI** :

    - Utiliser `input_number.radiateur_sdb_consigne_calculee` au lieu de `radiateur_sdb_consigne`

    - Si vous utilisez également le module Absence Auto, utiliser alors dans le Terhmsotat TPI la consigne finale : `input_number.radiateur_sdb_consigne_finale` (tient compte de la réduction Tempo)


    **Dans le blueprint Pilotage** :

    - Garder l'input_number pour la consigne de base, ne pas modifier : `radiateur_sdb_consigne`


    **Dans le blueprint Boost** :

    - Continuer à utiliser `radiateur_sdb_boost_consigne` (pas de changement)


    ___

    ## Paramétrage du Blueprint

  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Tempo.yaml
  domain: automation



  input:
  
    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex: SdB, Salon, Chambre)"
      selector:
        text:

    # === GLOBAL - SENSORS TEMPO ===
    sensor_couleur:
      name: 🎨 Tempo Couleur Actuelle Texte (global)
      description: |
        Sensor indiquant la couleur du jour actuel (Bleu / Blanc / Rouge)

        Ex. : `sensor.tempo_couleur_actuelle_texte`
      selector:
        entity:
          domain: sensor

    sensor_periode:
      name: ⚡ Tempo Période Actuelle (global)
      description: |
        Sensor indiquant la période actuelle (Heures Creuses / Heures Pleines)

        Ex. : `sensor.tempo_periode_actuelle`
      selector:
        entity:
          domain: sensor

    # === par PIECE - CONSIGNES ===
    consigne_base:
      name: 🌡️ Radiateur (pièce) consigne
      description: "Consigne définie par l'utilisateur (modifiée via UI/modes/schedules)"
      selector:
        entity:
          domain: input_number

    consigne_calculee:
      name: 🎯 (pièce) Consigne calculée Tempo Eco (sortie)
      description: "Consigne corrigée selon Tempo Eco (à utiliser aussi désormais dans Thermostat TPI et Pilotage)"
      selector:
        entity:
          domain: input_number

    # === par PIECE - RÉDUCTIONS ===
    reduction_blanc:
      name: ⚪ (pièce) Réduction Tempo Blanc
      description: "Nombre de degrés à retirer en HP des jours blancs (input_number)"
      selector:
        entity:
          domain: input_number

    reduction_rouge:
      name: 🔴 (pièce) Réduction Tempo Rouge
      description: "Nombre de degrés à retirer en HP des jours rouges (input_number)"
      selector:
        entity:
          domain: input_number

    # === GLOBAL - ACTIVATION ===
    switch_global:
      name: 🌐 Tempo Global Actif (global)
      description: |
        Désactive toutes les corrections Tempo (TOUTES les pièces) si OFF (input_boolean)

        Ex. : `input_boolean.tempo_global_actif`
      selector:
        entity:
          domain: input_boolean

    # === par PIECE - ACTIVATION ===
    switch_local:
      name: 🏠 (pièce) Gestion Tempo
      description: "Désactive les corrections Tempo pour CETTE pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    mode_actuel:
      name: 🎚️ Radiateur (pièce) Mode
      description: |
        Liste des modes Presence / Absence / Manuel / Hors-gel / Arret

        pour ignorer Tempo quand on est sur les modes Arret ou Hors-gel.
      selector:
        entity:
          domain: input_select
          
    boost_actif:
      name: ⚡ Boost (pièce)
      description: |
        Module de dérogation temporaire (boost timé), optionnel.
      
        Si ON, ignore les corrections Absence Auto pour cette pièce."

        ⚠️ **Si vous N'utilisez PAS Boost** :  créer une automatisation dummy permettant consigne_dummy = consigne_base (utile si le module optionnel EDF Tempo n'est pas utilisé non plus)
      selector:
        entity:
          domain: input_boolean



          

# ========= VARIABLES =========
variables:

  piece_name: !input piece_name
  consigne_base: !input consigne_base
  consigne_calculee: !input consigne_calculee
  sensor_couleur: !input sensor_couleur
  sensor_periode: !input sensor_periode
  reduction_blanc: !input reduction_blanc
  reduction_rouge: !input reduction_rouge
  switch_global: !input switch_global
  switch_local: !input switch_local
  boost_actif_input: !input boost_actif

  # quand ne pas appliquer la correction Tempo : si en mode Arret ou Hors-gel :
  mode_actuel_input: !input mode_actuel
  mode_val: "{{ states(mode_actuel_input) if mode_actuel_input not in ['', 'none', None] else '' }}"
  skip_tempo: "{{ mode_val in ['Hors-gel', 'Arret'] }}"

  # Valeurs actuelles
  consigne_valeur: "{{ states(consigne_base) | float(19) }}"
  couleur: "{{ states(sensor_couleur) }}"
  periode: "{{ states(sensor_periode) }}"
  tempo_global_on: "{{ is_state(switch_global, 'on') | bool }}"
  tempo_local_on: "{{ is_state(switch_local, 'on') | bool }}"
  boost_on: >-
    {{ boost_actif_input != '' and is_state(boost_actif_input, 'on') }}

  # Calcul de la réduction (inchangé)
  reduction: >-
    {% if not tempo_global_on %}
      {{ 0.0 }}
    {% elif not tempo_local_on %}
      {{ 0.0 }}
    {% elif boost_on %}
      {{ 0.0 }}
    {% elif 'Creuse' in periode %}
      {{ 0.0 }}
    {% elif couleur == 'Bleu' %}
      {{ 0.0 }}
    {% elif couleur == 'Blanc' %}
      {{ states(reduction_blanc) | float(0.0) }}
    {% elif couleur == 'Rouge' %}
      {{ states(reduction_rouge) | float(0.0) }}
    {% else %}
      {{ 0.0 }}
    {% endif %}

  # Consigne finale calculée par Tempo (hors modes Arret/Hors-gel)
  consigne_finale: "{{ consigne_valeur - reduction }}"





# ========= DÉCLENCHEURS =========
trigger:

  - platform: state
    entity_id: !input consigne_base
    # for: "00:00:01"  # pour attendre la MàJ par le Sheduler, si on voit des valeurs transitoires s'afficher

  - platform: state
    entity_id: !input sensor_couleur

  - platform: state
    entity_id: !input sensor_periode

  - platform: state
    entity_id:
      - !input reduction_blanc
      - !input reduction_rouge

  - platform: state
    entity_id: !input switch_global

  - platform: state
    entity_id: !input switch_local

  - platform: state
    entity_id: !input boost_actif

  # IMPORTANT : il faut déclencher aussi quand le mode change (Arret/Hors-gel)
  # - platform: state
  #   entity_id: !input mode_actuel

  - platform: homeassistant
    event: start

  - platform: event
    event_type: automation_reloaded




condition: []





# ========= ACTIONS =========
action:

  - choose:

  
      # Modes Arret / Hors-gel : copier la base vers la calculée
      - conditions:
          - condition: template
            value_template: "{{ skip_tempo }}"
        sequence:
        
          - service: input_number.set_value
            target:
              entity_id: !input consigne_calculee
            data:
              value: "{{ consigne_valeur }}"

          - service: logbook.log
            data:
              name: "Tempo {{ piece_name }}"
              entity_id: !input consigne_calculee
              message: >-
                Mode: {{ mode_val }} → Tempo ignoré (copie base)
                Consigne: {{ consigne_valeur }}°C → {{ consigne_valeur }}°C


      # Modes normaux : appliquer le calcul Tempo
      - conditions:
          - condition: template
            value_template: "{{ not skip_tempo }}"
        sequence:
        
          - service: input_number.set_value
            target:
              entity_id: !input consigne_calculee
            data:
              value: "{{ consigne_finale }}"

          - service: logbook.log
            data:
              name: "Tempo {{ piece_name }}"
              message: >-
                Consigne: {{ consigne_valeur }}°C → {{ consigne_finale }}°C
                ({{ couleur }} {{ periode }}, réduction: -{{ reduction }}°C
                {% if not tempo_global_on %}[Global OFF]{% endif %}
                {% if not tempo_local_on %}[Local OFF]{% endif %}
                {% if boost_on %}[Boost actif]{% endif %})
              entity_id: !input consigne_calculee


mode: queued
max: 5
