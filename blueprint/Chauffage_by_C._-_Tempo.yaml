blueprint:
  name: Chauffage by C. - Gestion Tempo EDF
  description: "

    version Tempo : v1.02 - 2025-12-04
    
    auteur : Ciscoo45
    
    
    ___
    
    ## Description
    
    Blueprint **optionnel** pour les abonnés **Tempo EDF** permettant d'adapter automatiquement la consigne de chauffage, selon :
    
    - La couleur du jour (Bleu / Blanc / Rouge)
    
    - La période tarifaire (Heures Creuses / Heures Pleines)
    
    - Un switch global d'activation/désactivation (toutes pièces)
    
    - Un switch local d'activation/désactivation (par pièce)
    
    - L'état du boost (prioritaire sur Tempo)
    
    
    **Fonctionnement** :
    
    - Calcule en temps réel une **consigne corrigée** à partir de la consigne de base
    
    - Applique des réductions paramétrables en HP des jours Blanc et Rouge
    
    - N'applique **aucune réduction** si :
    
      • le switch **global** Tempo est désactivé
      
      • le switch **local** Tempo (de la pièce) est désactivé
      
      • le jour est **Bleu** (tarif avantageux)
      
      • on est en **Heures Creuses** (tous les jours)
      
      • le **boost** est actif (confort prioritaire)
    
    
    **Important** : Ce blueprint est **totalement indépendant** des autres blueprints du module de chauffage.
    
    Vous pouvez l'utiliser ou non selon votre abonnement.
    
    
    ___
    
    ## Pré-requis
    
    Vous devez disposer de sensors indiquant :
    
    - La couleur Tempo du jour actuel (valeurs : 'Bleu', 'Blanc', 'Rouge')
    
    - La période tarifaire actuelle (valeurs : 'Heures Creuses', 'Heures Pleines')
    
    
    Ces sensors peuvent être créés via l'API gratuite https://www.api-couleur-tempo.fr
    
    
    
    ___
    
    ## Helpers à créer
    
    Pour chaque pièce équipée, créer les helpers suivants (exemple pour SdB) :
    
    
    **input_number** :
    
    - `radiateur_sdb_consigne` : consigne de base (existant)
    
    - `radiateur_sdb_consigne_calculee` : consigne corrigée par Tempo (nouveau)
    
    - `radiateur_sdb_reduction_tempo_blanc` : réduction en HP des jours blancs (0 à 3°C)
    
    - `radiateur_sdb_reduction_tempo_rouge` : réduction en HP des jours rouges (0 à 15°C)
    
    
    **input_boolean** :
    
    - `tempo_global_actif` : activation/désactivation globale (commun à toutes les pièces)
    
    - `radiateur_sdb_tempo_actif` : activation/désactivation pour cette pièce (nouveau)
    
    - `radiateur_sdb_show_tempo_config` : afficher/masquer la config Tempo dans la carte
    
    - `boost_sdb` : état du boost (existant si vous utilisez le blueprint Boost)
    
    
    Voir `config_examples/` pour les définitions complètes.
    
    
    ___
    
    ## Utilisation dans les autres blueprints
    
    **Dans le blueprint Thermostat TPI** :
    
    - Utiliser `input_number.radiateur_sdb_consigne_calculee` au lieu de `radiateur_sdb_consigne`
    
    
    **Dans le blueprint Pilotage** :
    
    - Utiliser `input_number.radiateur_sdb_consigne_calculee` au lieu de `radiateur_sdb_consigne`
    
    
    **Dans le blueprint Boost** :
    
    - Continuer à utiliser `radiateur_sdb_boost_consigne` (pas de changement)
    
    
    Si vous n'utilisez **pas** ce blueprint Tempo :
    
    - Continuez à utiliser `radiateur_sdb_consigne` partout (fonctionnement classique)
    
    
    ___
    
    ## Paramétrage du Blueprint
    "
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/main/blueprint/Chauffage_by_C._-_Tempo.yaml
  domain: automation

  input:
    piece_name:
      name: 🏠 Nom de la pièce
      description: "Nom affiché dans les logs (ex: SdB, Salon, Chambre)"
      selector:
        text:

    # === SENSORS TEMPO ===
    sensor_couleur:
      name: 🎨 Sensor Couleur Tempo
      description: "Sensor indiquant la couleur du jour actuel (Bleu / Blanc / Rouge)"
      selector:
        entity:
          domain: sensor

    sensor_periode:
      name: ⚡ Sensor Période tarifaire
      description: "Sensor indiquant la période actuelle (Heures Creuses / Heures Pleines)"
      selector:
        entity:
          domain: sensor

    # === CONSIGNES ===
    consigne_base:
      name: 🌡️ Consigne de base
      description: "Consigne définie par l'utilisateur (modifiée via UI/modes/schedules)"
      selector:
        entity:
          domain: input_number

    consigne_calculee:
      name: 🎯 Consigne calculée (sortie)
      description: "Consigne corrigée selon Tempo (à utiliser dans Thermostat TPI et Pilotage)"
      selector:
        entity:
          domain: input_number

    # === RÉDUCTIONS ===
    reduction_blanc:
      name: ⚪ Réduction jours Blanc (HP)
      description: "Nombre de degrés à retirer en HP des jours blancs"
      selector:
        entity:
          domain: input_number

    reduction_rouge:
      name: 🔴 Réduction jours Rouge (HP)
      description: "Nombre de degrés à retirer en HP des jours rouges"
      selector:
        entity:
          domain: input_number

    # === ACTIVATION ===
    switch_global:
      name: 🌐 Switch global Tempo
      description: "Désactive toutes les corrections Tempo (toutes pièces) si OFF"
      selector:
        entity:
          domain: input_boolean

    switch_local:
      name: 🏠 Switch local Tempo
      description: "Désactive les corrections Tempo pour cette pièce si OFF"
      selector:
        entity:
          domain: input_boolean

    boost_actif:
      name: ⚡ Boost actif (optionnel)
      description: "Si le boost est ON, ignore les corrections Tempo pour cette pièce"
      default: ""
      selector:
        entity:
          domain: input_boolean

# ========= VARIABLES =========
variables:
  piece_name: !input piece_name
  consigne_base: !input consigne_base
  consigne_calculee: !input consigne_calculee
  sensor_couleur: !input sensor_couleur
  sensor_periode: !input sensor_periode
  reduction_blanc: !input reduction_blanc
  reduction_rouge: !input reduction_rouge
  switch_global: !input switch_global
  switch_local: !input switch_local
  boost_actif_input: !input boost_actif

  # Valeurs actuelles
  consigne_valeur: "{{ states(consigne_base) | float(19) }}"
  couleur: "{{ states(sensor_couleur) }}"
  periode: "{{ states(sensor_periode) }}"
  tempo_global_on: "{{ is_state(switch_global, 'on') }}"
  tempo_local_on: "{{ is_state(switch_local, 'on') }}"
  boost_on: >-
    {{ boost_actif_input != '' and is_state(boost_actif_input, 'on') }}

  # Calcul de la réduction
  reduction: >-
    {% if not tempo_global_on %}
      {{ 0. 0 }}
    {% elif not tempo_local_on %}
      {{ 0.0 }}
    {% elif boost_on %}
      {{ 0.0 }}
    {% elif 'Creuse' in periode %}
      {{ 0.0 }}
    {% elif couleur == 'Bleu' %}
      {{ 0.0 }}
    {% elif couleur == 'Blanc' %}
      {{ states(reduction_blanc) | float(0. 0) }}
    {% elif couleur == 'Rouge' %}
      {{ states(reduction_rouge) | float(0.0) }}
    {% else %}
      {{ 0.0 }}
    {% endif %}
  
  consigne_finale: "{{ [ consigne_valeur - reduction, 5 ] | max }}"


# ========= DÉCLENCHEURS =========
trigger:
  # Recalcul quand la consigne de base change
  - platform: state
    entity_id: !input consigne_base

  # Recalcul quand la couleur Tempo change
  - platform: state
    entity_id: !input sensor_couleur

  # Recalcul quand on passe HP/HC
  - platform: state
    entity_id: !input sensor_periode

  # Recalcul quand les réductions sont modifiées
  - platform: state
    entity_id:
      - !input reduction_blanc
      - !input reduction_rouge

  # Recalcul quand on active/désactive Tempo global
  - platform: state
    entity_id: !input switch_global

  # Recalcul quand on active/désactive Tempo local
  - platform: state
    entity_id: !input switch_local

  # Recalcul quand le boost change (si fourni)
  - platform: state
    entity_id: !input boost_actif

  # Au démarrage de HA
  - platform: homeassistant
    event: start

  # Au rechargement des automations
  - platform: event
    event_type: automation_reloaded

condition: []

# ========= ACTIONS =========
action:
  # Mise à jour de la consigne calculée
  - service: input_number.set_value
    target:
      entity_id: !input consigne_calculee
    data:
      value: "{{ consigne_finale }}"

  # Log pour débogage
  - service: logbook.log
    data:
      name: "Tempo {{ piece_name }}"
      message: >-
        Consigne: {{ consigne_valeur }}°C → {{ consigne_finale }}°C
        ({{ couleur }} {{ periode }}, réduction: -{{ reduction }}°C
        {% if not tempo_global_on %}[Global OFF]{% endif %}
        {% if not tempo_local_on %}[Local OFF]{% endif %}
        {% if boost_on %}[Boost actif]{% endif %})
      entity_id: !input consigne_calculee

mode: queued
max: 5
