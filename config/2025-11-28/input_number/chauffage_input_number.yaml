
### Définition des Helpers INPUT_NUMBER pour le Blueprint Chauffage by C. : Consigne, Puissance, Index


## Définition des ancres pour les paramètres communs
base_consigne: &base_consigne
  min: 0
  max: 24
  step: 0.5
  unit_of_measurement: °C
  icon: mdi:target
base_puissance: &base_puissance
  min: 0
  max: 100
  step: 1
  mode: box
  unit_of_measurement: '%'
  icon: mdi:power-plug

  
## pour Etage SS-Sol

# pour Chambre SS-Sol
radiateur_chambre_sssol_consigne:
  <<: *base_consigne
  name: Radiateur Chambre Sous-sol Consigne
radiateur_chambre_sssol_puissance:
  <<: *base_puissance
  name: Radiateur Chambre Sous-sol Puissance


