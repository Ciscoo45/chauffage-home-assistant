
### Création template pour le Blueprint Chauffage Boost by C. - pour l'affichage Boost On/Off dans la carte Lovelace : Boost Status, Puissance Display, Durée Display, Heure fin Display

chauffage_boost_package:

  template:


## pour Chambre Ss-Sol
    - sensor:
        - name: "Boost Chambre Ss-Sol Status"
          unique_id: boost_chambre_sssol_status
          state: >
            {% if is_state('input_boolean.boost_chambre_sssol', 'on') %}
              Boost On
            {% else %}
              Boost Off
            {% endif %}
          icon: >
            {% if is_state('input_boolean.boost_chambre_sssol', 'on') %}
              mdi:lightning-bolt
            {% else %}
              mdi:lightning-bolt-outline
            {% endif %}
          attributes:
            boost_active: "{{ is_state('input_boolean.boost_chambre_sssol', 'on') }}"
            rgb_color: >
              {% if is_state('input_boolean.boost_chambre_sssol', 'on') %}
                [255, 165, 0]
              {% else %}
                [68, 115, 158]
              {% endif %}
        
        # Sensor pour afficher la puissance avec couleur
        - name: "Puissance Chambre Ss-Sol Display"
          unique_id: puissance_chambre_sssol_display
          state: "{{ states('input_number.radiateur_chambre_sssol_puissance') | int(0) }}"
          unit_of_measurement: "%"
          icon: mdi:flash
          attributes:
            rgb_color: >
              {% set puissance = states('input_number.radiateur_chambre_sssol_puissance') | int(0) %}
              {% if puissance > 0 %}
                [255, 165, 0]
              {% else %}
                [68, 115, 158]
              {% endif %}
        
        # Sensor pour afficher la durée de boost formatée
        - name: "Durée Boost Chambre Ss-Sol Display"
          unique_id: duree_boost_chambre_sssol_display
          state: >
            {% set minutes = states('input_number.radiateur_chambre_sssol_boost_duree') | int(0) %}
            {% if minutes >= 60 %}
              {% set heures = (minutes / 60) | int %}
              {% set reste_min = minutes % 60 %}
              {% if reste_min > 0 %}
                {{ heures }}h{{ reste_min }}
              {% else %}
                {{ heures }}h
              {% endif %}
            {% else %}
              {{ minutes }} min
            {% endif %}
          icon: mdi:timer-outline
          attributes:
            minutes_brut: "{{ states('input_number.radiateur_chambre_sssol_boost_duree') | int(0) }}"
        
        # Sensor pour afficher l'heure de fin de boost formatée en français
        - name: "Fin Boost Chambre Ss-Sol Display"
          unique_id: fin_boost_chambre_sssol_display
          state: >
            {% set dt = states('input_datetime.boost_end_chambre_sssol') %}
            {% if dt not in ['unknown', 'unavailable', 'none', ''] %}
              {% set mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 
                            'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'] %}
              {% set timestamp = as_timestamp(dt) %}
              {% set jour = timestamp | timestamp_custom('%d', true) | int %}
              {% set mois_num = timestamp | timestamp_custom('%m', true) | int %}
              {% set annee = timestamp | timestamp_custom('%Y', true) %}
              {% set heure = timestamp | timestamp_custom('%H:%M', true) %}
              {{ jour }} {{ mois[mois_num - 1] }} {{ annee }} à {{ heure }}
            {% else %}
              -
            {% endif %}
          icon: mdi:clock-end
          attributes:
            heure_complete: "{{ states('input_datetime.boost_end_chambre_sssol') }}"


