- id: '1760872783326'
  alias: Light LEDstrip via tél. Tradfri - 05 cycle couleur- - Telmo
  description: ZHA - Light - LED strip depuis Tradfri - 05 Hold pour cycle couleur-
    - Telmo
  triggers:
  - event_type: zha_event
    event_data:
      device_ieee: bc:8d:7e:ff:fe:7f:33:77
      cluster_id: 5
      command: press
    trigger: event
  conditions:
  - condition: template
    value_template: '{{ (trigger.event.data.args | length > 0) and (trigger.event.data.args[0]
      == 257) }}

      '
  actions:
  - if:
    - condition: state
      entity_id: light.led_strip_ikea_ormanas_telmo
      state: 'off'
    then:
    - target:
        entity_id: light.led_strip_ikea_ormanas_telmo
      action: light.turn_on
  - repeat:
      until:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
      sequence:
      - wait_for_trigger:
        - event_type: zha_event
          event_data:
            device_ieee: bc:8d:7e:ff:fe:7f:33:77
            cluster_id: 5
            command: release
          trigger: event
        timeout: '00:00:00.15'
        continue_on_timeout: true
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          sequence: []
        default:
        - choose:
          - conditions: "{{ 'hs' in (state_attr('light.led_strip_ikea_ormanas_telmo','supported_color_modes')
              or [])\n   or 'xy' in (state_attr('light.led_strip_ikea_ormanas_telmo','supported_color_modes')
              or []) }}\n"
            sequence:
            - target:
                entity_id: light.led_strip_ikea_ormanas_telmo
              data:
                hs_color:
                - '{{ ((state_attr(''light.led_strip_ikea_ormanas_telmo'',''hs_color'')[0]
                  | default(0)) - 5) % 360 }}'
                - '{{ state_attr(''light.led_strip_ikea_ormanas_telmo'',''hs_color'')[1]
                  | default(100) }}'
              action: light.turn_on
          - conditions:
            - condition: template
              value_template: '{{ ''color_temp'' in (state_attr(''light.led_strip_ikea_ormanas_telmo'',''supported_color_modes'')
                or []) }}'
            sequence:
            - variables:
                cur: '{{ state_attr(''light.led_strip_ikea_ormanas_telmo'',''color_temp'')
                  | default(370) }}'
                min_m: '{{ state_attr(''light.led_strip_ikea_ormanas_telmo'',''min_mireds'')
                  | default(153) }}'
                max_m: '{{ state_attr(''light.led_strip_ikea_ormanas_telmo'',''max_mireds'')
                  | default(500) }}'
                step: 5
                next: '{% set n = cur + step %} {% if n > max_m %}{{ max_m }}{% else
                  %}{{ n }}{% endif %}'
            - target:
                entity_id: light.led_strip_ikea_ormanas_telmo
              data:
                color_temp: '{{ next }}'
              action: light.turn_on
  mode: restart
