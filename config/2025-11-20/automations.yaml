- id: '1760869565144'
  alias: Light LEDstrip via tél. Tradfri - 01 ON - Telmo
  description: ZHA - Light - LED strip depuis Tradfri - 01 - ON via Grand soleil
  triggers:
  - event_type: zha_event
    event_data:
      device_ieee: bc:8d:7e:ff:fe:7f:33:77
      command: 'on'
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: time
          after: '20:00:00'
        - condition: time
          before: 08:00:00
      sequence:
      - target:
          entity_id: light.led_strip_ikea_ormanas_telmo
        data:
          brightness_pct: 1
        action: light.turn_on
    default:
    - target:
        entity_id: light.led_strip_ikea_ormanas_telmo
      data:
        brightness_pct: 100
      action: light.turn_on
  mode: single
- id: '1760869629862'
