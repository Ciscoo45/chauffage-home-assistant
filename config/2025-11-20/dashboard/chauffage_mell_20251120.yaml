              - entity: sensor.temperature_sonoff_chambre_sssol
                name: Chambre Ss-sol
                icon: mdi:thermometer
                unit: °C
                card_mod:
                  style:
                    hui-generic-entity-row:
                      $: |
                        .text-content:not(.info) {
                          color: {% set temp = states("sensor.temperature_sonoff_chambre_sssol") | float %}
                          {% if temp <= 8 %}
                            #44739e
                          {% elif temp >= 20 %}
                            #f04141
                          {% elif temp <= 12 %}
                            {# Interpolation entre bleu (#44739e) et blanc (#ffffff) de 8°C à 12°C #}
                            {% set ratio = (temp - 8) / 4 %}
                            {% set r = ((1 - ratio) * 68 + ratio * 255) | round %}
                            {% set g = ((1 - ratio) * 115 + ratio * 255) | round %}
                            {% set b = ((1 - ratio) * 158 + ratio * 255) | round %}
                            rgb({{ r }}, {{ g }}, {{ b }})
                          {% elif temp <= 18 %}
                            {# Interpolation entre blanc (#ffffff) et jaune (#fdd835) de 12°C à 18°C #}
                            {% set ratio = (temp - 12) / 6 %}
                            {% set r = ((1 - ratio) * 255 + ratio * 253) | round %}
                            {% set g = ((1 - ratio) * 255 + ratio * 216) | round %}
                            {% set b = ((1 - ratio) * 255 + ratio * 53) | round %}
                            rgb({{ r }}, {{ g }}, {{ b }})
                          {% else %}
                            {# Interpolation entre jaune (#fdd835) et rouge (#f04141) de 18°C à 20°C #}
                            {% set ratio = (temp - 18) / 2 %}
                            {% set r = ((1 - ratio) * 253 + ratio * 240) | round %}
                            {% set g = ((1 - ratio) * 216 + ratio * 65) | round %}
                            {% set b = ((1 - ratio) * 53 + ratio * 65) | round %}
                            rgb({{ r }}, {{ g }}, {{ b }})
                          {% endif %};
                        }
