      - type: grid
        cards:
          - type: heading
            heading: Section Boost
            heading_style: title
          - type: entities
            entities:
              - type: custom:button-card
                color: '#2b5580'
                name: Atelier
                styles:
                  card:
                    - background-color: '#2b5580'
                    - height: 25px
                  name:
                    - font-size: 18px
              - entity: input_select.radiateur_atelier_mode
                name: Mode
              - type: conditional
                conditions:
                  - entity: input_select.radiateur_atelier_mode
                    state: Manuel
                row:
                  entity: input_number.radiateur_atelier_consigne
                  type: custom:numberbox-card
                  name: Réglage consigne
              - type: custom:hui-element
                card_type: glance
                show_name: false
                entities:
                  - entity: sensor.temperature_sonoff_atelier
                  - entity: input_number.radiateur_atelier_consigne
                  - entity: sensor.puissance_atelier_display
                  - entity: binary_sensor.fenetre_virtuelle_onoff
                    icon: mdi:window-closed-variant
                  - entity: sensor.boost_atelier_status
                    tap_action:
                      action: call-service
                      service: input_boolean.toggle
                      service_data:
                        entity_id: input_boolean.radiateur_atelier_show_boost_config
                card_mod:
                  style:
                    .: >
                      {% set boost = is_state('input_boolean.boost_atelier',
                      'on') %}

                      {% set puissance =
                      states('input_number.radiateur_atelier_puissance') |
                      int(0) %}

                      {% set heating = puissance > 0 %}


                      /* Icône PUISSANCE (3ème position) */

                      div.entity:nth-child(3) {
                        {% if heating %}
                        --state-icon-color: #FFA500 !important;
                        --paper-item-icon-color: #FFA500 !important;
                        {% else %}
                        --state-icon-color: rgb(68, 115, 158) !important;
                        --paper-item-icon-color: rgb(68, 115, 158) !important;
                        {% endif %}
                      }

                      div.entity:nth-child(3) .state {
                        color: {{ '#FFA500' if heating else 'var(--secondary-text-color)' }} !important;
                        font-weight: {{ '500' if heating else 'normal' }} !important;
                      }


                      /* Icône BOOST (5ème position) */

                      div.entity:nth-child(5) {
                        {% if boost %}
                        --state-icon-color: #FFA500 !important;
                        --paper-item-icon-color: #FFA500 !important;
                        {% else %}
                        --state-icon-color: rgb(68, 115, 158) !important;
                        --paper-item-icon-color: rgb(68, 115, 158) !important;
                        {% endif %}
                      }

                      div.entity:nth-child(5) .state {
                        color: {{ '#FFA500' if boost else 'var(--secondary-text-color)' }} !important;
