
#################################################################
### Chauffage kWh - Sensors utility_meter (compteur de service, élec, gaz, etc.) pour le CHAUFFAGE TOTAL
#################################################################


# =============== GLOBAL ==================


chauffage_total_kwh_jour:        # sensor.chauffage_total_kwh_jour
  unique_id: chauffage_total_kwh_jour
  source: sensor.chauffage_total_kwh
  cycle: daily

chauffage_total_kwh_semaine:     # sensor.chauffage_total_kwh_semaine
  unique_id: chauffage_total_kwh_semaine
  source: sensor.chauffage_total_kwh
  cycle: weekly

chauffage_total_kwh_mois:        # sensor.chauffage_total_kwh_mois
  unique_id: chauffage_total_kwh_mois
  source: sensor.chauffage_total_kwh
  cycle: monthly





