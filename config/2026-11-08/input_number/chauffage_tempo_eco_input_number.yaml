
################################################################################
### GESTION TEMPO - CONSIGNES ET RÉDUCTIONS
################################################################################


## ========== ANCRES ==========

tempo_consigne_calculee_defaults: &tempo_consigne_calculee_defaults
  min: 0
  max: 30
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:target

tempo_reduction_blanc_defaults: &tempo_reduction_blanc_defaults
  min: 0
  max: 3
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermometer-minus
  # initial: 0.5

tempo_reduction_rouge_defaults: &tempo_reduction_rouge_defaults
  min: 0
  max: 15
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermometer-alert
  # initial: 2.0



