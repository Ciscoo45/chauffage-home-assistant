
################################################################################
### GESTION ABSENCE AUTO - CONSIGNES ET RÉDUCTIONS
################################################################################


## =============================== 
## ========== au GLOBAL ==========

chauffage_absence_auto_reduction_degrees:
  name: "Réduction de température en absence"
  min: 0
  max: 5
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermometer-minus
  initial: 2.0



## ===============================
## ========== PAR PIÈCE ==========


## ========== ANCRES ==========

consigne_defaults: &consigne_defaults
  min: 0
  max: 30
  step: 0.5
  unit_of_measurement: "°C"

consigne_absence_defaults: &consigne_absence_defaults
  <<: *consigne_defaults
  icon: mdi:thermometer-chevron-down

consigne_finale_defaults: &consigne_finale_defaults
  <<: *consigne_defaults
  icon: mdi:thermometer-check

consigne_avant_absence_defaults: &consigne_avant_absence_defaults
  <<: *consigne_defaults
  icon: mdi:restore


## ========== par PIÈCE ==========


