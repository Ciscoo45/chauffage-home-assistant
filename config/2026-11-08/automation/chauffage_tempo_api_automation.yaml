

#################################################################
### Templates RTE Tempo via API gratuite api-couleur-tempo.fr sans compte
#################################################################

### Mise à jour en mode rafale toutes les minutes autour des horaires charnières 6h et 22h 

# homeassistant:
#  time_zone: Europe/Paris


- id: tempo_api_refresh_autour_bascule_hphc
  alias: "Tempo API - Refresh renforcé autour des bascules HP/HC"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: or
      conditions:
        - condition: time
          after: "05:55:00"
          before: "06:05:01"
        - condition: time
          after: "21:55:00"
          before: "22:05:01"
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.tempo_temps_reel
