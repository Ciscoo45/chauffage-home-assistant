###########################################################################################################
# Loads default set of integrations. Do not remove.
default_config:



###########################################################################################################
# Load frontend themes from the themes folder
frontend:

  # Performance improvements
  # card-mod doc: while card-mod can be installed as a lovelace resource, some functionality1 will benefit greatly from it being installed as a frontend module instead.
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524420
  
  
  themes: !include_dir_merge_named theme/
# couleurs pour statuts particuliers
#  my_theme:
#    state-switch-radiateur_salon-active-color: "#ef0024"
#    state-cover-garage_door-open-color: "#ff0000"
#    state-media_player-inactive-color: "#795548"



############################################################################################################
#### Intégration http
## commun
#http:
## spécifique IP Ban
