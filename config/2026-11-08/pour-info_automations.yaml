- id: '1760869715402'
  alias: Light LEDstrip via tél. Tradfri - 03 -10% - Telmo
  description: ZHA - Light - LED strip depuis Tradfri - 03 - -10% via flèche drt
  triggers:
  - event_type: zha_event
    event_data:
      device_ieee: bc:8d:7e:ff:fe:7f:33:77
      cluster_id: 5
      command: press
    trigger: event
  conditions:
  - condition: template
    value_template: "{{ (trigger.event.data.args | length > 0)\n   and (trigger.event.data.args[0]
      == 257) }}\n"
  actions:
