blueprint:
  name: Chauffage by C. - Boost
  description: "\n\nversion Boost : v1.15 - 2026-10-18\nauteur : Ciscoo45\n\nBlueprint
    de boost temporaire dérogatif pour le chauffage avec restauration intelligente
    de mode en fin de boost.\n\n       \nFonctionnalités :\n- Boost manuel via UI
    ou télécommande Ikea\n- Durée et consigne personnalisables\n- Extension de durée
    via notification\n- Restauration intelligente : ne restaure la consigne que si
    le mode précédent était Manuel\n- Compatible avec tous les modes (y compris Arrêt)\n-
    Notifications persistantes avec actions\n- Affichage de l'heure de fin\n\nCorrections
    v1.15 :\n- Un seul démarrage effectif via le passage du switch Boost à ON. - Le
    mode et la consigne précédents sont mémorisés UNE FOIS par session. - Un nouvel
    appui physique ON pendant un Boost actif ajoute 5 minutes\n  par défaut (le pas
    d'ajout est configurable, commun avec le bouton +X dans les notifications mobiles).\n-
    Les commandes sont traitées dans l'ordre ; l'arrêt n'est plus interrompu\n  par
    la notification de changement du switch.\n- L'arrêt physique, UI, mobile ou par
    expiration emprunte une seule voie. - La notification persistante est réellement
    effacée à l'arrêt. - Rattrapage d'une expiration manquée après redémarrage Home
    Assistant.\n\nIMPORTANT : vérifier dans le module Pilotage que entity_thermostat_tpi
    désigne bien le Thermostat TPI de la pièce et non le module Boost.\n"
  source_url: https://github.com/Ciscoo45/chauffage-home-assistant/blob/Week-Vs-WE/blueprint/Chauffage_by_C._-_Boost.yaml
  domain: automation
  input:
    piece:
      name: "\U0001F3E0 Pièce"
      selector:
        area:
          multiple: false
          reorder: false
    users_group:
      name: "\U0001F465 Groupe des utilisateurs éligibles aux notifications"
      selector:
        entity:
          domain:
          - group
          multiple: false
          reorder: false
    remote_button:
      name: "[Optionnel] \U0001F3AE Télécommande IKEA Styrbar / Rodret"
      default: ''
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          multiple: false
    boost_switch:
      name: "\U0001F39A️ Boost (pièce)"
      description: input_boolean de la pièce (chauffage_boost_input_boolean.yaml)
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
    boost_timer:
      name: ⌛ Timer boost (pièce)
      description: Timer de la pièce (chauffage_boost_timer.yaml)
      selector:
        entity:
          domain:
          - timer
          multiple: false
          reorder: false
    timer_entity:
      name: ⏰ Heure de fin de Boost (pièce)
      description: input_datetime pour l'affichage dans le dashboard
      selector:
        entity:
          domain:
          - input_datetime
          multiple: false
          reorder: false
    mode_entity:
      name: "\U0001F4CB Radiateur (pièce) Mode"
      selector:
        entity:
          domain:
          - input_select
          multiple: false
          reorder: false
    consigne_entity:
      name: "\U0001F321️ Radiateur (pièce) Consigne"
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    boost_temp_helper:
      name: "\U0001F3AF Radiateur (pièce) Consigne de Boost (°C)"
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    consigne_boost_valeur_de_depart:
      name: Consigne Boost par défaut (°C)
      default: 21
      selector:
        number:
          min: 0.0
          max: 24.0
          step: 0.5
          mode: slider
    boost_duration_helper:
      name: Radiateur (pièce) Durée de Boost
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    duree_boost_valeur_de_depart:
      name: Durée par défaut (minutes)
      default: 40
      selector:
        number:
          min: 1.0
          max: 1200.0
          step: 5.0
          mode: slider
    boost_extend_step_minutes:
      name: ➕ Prolongation par nouvel appui ON / notification (minutes)
      description: 'Nombre de minutes ajoutées à chaque nouvel appui physique ON lorsque
        le Boost est en cours, ou via le bouton +X des notifications. Valeur par défaut
        : 5 minutes. Ne réinitialise jamais le mode mémorisé.'
      default: 5
      selector:
        number:
          min: 1.0
          max: 60.0
          step: 1.0
          mode: slider
    restore_behavior:
      name: "\U0001F607 (pièce) Comportement en fin de Boost"
      description: Restaurer l'état précédent ou choisir un mode personnalisé
      selector:
        entity:
          domain:
          - input_select
          multiple: false
          reorder: false
    restore_mode_custom:
      name: (pièce) Mode à restaurer en fin de Boost
      selector:
        entity:
          domain:
          - input_select
          multiple: false
          reorder: false
    restore_override_consigne:
      name: (pièce) Forcer une consigne en fin de Boost
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
    restore_consigne_custom:
      name: (pièce) Consigne personnalisée de fin de Boost (°C)
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    previous_mode_storage:
      name: "\U0001F4BE (pièce) Mode précédent mémorisé"
      selector:
        entity:
          domain:
          - input_text
          multiple: false
          reorder: false
    previous_consigne_storage:
      name: "\U0001F4BE (pièce) Consigne précédente mémorisée"
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    sync_helpers_on_reload:
      name: Initialiser durée/consigne à chaque redémarrage/rechargement
      default: false
      selector:
        boolean: {}
trigger:
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input remote_button
    command: 'on'
    cluster_id: 6
  id: boost_start_remote
- platform: event
  event_type: zha_event
  event_data:
    device_id: !input remote_button
    command: 'off'
    cluster_id: 6
  id: boost_stop_remote
- platform: state
  entity_id: !input boost_switch
  from: 'off'
  to: 'on'
  id: boost_start_ui
- platform: state
  entity_id: !input boost_switch
  from: 'on'
  to: 'off'
  id: boost_stop_ui
- platform: event
  event_type: mobile_app_notification_action
  id: boost_notif_action
- platform: event
  event_type: timer.finished
  event_data:
    entity_id: !input boost_timer
  id: boost_expired_timer
- platform: homeassistant
  event: start
  id: init_on_start
- platform: event
  event_type: automation_reloaded
  id: init_on_reload
- platform: time_pattern
  minutes: /1
  id: boost_watchdog
condition: []
action:
- variables:
    area_id: !input piece
    users_group_entity: !input users_group
    boost_switch_id: !input boost_switch
    mode_id: !input mode_entity
    consigne_id: !input consigne_entity
    duration_helper: !input boost_duration_helper
    temp_helper: !input boost_temp_helper
    boost_timer_id: !input boost_timer
    timer_id: !input timer_entity
    sync_reload: !input sync_helpers_on_reload
    default_minutes: !input duree_boost_valeur_de_depart
    default_temp: !input consigne_boost_valeur_de_depart
    extend_step: !input boost_extend_step_minutes
    restore_choice: !input restore_behavior
    custom_mode_entity: !input restore_mode_custom
    override_consigne_switch: !input restore_override_consigne
    custom_consigne_entity: !input restore_consigne_custom
    prev_mode_storage: !input previous_mode_storage
    prev_consigne_storage: !input previous_consigne_storage
    area_label: '{{ area_name(area_id) if area_name(area_id) is not none else area_id
      }}'
    notif_tag: '{{ ''boost_'' ~ area_id }}'
    stop_action_id: '{{ (''boost_stop_'' ~ area_id) | lower }}'
    extend_action_id: '{{ (''boost_extend_'' ~ area_id) | lower }}'
    boost_minutes: '{{ [[states(duration_helper) | int(default_minutes), 1] | max,
      600] | min }}'
    boost_target_temp: '{{ [[states(temp_helper) | float(default_temp), 15] | max,
      30] | min }}'
    present_notify_entities: "{{\n  expand(state_attr(users_group_entity, 'entity_id')
      | default([], true))\n  | selectattr('entity_id', 'match', '^person\\\\.')\n
      \ | selectattr('state', 'equalto', 'home')\n  | map(attribute='entity_id')\n
      \ | map('regex_replace', '^person\\\\.', 'notify.user_')\n  | list\n}}"
    all_notify_entities: "{{\n  expand(state_attr(users_group_entity, 'entity_id')
      | default([], true))\n  | selectattr('entity_id', 'match', '^person\\\\.')\n
      \ | map(attribute='entity_id')\n  | map('regex_replace', '^person\\\\.', 'notify.user_')\n
      \ | list\n}}"
    notification_action: "{% if trigger.id == 'boost_notif_action' %}\n  {{ trigger.event.data.get('action',
      '') }}\n{% else %}\n  {{ '' }}\n{% endif %}"
- choose:
  - conditions: '{{ trigger.id in [''init_on_start'', ''init_on_reload''] }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ sync_reload }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: !input boost_duration_helper
        data:
          value: '{{ default_minutes | int }}'
      - service: input_number.set_value
        target:
          entity_id: !input boost_temp_helper
        data:
          value: '{{ default_temp | float }}'
    - if:
      - condition: template
        value_template: "{{ is_state(boost_switch_id, 'on')\n   and is_state(boost_timer_id,
          'idle')\n   and as_timestamp(states(timer_id), 0) > 0\n   and as_timestamp(states(timer_id),
          0) <= now().timestamp() }}"
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input boost_switch
  - conditions: "{{ trigger.id == 'boost_start_remote'\n   and is_state(boost_switch_id,
      'off') }}"
    sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: !input boost_switch
  - conditions: "{{ is_state(boost_switch_id, 'on')\n   and is_state(boost_timer_id,
      'active')\n   and (trigger.id == 'boost_start_remote'\n        or (trigger.id
      == 'boost_notif_action'\n            and notification_action == extend_action_id))
      }}"
    sequence:
    - variables:
        current_end_ts: '{{ as_timestamp(state_attr(boost_timer_id, ''finishes_at''),
          0) | int(0) }}'
        new_end_ts: "{{ ([current_end_ts | int(0), now().timestamp() | int] | max)\n
          \  + (extend_step | int(5)) * 60 }}"
        remaining_seconds: '{{ [(new_end_ts | int(0)) - (now().timestamp() | int),
          1] | max }}'
    - service: timer.start
      target:
        entity_id: !input boost_timer
      data:
        duration: '{{ remaining_seconds | int }}'
    - service: input_datetime.set_datetime
      target:
        entity_id: !input timer_entity
      data:
        timestamp: '{{ new_end_ts | int }}'
    - if:
      - condition: template
        value_template: '{{ present_notify_entities | count > 0 }}'
      then:
      - repeat:
          for_each: '{{ present_notify_entities }}'
          sequence:
          - service: '{{ repeat.item }}'
            continue_on_error: true
            data:
              title: "\U0001F506 Boost chauffage {{ area_label }} prolongé"
              message: Consigne {{ states(consigne_id) | float(boost_target_temp)
                | round(1) }}° • Fin {{ (new_end_ts | int) | timestamp_custom('%H:%M',
                true) }}
              data:
                tag: '{{ notif_tag }}'
                persistent: true
                sticky: true
                actions:
                - action: '{{ stop_action_id }}'
                  title: Arrêter
                - action: '{{ extend_action_id }}'
                  title: +{{ extend_step }} min
  - conditions: '{{ trigger.id == ''boost_start_ui'' }}'
    sequence:
    - if:
      - condition: template
        value_template: "{{ not is_state(boost_switch_id, 'on')\n   or is_state(boost_timer_id,
          'active') }}"
      then:
      - stop: Démarrage redondant ignoré.
    - if:
      - condition: template
        value_template: '{{ states(mode_id) in [''unknown'', ''unavailable'', ''none'',
          ''''] }}'
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input boost_switch
      - stop: 'Mode initial indisponible : démarrage refusé.'
    - service: input_text.set_value
      target:
        entity_id: !input previous_mode_storage
      data:
        value: '{{ states(mode_id) }}'
    - service: input_number.set_value
      target:
        entity_id: !input previous_consigne_storage
      data:
        value: '{{ states(consigne_id) | float(14) }}'
    - variables:
        start_end_ts: '{{ (now() + timedelta(minutes=boost_minutes | int)).timestamp()
          | int }}'
    - service: timer.start
      target:
        entity_id: !input boost_timer
      data:
        duration: '{{ (boost_minutes | int) * 60 }}'
    - service: input_datetime.set_datetime
      target:
        entity_id: !input timer_entity
      data:
        timestamp: '{{ start_end_ts | int }}'
    - service: input_select.select_option
      target:
        entity_id: !input mode_entity
      data:
        option: Manuel
    - delay:
        milliseconds: 500
    - service: input_number.set_value
      target:
        entity_id: !input consigne_entity
      data:
        value: '{{ boost_target_temp | float }}'
    - delay:
        seconds: 2
    - if:
      - condition: template
        value_template: '{{ present_notify_entities | count > 0 }}'
      then:
      - repeat:
          for_each: '{{ present_notify_entities }}'
          sequence:
          - service: '{{ repeat.item }}'
            continue_on_error: true
            data:
              title: "\U0001F506 Boost chauffage {{ area_label }} activé"
              message: Consigne {{ boost_target_temp | float | round(1) }}° • Fin
                {{ (start_end_ts | int) | timestamp_custom('%H:%M', true) }} ({{ boost_minutes
                }} min)
              data:
                tag: '{{ notif_tag }}'
                persistent: true
                sticky: true
                actions:
                - action: '{{ stop_action_id }}'
                  title: Arrêter
                - action: '{{ extend_action_id }}'
                  title: +{{ extend_step }} min
  - conditions: "{{ trigger.id == 'boost_stop_remote'\n   or (trigger.id == 'boost_notif_action'\n
      \      and notification_action == stop_action_id) }}"
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(boost_switch_id, ''on'') }}'
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input boost_switch
  - conditions: '{{ trigger.id == ''boost_expired_timer'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(boost_switch_id, ''on'') }}'
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input boost_switch
  - conditions: '{{ trigger.id == ''boost_watchdog'' }}'
    sequence:
    - if:
      - condition: template
        value_template: "{{ is_state(boost_switch_id, 'on')\n   and is_state(boost_timer_id,
          'idle')\n   and as_timestamp(states(timer_id), 0) > 0\n   and as_timestamp(states(timer_id),
          0) <= now().timestamp() }}"
      then:
      - service: input_boolean.turn_off
        target:
          entity_id: !input boost_switch
  - conditions: '{{ trigger.id == ''boost_stop_ui'' }}'
    sequence:
    - service: timer.cancel
      target:
        entity_id: !input boost_timer
    - choose:
      - conditions: "{{ 'état précédent' in states(restore_choice) | lower\n   or
          'etat precedent' in states(restore_choice) | lower }}"
        sequence:
        - variables:
            previous_mode: '{{ states(prev_mode_storage) }}'
            previous_consigne: '{{ states(prev_consigne_storage) | float(14) }}'
        - if:
          - condition: template
            value_template: '{{ previous_mode in state_attr(mode_id, ''options'')
              | default([], true) }}'
          then:
          - service: input_select.select_option
            target:
              entity_id: !input mode_entity
            data:
              option: '{{ previous_mode }}'
          else:
          - service: input_select.select_option
            target:
              entity_id: !input mode_entity
            data:
              option: Arret
        - delay:
            milliseconds: 200
        - if:
          - condition: template
            value_template: '{{ previous_mode == ''Manuel'' }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_entity
            data:
              value: '{{ previous_consigne }}'
      - conditions: '{{ ''personnalis'' in states(restore_choice) | lower }}'
        sequence:
        - variables:
            target_mode: '{{ states(custom_mode_entity) }}'
            override_active: '{{ is_state(override_consigne_switch, ''on'') }}'
            target_consigne: '{{ states(custom_consigne_entity) | float(14) }}'
        - service: input_select.select_option
          target:
            entity_id: !input mode_entity
          data:
            option: '{{ target_mode }}'
        - delay:
            milliseconds: 200
        - if:
          - condition: template
            value_template: '{{ override_active }}'
          then:
          - service: input_number.set_value
            target:
              entity_id: !input consigne_entity
            data:
              value: '{{ target_consigne }}'
      default:
      - service: input_select.select_option
        target:
          entity_id: !input mode_entity
        data:
          option: Presence
    - if:
      - condition: template
        value_template: '{{ all_notify_entities | count > 0 }}'
      then:
      - repeat:
          for_each: '{{ all_notify_entities }}'
          sequence:
          - service: '{{ repeat.item }}'
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: '{{ notif_tag }}'
mode: queued
max: 20
max_exceeded: warning
