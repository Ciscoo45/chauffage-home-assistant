
################################################################################
### GESTION ABSENCE AUTO - CONTRÔLE MANUEL PRÉSENCE/ABSENCE
################################################################################
### Remplacez person.michel par binary_sensor.michel_presence_effective pour prendre en compte l'override manuel.


## ========== ANCRES ==========

presence_override_defaults: &presence_override_defaults
  options:
    - Auto (GPS)
    - Forcer Présent
    - Forcer Absent
  initial: Auto (GPS)


## ========== par PERSONNE/GROUPE ==========

presence_override_michel:
  <<: *presence_override_defaults
  name: "Michel - Mode Présence"
  icon: mdi:account-arrow-right

presence_override_francois:
  <<: *presence_override_defaults
  name: "François - Mode Présence"
  icon: mdi:account-arrow-right

presence_override_groupe:
  <<: *presence_override_defaults
  name: "Groupe Mell - Mode Présence"
  icon: mdi:home-account




################################################################################
### GESTION ABSENCE AUTO - SÉLECTION UTILISATEUR PRINCIPAL
################################################################################

## NOTE : Pour ajouter un utilisateur, modifiez la liste 
## Liste actuelle : Aucun, Michel, François



## ========== ANCRES ==========

# Liste des utilisateurs (à modifier ici uniquement)
utilisateur_defaults: &utilisateur_defaults
  options:
    - Aucun
    - Michel
    - François
  icon: mdi:account

# Liste des modes de chauffage (à modifier ici uniquement)
mode_avant_absence_defaults: &mode_avant_absence_defaults
  options:
    - Presence
    - Absence
    - Manuel
    - Hors-gel
    - Arret
  icon: mdi:restore



