    # -------------------------------------------------
    # Chambre Ss-Sol -> chambre_sssol
    # -------------------------------------------------
    - name: "Chauffage Absence Auto - Chambre Ss-Sol Status"
      unique_id: chauffage_absence_auto_chambre_sssol_status
      state: >-
        {% set global_off = is_state('input_boolean.chauffage_absence_auto_global_actif', 'off') %}
        {% set local_off = is_state('input_boolean.radiateur_chambre_sssol_absence_auto_actif', 'off') %}
        {% set boost_on = is_state('input_boolean.boost_chambre_sssol', 'on') if states('input_boolean.boost_chambre_sssol') not in ['unknown', 'unavailable'] else false %}
        {% set tous_absents = is_state('binary_sensor.chauffage_tous_utilisateurs_absents', 'on') %}
        {% set principal = states('input_select.radiateur_chambre_sssol_utilisateur_principal') %}
        {% set si_principal = is_state('input_boolean.radiateur_chambre_sssol_absence_si_principal_absent', 'on') %}
        {% set principal_absent =
          (principal == 'Michel' and not is_state('binary_sensor.michel_presence_effective', 'on')) or
          (principal == 'François' and not is_state('binary_sensor.francois_presence_effective', 'on'))
        %}
        {% if global_off or local_off %}
          Off
        {% elif boost_on %}
          Boost
        {% elif tous_absents %}
          TousAbs
        {% elif si_principal and principal_absent %}
          Absence
        {% else %}
          Présent
        {% endif %}
      icon: mdi:account-off-outline

    - name: "Chauffage Absence Auto - Chambre Ss-Sol Détail"
      unique_id: chauffage_absence_auto_chambre_sssol_detail
      state: >-
        {% set global_off = is_state('input_boolean.chauffage_absence_auto_global_actif','off') %}
        {% set local_off = is_state('input_boolean.radiateur_chambre_sssol_absence_auto_actif','off') %}
        {% set boost_on = is_state('input_boolean.boost_chambre_sssol','on') if states('input_boolean.boost_chambre_sssol') not in ['unknown','unavailable'] else false %}
        {% set tous_absents = is_state('binary_sensor.chauffage_tous_utilisateurs_absents','on') %}
        {% set principal = states('input_select.radiateur_chambre_sssol_utilisateur_principal') %}
        {% set si_principal = is_state('input_boolean.radiateur_chambre_sssol_absence_si_principal_absent','on') %}
        {% set reduction = states('input_number.chauffage_absence_auto_reduction_degrees') | float(2) %}
        {% set mode_actuel = states('input_select.radiateur_chambre_sssol_mode') %}

        {% set etait_presence = is_state('input_boolean.radiateur_chambre_sssol_etait_presence','on') %}
        {% set mode_inactif = mode_actuel in ['Hors-gel','Arret'] %}

        {% set principal_absent =
          (principal == 'Michel' and not is_state('binary_sensor.michel_presence_effective', 'on')) or
          (principal == 'François' and not is_state('binary_sensor.francois_presence_effective', 'on'))
        %}

        {% set absence_active = tous_absents or (si_principal and principal_absent) %}

        {% if global_off %}
          Gestion Absence désactivée globalement
        {% elif local_off %}
          Gestion Absence désactivée pour cette pièce
        {% elif mode_inactif %}
          Mode {{ mode_actuel }} - pas de réduction
        {% elif boost_on %}
          Boost actif - réduction Absence ignorée
        {% elif absence_active and mode_actuel == 'Absence' and etait_presence %}
          {% if tous_absents %}Tous absents{% else %}{{ principal }} absent{% endif %} - passage en mode Absence
        {% elif absence_active and mode_actuel in ['Absence','Manuel'] and (not etait_presence) %}
          {% if tous_absents %}Tous absents{% else %}{{ principal }} absent{% endif %} - réduction de {{ reduction }}°C appliquée
        {% elif absence_active and mode_actuel == 'Presence' %}
          {% if tous_absents %}Tous absents{% else %}{{ principal }} absent{% endif %} - correction en cours
        {% else %}
          Présence détectée - pas de réduction
        {% endif %}
      icon: mdi:information-outline

    - name: "Chauffage Absence Auto - Chambre Ss-Sol Consignes"
      unique_id: chauffage_absence_auto_chambre_sssol_consignes
      state: >-
        {% set base = states('input_number.radiateur_chambre_sssol_consigne') | float(0) %}
        {% set finale = states('input_number.radiateur_chambre_sssol_consigne_finale') | float(0) %}
        {{ base }}°C → {{ finale }}°C
      icon: mdi:arrow-right-thin


