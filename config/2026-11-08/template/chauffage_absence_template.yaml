    # Tous utilisateurs absents (réellement DYNAMIQUE pour x5 users)
    - name: "Chauffage - Tous Utilisateurs Absents"
      unique_id: chauffage_tous_utilisateurs_absents
      state: >-
        {% set entities = states('input_text.chauffage_absence_auto_utilisateurs_entities').replace(' ', '').split(',') %}
        {% set entities = entities | reject('in', ['', 'unknown', 'unavailable']) | list %}
        {% set nb_users = entities | select('match','^(binary_sensor|person)\\.') | list | length %}

        {% if nb_users == 0 %}
          false
        {% else %}
          {% set absents = namespace(count=0) %}
          {% for i in range(1, nb_users + 1) %}
            {% set sensor = 'binary_sensor.chauffage_utilisateur' ~ i ~ '_absent' %}
            {% if is_state(sensor, 'on') %}
              {% set absents.count = absents.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ absents.count == nb_users }}
        {% endif %}
      availability: >-
        {% set entities = states('input_text.chauffage_absence_auto_utilisateurs_entities').replace(' ', '').split(',') %}
        {% set entities = entities | reject('in', ['', 'unknown', 'unavailable']) | list %}
        {% set nb_users = entities | select('match','^(binary_sensor|person)\\.') | list | length %}

        {% if nb_users == 0 %}
          false
        {% else %}
          {% set available = namespace(ok=true) %}
          {% for i in range(1, nb_users + 1) %}
            {% set sensor = 'binary_sensor.chauffage_utilisateur' ~ i ~ '_absent' %}
            {% if states(sensor) in ['unknown','unavailable'] %}
              {% set available.ok = false %}
            {% endif %}
          {% endfor %}
          {{ available.ok }}
        {% endif %}
      icon: >-
        {% if is_state('binary_sensor.chauffage_tous_utilisateurs_absents','on') %}
          mdi:home-off-outline
        {% else %}
          mdi:home-group
        {% endif %}







