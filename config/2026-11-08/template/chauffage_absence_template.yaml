- sensor:


# ========================================
# SENSORS GESTION ABSENCE AUTO - DYNAMIQUES
# ========================================

## =================== GLOBAL ====================

# État global de présence : sensor.chauffage_absence_auto_etat_global
    - name: "Chauffage Absence Auto - État Global"
      unique_id: chauffage_absence_auto_etat_global
      state: >-
        {% set tous_absents = is_state('binary_sensor.chauffage_tous_utilisateurs_absents', 'on') %}
        {% if tous_absents %}
          Tous absents
        {% else %}
          {# Liste des présents via presence_effective #}
          {% set michel_present = is_state('binary_sensor.michel_presence_effective', 'on') %}
          {% set francois_present = is_state('binary_sensor.francois_presence_effective', 'on') %}
          {% set presents = [] %}
          {% if michel_present %}
            {% set presents = presents + ['Michel'] %}
          {% endif %}
          {% if francois_present %}
            {% set presents = presents + ['François'] %}
          {% endif %}
          
          {# Calcul état #}
          {% set nb_total = 2 %}
          {% set nb_presents = presents|length %}
          {% set nb_absents = nb_total - nb_presents %}
          
          {% if nb_presents == nb_total %}
            Tous présents
          {% elif nb_presents == 0 %}
            Tous absents
          {% elif nb_absents == 1 %}
            {% set absents = [] %}
            {% if not michel_present %}{% set absents = absents + ['Michel'] %}{% endif %}
            {% if not francois_present %}{% set absents = absents + ['François'] %}{% endif %}
            {{ absents[0] }} absent
          {% else %}
            {{ presents|join(', ') }} présent{{ 's' if nb_presents > 1 else '' }}
          {% endif %}
        {% endif %}
      icon: mdi:home-account





