
#################################################################
### SENSORS TEMPO - AFFICHAGE UI
#################################################################


- sensor:


## ============== par PIÈCE ==============


# pour Chambre Ss-Sol

    - name: "Tempo Chambre Ss-Sol Status"
      unique_id: tempo_chambre_sssol_status
      state: >-
        {% set global_actif = is_state('input_boolean.tempo_global_actif', 'on') %}
        {% set local_actif = is_state('input_boolean.radiateur_chambre_sssol_tempo_actif', 'on') %}
        {% set boost_actif = is_state('input_boolean.boost_chambre_sssol', 'on') %}
        {% set couleur = states('sensor.tempo_couleur_actuelle_texte') %}
        {% set periode = states('sensor.tempo_periode_actuelle') %}
        {% set hp = 'Pleine' in periode %}
        {% set reduction_blanc = states('input_number.radiateur_chambre_sssol_reduction_tempo_blanc') | float(0) %}
        {% set reduction_rouge = states('input_number.radiateur_chambre_sssol_reduction_tempo_rouge') | float(0) %}
        
        {% if not global_actif %}
          GblOff
        {% elif not local_actif %}
          PiècOff
        {% elif boost_actif %}
          Boost
        {% elif not hp %}
          HC
        {% elif couleur == 'Bleu' %}
          Bleu
        {% elif couleur == 'Blanc' and reduction_blanc > 0 %}
          HP-{{ reduction_blanc | round(1) }}°
        {% elif couleur == 'Rouge' and reduction_rouge > 0 %}
          HP-{{ reduction_rouge | round(1) }}°
        {% elif couleur == 'Blanc' %}
          Blanc
        {% elif couleur == 'Rouge' %}
          Rouge
        {% else %}
          Off
        {% endif %}
      icon: mdi:transmission-tower

    - name: "Tempo Chambre Ss-Sol Detail"
      unique_id: tempo_chambre_sssol_detail
      state: >-
        {% set global_off = is_state('input_boolean.tempo_global_actif', 'off') %}
        {% set local_off = is_state('input_boolean.radiateur_chambre_sssol_tempo_actif', 'off') %}
        {% set boost_on = is_state('input_boolean.boost_chambre_sssol', 'on') %}
        {% set couleur = states('sensor.tempo_couleur_actuelle_texte') %}
        {% set periode = states('sensor.tempo_periode_actuelle') %}
        {% set hp = 'Pleine' in periode %}
        
        {% if global_off %}
          Gestion Tempo désactivée globalement
        {% elif local_off %}
          Gestion Tempo désactivée pour cette pièce
        {% elif boost_on %}
          Boost actif - réduction Tempo ignorée
        {% elif not hp %}
          Heures Creuses - pas de réduction
        {% elif couleur == 'Bleu' %}
          Jour Bleu - pas de réduction
        {% elif couleur == 'Blanc' %}
          {% set red = states('input_number.radiateur_chambre_sssol_reduction_tempo_blanc') | float(0) %}
          Jour Blanc HP - réduction de {{ red }}°C appliquée
        {% elif couleur == 'Rouge' %}
          {% set red = states('input_number.radiateur_chambre_sssol_reduction_tempo_rouge') | float(0) %}
          Jour Rouge HP - réduction de {{ red }}°C appliquée
        {% else %}
          Informations Tempo indisponibles
        {% endif %}
      icon: mdi:information-outline

    - name: "Tempo Chambre Ss-Sol Consignes"
      unique_id: tempo_chambre_sssol_consignes
      state: >-
        {% set base = states('input_number.radiateur_chambre_sssol_consigne') | float(0) %}
        {% set calc = states('input_number.radiateur_chambre_sssol_consigne_calculee') | float(0) %}
        {{ base }}°C → {{ calc }}°C
      icon: mdi:arrow-right-thin


