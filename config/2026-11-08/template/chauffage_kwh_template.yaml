- sensor:


##################################################################################
### Définition des Helpers SENSOR pour le Blueprint Chauffage by C. : compteurs de kWh
### **** penser à changer la puissance de chauffe pour chacune des pièces ****
##################################################################################
# https://www.home-assistant.io/docs/energy/faq

  # pour Chauffage TOTAL : sensor.chauffage_total_kwh
  - name: "Chauffage Total kWh"
    unique_id: chauffage_total_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    icon: mdi:flash
    state: >-
      {{
        states('sensor.radiateur_chambre_sssol_kwh_total') | float(0) +
        states('sensor.radiateur_bureau_kwh_total') | float(0) +
        states('sensor.radiateur_cuisine_kwh_total') | float(0) +
        states('sensor.radiateur_salon_kwh_total') | float(0) +
        states('sensor.radiateur_sdb_kwh_total') | float(0) +
        states('sensor.radiateur_michel_kwh_total') | float(0) +
        states('sensor.radiateur_voitures_kwh_total') | float(0) +
        states('sensor.radiateur_couloir_kwh_total') | float(0) +
        states('sensor.radiateur_atelier_kwh_total') | float(0) +
        states('sensor.radiateur_garconniere_kwh_total') | float(0) +
        states('sensor.radiateur_telmo_kwh_total') | float(0) +
        states('sensor.radiateur_sdb_etg_kwh_total') | float(0) +
        states('sensor.radiateur_boites_kwh_total') | float(0) +
        states('sensor.radiateur_couloir_etg_kwh_total') | float(0)
      }}




