#####################################################################################################################
### Sensor viruel pour le suivi sur le tableau Energie de la consommation de l'onduleur informatique SEUL (100W 24/7)

# - sensor:

  # pour l'onduleur SEUL : sensor.onduleur_kwh_total
  - name: Onduleur seul kWh consommés
    # default_entity_id: sensor.onduleur_kwh_total
    unique_id: onduleur_kwh_total  # pour pouvoir gérer les paramètres via l'UI, dont le choix de la pièce
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: 'kWh'
    state: >
      {{
        (now() - '2025-11-24 00:00:00'|as_datetime|as_local).total_seconds() / 3600 * 0.1
      }}
      