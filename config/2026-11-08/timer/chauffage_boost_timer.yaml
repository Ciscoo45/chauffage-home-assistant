
### ========================================
### TIMERS BOOST PAR PIÈCE
### ========================================
### Helpers timer pour le Blueprint Chauffage Boost



## ========== ANCRES ==========

boost_timer_defaults: &boost_timer_defaults
  duration: "00:00:00"  # Durée par défaut (0 = désarmé au démarrage)
  restore: true         # Restaure l'état après redémarrage
  icon: mdi:timer-sand



## ==========  PAR PIÈCE ==========


# pour Chambre Ss-Sol
boost_chambre_sssol:
