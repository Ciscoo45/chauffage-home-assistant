- id: '1759685882645'
  alias: Thermostat TPI Atelier
  description: ''
  use_blueprint:
    path: Ciscoo45/Thermostat_TPI__by_C.yaml
    input:
      coeff_c: 0.8
      coeff_t: 0.025
      entity_consigne: input_number.radiateur_atelier_consigne
      entity_temp_ext: sensor.temperature_exterieure_virtuelle_consolidee
      entity_temp_int: sensor.temperature_sonoff_atelier
      entity_fenetre: binary_sensor.fenetre_virtuelle_onoff
      entity_puissance: input_number.radiateur_atelier_puissance
      entity_chauffage:
      - switch.radiateur_inv_atelier
      entity_mode_inverse: true

