- id: '1740244180996'
  alias: Chauffage boost SdB
  description: ''
  triggers:
  - device_id: 9a717b09b02a3c4f5238e95817fc9354
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    trigger: device
  conditions: []
  actions:
  - action: input_select.select_option
    metadata: {}
    data:
      option: Manuel
    target:
      entity_id: input_select.radiateur_sdb_mode
  - action: input_number.set_value
    metadata: {}
    data:
      value: 21
    target:
      entity_id: input_number.radiateur_sdb_consigne
  - delay:
      hours: 0
      minutes: 35
      seconds: 0
      milliseconds: 0
  - action: input_select.select_option
    metadata: {}
    data:
      option: Presence
    target:
      entity_id: input_select.radiateur_sdb_mode
  mode: single

