                  > 0 %}
                    var(--state-active-color)
                  {% else %}
                    var(--state-inactive-color)
                  {% endif %}
                secondary: >
                  {% set last_updated =
                  states['sensor.temperature_sonoff_bureau'].last_updated %} {%
                  if last_updated %}
                    {% set diff = as_timestamp(now()) - as_timestamp(last_updated) %}
                    {% if diff < 60 %}
                      Il y a {{ diff | round }} sec
                    {% elif diff < 3600 %}
                      Il y a {{ (diff / 60) | round }} minutes
                    {% elif diff < 86400 %}
                      Il y a {{ (diff / 3600) | round }} heures
                    {% else %}
                      Il y a {{ (diff / 86400) | round }} jours
                    {% endif %}
