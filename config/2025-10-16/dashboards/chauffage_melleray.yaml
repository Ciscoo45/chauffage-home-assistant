                            {% set b = ((1 - ratio) * 255 + ratio * 53) | round %}
                            rgb({{ r }}, {{ g }}, {{ b }})
                          {% else %}
                            {# Interpolation entre jaune (#fdd835) et rouge (#f04141) de 18°C à 20°C #}
